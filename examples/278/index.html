<!DOCTYPE html>
<!--
  파일: index.html (정답 파일)
  무엇: '좋아요 카운터' 페이지. '좋아요 +1'을 누르면 숫자가 1씩 오르고 '리셋'은 0으로 되돌립니다.
  왜 있나: 실습 278은 '디버깅 챌린지'입니다. 같은 폴더의 broken.html에 일부러 넣어 둔
          구문 오류(SyntaxError) 2개를 고친 '정답'이 바로 이 파일이며,
          학습자가 자신의 수정 결과와 비교해 보라고 둔 모범 답안입니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>좋아요 카운터 — (고친 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #eef1f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 48px 16px;
    }
    .count {
      font-size: 48px;
      font-weight: bold;
      color: #6c4ad6;
    }
    button {
      font-size: 16px;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #6c4ad6;
      color: #fff;
      cursor: pointer;
    }
    button:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <h1>좋아요 카운터</h1>
  <p class="count" id="count">0</p>
  <button id="likeBtn">좋아요 +1</button>
  <button id="resetBtn">리셋</button>

  <script>
    // 구문 오류를 모두 고친 정답 버전입니다.
    // 이제 두 버튼이 정상으로 동작합니다.

    let count = 0;

    const countEl = document.getElementById("count");
    const likeBtn = document.getElementById("likeBtn");
    const resetBtn = document.getElementById("resetBtn");

    // FIXED ①: "click" 의 닫는 큰따옴표를 채워 따옴표 짝을 맞췄습니다. ("click")
    likeBtn.addEventListener("click", function () {
      count = count + 1;
      countEl.textContent = count;
    });

    // FIXED ②: 함수 본문을 닫는 '}' 와 addEventListener 를 닫는 ')' 그리고 ';' 를 채웠습니다.
    resetBtn.addEventListener("click", function () {
      count = 0;
      countEl.textContent = count;
    });
  </script>
</body>
</html>
