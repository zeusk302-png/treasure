<!DOCTYPE html>
<!--
  이 파일은 무엇인가: 사용자가 보는 '문의하기' 폼 화면(정적 페이지)입니다.
  왜 있는가: 방문자가 이름/이메일/문의를 적어 보내면, script.js가 그 내용을
            n8n Webhook으로 전송하고 → n8n이 슬랙 알림 + 구글 시트 저장 + 응답을
            동시에 처리합니다. 즉 이 HTML은 '입력 창구', 실제 자동화는 n8n이 합니다.
  구성: 화면 모양은 style.css, 동작(전송)은 script.js가 담당합니다(역할 분리).
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 — 시트에 저장 + 알림 받기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>문의하기</h1>
    <p class="lead">
      아래 폼을 작성해 보내면, 내용이 구글 시트에 한 줄씩 쌓이고
      동시에 슬랙(또는 메일)으로 알림이 갑니다.
    </p>

    <!-- 폼 자체는 205 실습과 똑같습니다. 같은 데이터를 보내고,
         n8n 쪽에서 '받는 곳'을 한 군데(시트) 더 늘린 것이 이번 실습입니다. -->
    <!-- novalidate: 브라우저의 자동 오류 팝업을 끄는 속성입니다.
         왜 끄나: 검증 시점을 script.js가 직접 잡아(form.checkValidity) 우리가 원하는
         흐름(버튼 잠그기·상태 문구 표시)으로 통제하기 위해서입니다. -->
    <form id="contactForm" novalidate>
      <label for="name">이름</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="홍길동"
        required
        minlength="2"
      />

      <label for="email">이메일</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      />

      <label for="message">문의 내용</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        placeholder="궁금한 점이나 하고 싶은 말을 적어 주세요."
        required
        minlength="5"
      ></textarea>

      <button type="submit" id="submitBtn">보내기</button>

      <!-- 제출 결과(성공/실패)를 사용자에게 보여 주는 영역입니다. -->
      <!-- aria-live="polite": 화면 낭독기(시각장애인용)에 내용이 바뀌었음을
           자동으로 읽어 주게 하는 접근성 속성입니다. 눈으로만 보는 사람뿐 아니라
           모두가 결과를 알 수 있도록 넣었습니다. -->
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
