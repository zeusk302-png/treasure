<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>굵게·기울임·강조로 문장 꾸미기</title>
</head>
<body>
  <h1>오늘의 공지</h1>

  <!--
    strong = 중요해서 "강하게" 강조하는 단어 → 보통 굵게(bold) 보입니다.
    em     = 말의 어조를 살리는 "은근한" 강조 → 보통 기울임(italic)으로 보입니다.
    br     = 한 문단 안에서 줄만 바꿉니다. (문단을 나누는 것이 아니라 줄바꿈만)
  -->
  <p>
    안녕하세요. 이번 주 모임은 <strong>토요일 오후 2시</strong>에 시작합니다.<br />
    장소는 <strong>3층 회의실</strong>이니 시간에 늦지 않게 와주세요.
  </p>

  <p>
    준비물은 <em>각자 마실 음료</em> 정도면 충분합니다.<br />
    그리고 <strong>노트북은 <em>꼭</em> 챙겨오세요.</strong> 실습이 있습니다.
  </p>

  <p>
    참고로, 이날은 <strong>주차가 어렵습니다.</strong><br />
    가능하면 <em>대중교통</em>을 이용해 주시면 좋겠습니다.
  </p>
</body>
</html>
