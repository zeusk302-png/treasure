<!DOCTYPE html>
<!--
  이 파일은 무엇인가: GitHub에 드래그앤드롭으로 올려 볼 '내 첫 정적 페이지'의 본문(글·구조)입니다.
  왜 있는가: 실습 167의 목적이 "내가 만든 코드 파일을 인터넷(GitHub)에 올려 본다"이므로,
            올릴 대상이 되는 가장 단순한 예시 페이지가 필요해서 준비해 둔 파일입니다.
  짝꿍 파일: 같은 폴더의 style.css(디자인). 두 파일을 함께 올려야 디자인까지 제대로 보입니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 첫 깃허브 페이지</title>
  <!-- 같은 폴더에 있는 style.css 파일을 불러옵니다. 두 파일을 함께 올려야 디자인이 적용됩니다. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>안녕하세요! 👋</h1>
    <p class="lead">이 페이지는 제가 만든 첫 번째 정적 페이지입니다.</p>
    <p>이 파일(<code>index.html</code>)과 디자인 파일(<code>style.css</code>)을<br />
       드래그앤드롭으로 GitHub에 올렸습니다.</p>
    <p class="badge">📦 내 코드가 인터넷 창고(GitHub)에 저장되었습니다!</p>
  </main>

  <footer class="foot">
    <!-- [내 이름]·[날짜]는 자리표시자(placeholder)입니다. 내 정보로 바꿔도 되고, 그대로 둬도 실습에는 문제없습니다.
         일부러 빈칸처럼 남겨 둔 이유: 내 손으로 페이지를 고쳐 보는 첫 경험을 주기 위해서입니다. -->
    <p>만든 사람: <strong>[내 이름]</strong> · 만든 날: <strong>[날짜]</strong></p>
  </footer>
</body>
</html>
