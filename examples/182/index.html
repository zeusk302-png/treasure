<!-- 올바르게 채운 "기본 메타 3종 세트" 예시 페이지 -->
<!-- lang="ko"  : 이 페이지는 한국어다 (브라우저·번역기·스크린리더에게 알림) -->
<!doctype html>
<html lang="ko">
  <head>
    <!-- charset=utf-8 : 글자 인코딩을 UTF-8로 (한글이 안 깨지게) -->
    <!-- 주의: charset 메타는 <head> 안에서 "맨 위"에 와야 한다 -->
    <meta charset="utf-8" />

    <!-- viewport : 모바일에서 화면 너비에 맞춰 보이게 (확대된 채로 안 열리게) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>기본 메타 3종 세트 예시</title>
  </head>
  <body>
    <h1>안녕하세요 👋 한글이 안 깨집니다</h1>
    <p>
      이 페이지는 <code>lang</code>, <code>charset</code>,
      <code>viewport</code> 세 가지 기본 메타를 올바르게 넣은 예시입니다.
    </p>
    <p>
      휴대폰에서 열어도 글자가 너무 작거나 옆으로 잘리지 않고, 화면 너비에 맞게
      보입니다.
    </p>
  </body>
</html>
