<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 — Supabase Auth 실습</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
    h1 { color: #7b5e3b; }
    label { display: block; margin-top: 12px; font-weight: 600; font-size: 0.95rem; }
    input { width: 100%; padding: 9px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; margin-top: 14px; padding: 11px 18px; background: #7b5e3b; color: #fff; border: 0; border-radius: 999px; font-size: 1rem; cursor: pointer; }
    button:disabled { background: #bbb; cursor: not-allowed; }
    #msg { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
    #msg.ok { background: #e8f5e9; color: #2e7d32; display: block; }
    #msg.err { background: #fdecea; color: #c62828; display: block; }
  </style>
</head>
<body>
  <h1>회원가입</h1>
  <p>이메일과 비밀번호로 첫 사용자를 만들어 봅니다.</p>

  <form id="form">
    <label for="email">이메일</label>
    <input id="email" type="email" placeholder="you@example.com" required />

    <label for="password">비밀번호 (6자 이상)</label>
    <input id="password" type="password" placeholder="••••••" minlength="6" required />

    <button type="submit" id="submitBtn">가입하기</button>
  </form>

  <div id="msg"></div>

  <!-- Supabase 자바스크립트 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ▼ 아래 두 값을 내 Supabase 프로젝트 값으로 바꾸세요. (Settings → API)
    //   anon(publishable) 키는 "공개돼도 되는 출입증"이라 브라우저에 둬도 됩니다.
    //   service_role(secret) 키는 절대 여기 두지 마세요 — 모든 보안을 우회하는 비밀 키입니다.
    const SUPABASE_URL = "https://여기에-내-프로젝트.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_여기에-내-anon-키";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('form');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');

    // 화면에 안내 메시지를 보여주는 작은 도우미
    function show(text, ok) {
      msg.textContent = text;
      msg.className = ok ? 'ok' : 'err';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;          // 중복 클릭 방지
      btn.textContent = '가입 중…';

      // 핵심 한 줄: signUp 으로 Supabase Auth에 사용자를 만든다.
      const { data, error } = await db.auth.signUp({
        email: email,
        password: password
      });

      btn.disabled = false;
      btn.textContent = '가입하기';

      if (error) {
        show('가입 실패: ' + error.message, false);
        return;
      }

      // 이메일 확인이 켜져 있으면 메일로 인증 링크가 갑니다.
      show('가입 요청 완료! 이메일로 온 확인 링크를 눌러주세요. (테스트 중이라면 Supabase 대시보드 → Authentication → Users 에서 바로 확인됩니다.)', true);
      form.reset();
    });
  </script>
</body>
</html>
