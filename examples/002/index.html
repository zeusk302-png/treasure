<!--
  이 파일이 무엇인가: 실습 002 "자기소개 한 문단 페이지"의 전체 코드(index.html 하나)입니다.
  왜 있는가: <h1>(큰 제목)과 <p>(문단)이 화면에서 어떻게 다르게 보이는지 눈으로 익히기 위한 가장 작은 예제입니다.
  어떻게 쓰는가: 이 파일을 더블클릭해 브라우저로 열고, <h1>과 <p> 안의 글을 내 이름·취미로 바꿔 저장 후 새로고침(F5)하면 됩니다.
-->
<!DOCTYPE html>
<!-- lang="ko": 이 페이지가 한국어임을 브라우저/검색엔진/번역기에 알려줍니다(접근성·번역 정확도 때문에 넣음) -->
<html lang="ko">
<head>
  <!-- charset="UTF-8": 글자 인코딩을 UTF-8로 지정. 안 넣으면 한글이 □□처럼 깨질 수 있어 반드시 둡니다 -->
  <meta charset="UTF-8" />
  <!-- viewport: 휴대폰 화면 폭에 맞춰 보이게 하는 설정. 없으면 모바일에서 글씨가 아주 작게 나옵니다 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- title: 브라우저 탭에 보이는 페이지 이름. 본문에는 안 보이고 탭에만 나오는 점이 헷갈리기 쉬워 표시 -->
  <title>자기소개 — 홍길동</title>
  <style>
    /* 글이 잘 읽히게 폭과 줄간격만 살짝 잡아줍니다. (이번 실습의 핵심은 h1/p) */
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; line-height: 1.7; }
    h1 { color: #7b5e3b; }
  </style>
</head>
<body>
  <!-- h1: 페이지의 가장 큰 제목. 한 페이지에 보통 하나. -->
  <h1>안녕하세요, 홍길동입니다</h1>

  <!-- p: 한 덩어리의 문단. 줄글은 p 안에 씁니다. -->
  <p>
    저는 부산에 사는 홍길동이라고 합니다.
    요즘은 비전공자로서 웹개발을 배우며 제 손으로 페이지를 만들어 보고 있어요.
    취미는 등산과 사진 찍기, 그리고 주말에 동네 카페에서 책 읽기입니다.
  </p>
</body>
</html>
