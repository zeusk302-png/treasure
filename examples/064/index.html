<!-- 이 파일(index.html): 회원가입 화면의 '뼈대'(구조)입니다.
     약관 박스, 동의 체크박스, '가입하기' 버튼, 결과 문구 자리를 화면에 배치합니다.
     자바스크립트(script.js)가 여기에 붙은 id(agreeCheck / signupBtn / result)로
     각 요소를 찾아 동작을 연결하기 때문에, 화면(HTML)과 동작(JS)을 분리해 둔 것입니다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>약관 동의 후 가입 버튼 활성화</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>회원가입</h1>
    <p class="hint">아래 약관에 동의해야만 '가입하기' 버튼을 누를 수 있어요.</p>

    <!-- 약관 내용 (읽기용) -->
    <div class="terms">
      <p><strong>이용약관(요약)</strong></p>
      <p>
        본 서비스는 학습용 예제입니다. 가입 시 입력한 정보는 저장되지 않으며,
        실제 회원가입이 이루어지지 않습니다. 동의 후 가입 버튼이 활성화되는
        동작만 확인하는 연습입니다.
      </p>
    </div>

    <!-- 체크박스 + 라벨 -->
    <!-- label로 체크박스를 감싸면 글자를 눌러도 체크가 토글됩니다. -->
    <label class="agree">
      <!-- id="agreeCheck" : 자바스크립트가 이 체크박스를 찾을 때 사용합니다 -->
      <input type="checkbox" id="agreeCheck" />
      위 이용약관을 모두 읽었으며 이에 동의합니다.
    </label>

    <!-- 가입 버튼 -->
    <!-- disabled : 처음에는 버튼을 '눌리지 않는 상태(비활성화)'로 둡니다.
         체크박스를 켜면 script.js가 이 disabled를 떼서 누를 수 있게 만듭니다. -->
    <button type="button" id="signupBtn" disabled>가입하기</button>

    <!-- 가입 버튼을 눌렀을 때 안내 문구가 표시될 자리 -->
    <p class="result" id="result"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
