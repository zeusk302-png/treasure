<!DOCTYPE html>
<!-- 이 한 페이지만으로 동작합니다. 더블클릭해서 브라우저로 여세요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 삭제 · 완료 체크 (배열 수정 실습)</title>
  <style>
    /* 꾸밈은 핵심이 아니라 보기 편하라고 넣은 최소한의 스타일입니다. */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    .row { display: flex; gap: 8px; margin: 16px 0; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: 0;
      border-radius: 8px;
      background: #4a6cf7;
      color: #fff;
      cursor: pointer;
    }
    /* 할 일이 쌓이는 목록 */
    #todoList {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    #todoList li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fafafa;
    }
    /* 체크박스는 조금 키워서 누르기 쉽게 */
    #todoList li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    /* 할 일 글자는 남은 공간을 모두 차지하게 */
    .todo-text { flex: 1; }
    /* 완료된 할 일은 회색 + 취소선으로 표시 */
    li.done .todo-text {
      color: #aaa;
      text-decoration: line-through;
    }
    /* 삭제 버튼은 빨간 계열 */
    .del-btn {
      background: #e85b5b;
      padding: 6px 12px;
      font-size: 0.9rem;
    }
    .hint { color: #888; font-size: 0.9rem; }
    .empty { color: #888; justify-content: center; }
    .count { color: #555; font-size: 0.95rem; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>할 일 목록 — 삭제 · 완료 체크</h1>
  <p class="hint">
    할 일을 추가한 뒤 <b>체크박스</b>로 완료 표시하거나 <b>[삭제]</b>로 지워 보세요.
    <b>새로고침(F5)</b> 해도 완료 상태까지 그대로 남아 있습니다.
  </p>

  <div class="row">
    <!-- 사용자가 할 일을 입력하는 칸 -->
    <input id="todoInput" type="text" placeholder="할 일을 입력하세요 (예: 우유 사기)" />
    <!-- 추가 버튼 -->
    <button id="addBtn">추가</button>
  </div>

  <!-- 저장된 할 일들이 표시되는 곳 -->
  <ul id="todoList"></ul>

  <!-- 남은 할 일 개수 표시 -->
  <p id="count" class="count"></p>

  <script>
    // 1) 화면 요소들을 미리 찾아 둡니다.
    const todoInput = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const todoList = document.getElementById("todoList");
    const countEl = document.getElementById("count");

    // localStorage에 저장할 때 쓸 "이름표(키)"입니다.
    // 항목마다 완료 여부까지 담는 새 구조라서, 110번과 섞이지 않게 키를 다르게 줬습니다.
    const STORAGE_KEY = "todos_v2";

    // 2) 이번에는 할 일을 "글자" 하나가 아니라 "객체"로 다룹니다.
    //    한 줄의 할 일이 여러 정보를 가지기 때문입니다.
    //    예: { id: 1718000000000, text: "우유 사기", done: false }
    //      - id   : 할 일을 구별하는 고유 번호 (삭제할 때 "어느 줄인지" 찾는 데 씀)
    //      - text : 할 일 내용
    //      - done : 완료했는지 여부 (true = 완료, false = 진행 중)
    //    그리고 이런 객체들을 배열 하나에 모아 둡니다.
    let todos = [];

    // 3) 페이지가 열리자마자 localStorage에서 저장된 할 일을 꺼내 봅니다.
    //    localStorage에는 "글자(문자열)"만 저장되므로,
    //    저장할 땐 JSON 글자로 바꾸고(JSON.stringify), 꺼낼 땐 다시 배열로 되돌립니다(JSON.parse).
    function loadTodos() {
      const saved = localStorage.getItem(STORAGE_KEY); // 저장된 "글자"를 꺼냄 (없으면 null)
      if (saved) {
        todos = JSON.parse(saved); // 글자 → 객체 배열로 되돌리기
      } else {
        todos = []; // 처음 방문이면 빈 배열로 시작
      }
    }

    // 4) 현재 배열(todos)을 localStorage에 저장하는 함수.
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); // ★ 여기서 브라우저에 저장됩니다.
    }

    // 5) 배열(todos)을 보고 화면 목록을 처음부터 다시 그리는 함수.
    function render() {
      todoList.innerHTML = ""; // 일단 화면을 비우고

      if (todos.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "아직 할 일이 없어요. 위에서 추가해 보세요.";
        todoList.appendChild(li);
        updateCount();
        return;
      }

      // 배열에 들어 있는 할 일(객체)을 하나씩 꺼내 <li>로 만들어 붙입니다.
      todos.forEach(function (todo) {
        const li = document.createElement("li");
        // 완료된 항목이면 li에 'done' 클래스를 붙여 취소선 스타일이 적용되게 함
        if (todo.done) {
          li.className = "done";
        }

        // (a) 완료 체크박스
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done; // 저장된 완료 여부를 반영
        // 체크박스를 누르면 이 항목의 완료 상태를 뒤집습니다.
        checkbox.addEventListener("change", function () {
          toggleDone(todo.id);
        });

        // (b) 할 일 글자
        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text;

        // (c) 삭제 버튼
        const delBtn = document.createElement("button");
        delBtn.className = "del-btn";
        delBtn.textContent = "삭제";
        delBtn.addEventListener("click", function () {
          deleteTodo(todo.id);
        });

        // 한 줄(li)에 체크박스 + 글자 + 삭제버튼을 차례로 넣습니다.
        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(delBtn);
        todoList.appendChild(li);
      });

      updateCount();
    }

    // 6) "남은 할 일 N개" 표시.
    //    filter로 done이 false인 것만 골라 개수를 셉니다.
    function updateCount() {
      const remaining = todos.filter(function (todo) {
        return !todo.done;
      }).length;
      countEl.textContent = "남은 할 일: " + remaining + "개 (전체 " + todos.length + "개)";
    }

    // 7) [추가] 버튼: 입력칸의 값을 "객체"로 만들어 배열에 넣습니다.
    function addTodo() {
      const text = todoInput.value.trim(); // 앞뒤 공백 제거
      if (!text) {
        alert("할 일을 입력해 주세요.");
        return;
      }
      // 새 할 일 객체. id는 현재 시각(밀리초)으로 만들어 서로 겹치지 않게 합니다.
      const newTodo = {
        id: Date.now(),
        text: text,
        done: false
      };
      todos.push(newTodo); // ★ 배열 끝에 새 할 일 객체를 추가
      saveTodos();          // 바뀐 배열을 저장
      render();             // 화면 다시 그리기
      todoInput.value = ""; // 입력칸 비우기
      todoInput.focus();    // 바로 다음 할 일을 칠 수 있게 커서 두기
    }

    // 8) 완료 체크 토글: 해당 id의 할 일만 done 값을 반대로 바꿉니다.
    //    map은 배열의 모든 항목을 하나씩 살펴보며 "새 배열"을 만들어 돌려줍니다.
    //    내가 누른 항목(id가 같은 것)만 done을 뒤집고, 나머지는 그대로 둡니다.
    function toggleDone(id) {
      todos = todos.map(function (todo) {
        if (todo.id === id) {
          // 누른 항목: 기존 내용은 그대로 두고 done만 반대로 (true↔false)
          return { id: todo.id, text: todo.text, done: !todo.done };
        }
        return todo; // 다른 항목은 손대지 않고 그대로 반환
      });
      saveTodos(); // 바뀐 배열 저장
      render();    // 화면 다시 그리기 (취소선/개수 갱신)
    }

    // 9) 개별 삭제: 해당 id의 할 일만 배열에서 빼냅니다.
    //    filter는 "조건이 참인 항목만 남긴" 새 배열을 만들어 줍니다.
    //    여기서는 "id가 지우려는 id와 다른 것만 남기기" → 결국 그 항목만 빠집니다.
    function deleteTodo(id) {
      todos = todos.filter(function (todo) {
        return todo.id !== id; // 지울 항목만 false가 되어 제외됨
      });
      saveTodos(); // 바뀐 배열 저장
      render();    // 화면 다시 그리기
    }

    // 10) 버튼 클릭과 Enter 키 모두로 추가할 수 있게 연결합니다.
    addBtn.addEventListener("click", addTodo);
    todoInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        addTodo();
      }
    });

    // 11) 시작: 저장된 할 일을 불러와서 화면에 그립니다.
    loadTodos();
    render();
  </script>
</body>
</html>
