<!DOCTYPE html>
<!--
  이 파일은 무엇인가:
  실습 281에서 '일부러 고장 낸' 연습용 페이지입니다. 휴대폰(좁은 화면)에서 열면
  좌우로 밀리는 가로 스크롤이 생기도록 의도적으로 버그 3개를 심어 두었습니다.
  왜 있나:
  학습자가 먼저 이 버그를 직접 찾아 고쳐 보게 하려는 '디버깅 챌린지'용 파일이라서요.
  고치고 나면 같은 폴더의 index.html(+ style.css) 정답과 비교하면 됩니다.
  심어 둔 버그: 아래 BUG 1(viewport 없음)·BUG 2(.page 고정 width)·BUG 3(.photo 고정 width) 주석 참고.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!--
    BUG 1: viewport 메타 태그가 통째로 빠져 있습니다.
    이게 없으면 휴대폰 브라우저는 "이 페이지는 데스크톱용"이라고 멋대로 판단해,
    화면을 980px 같은 넓은 가짜 너비로 그린 뒤 통째로 축소해서 보여줍니다.
    그래서 글씨가 깨알같이 작아지고, 가로 스크롤이 생기기 쉽습니다.

    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 가
    여기 있어야 합니다. (지금은 없음 → 이게 첫 번째 원인)
  -->
  <title>우리 동네 빵집 — (고장난 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #fdf6ec;
      color: #3a2e22;
    }

    /*
      BUG 2: 페이지 전체를 감싸는 박스에 고정 너비 width: 1200px 를 박았습니다.
      휴대폰 화면은 보통 360~430px 정도인데, 이 박스는 무조건 1200px 를 차지하려 합니다.
      → 화면 밖으로 삐져나가서 좌우로 미는 '가로 스크롤'이 생깁니다.
      → width 대신 max-width 를 써야 "최대 1200px, 화면이 좁으면 화면에 맞춤"이 됩니다.
    */
    .page {
      width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: #ffb703;
      color: #3a2e22;
      padding: 48px 32px;
      border-radius: 16px;
      text-align: center;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 36px;
    }

    .menu {
      display: flex;
      gap: 16px;
      margin-top: 24px;
    }

    .menu .item {
      flex: 1;
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    /*
      BUG 3: 본문 이미지에 고정 width: 1000px 를 박았습니다.
      좁은 화면에서도 그림이 1000px 를 차지해 화면 밖으로 삐져나갑니다.
      → max-width: 100% 로 바꿔 "화면 폭을 넘지 않게" 해야 합니다.
    */
    .photo {
      display: block;
      width: 1000px;
      height: auto;
      border-radius: 12px;
      margin-top: 24px;
    }

    .footer {
      margin-top: 32px;
      text-align: center;
      font-size: 14px;
      color: #8a7a66;
    }
  </style>
</head>
<body>
  <!--
    BUG 요약:
    1) <head> 에 viewport 메타 태그가 없어서 휴대폰이 페이지를 '데스크톱 너비'로 그림.
    2) .page 에 고정 width: 1200px → 좁은 화면을 뚫고 나가 가로 스크롤 발생.
    3) .photo 이미지에 고정 width: 1000px → 이미지가 화면 밖으로 삐져나감.
    → 휴대폰에서 열면 좌우로 밀리는(가로 스크롤) 페이지가 됩니다.
  -->
  <div class="page">
    <section class="hero">
      <h1>우리 동네 빵집, 보리</h1>
      <p>매일 아침 직접 굽는 따끈한 빵을 만나보세요.</p>
    </section>

    <div class="menu">
      <div class="item"><strong>소금빵</strong><p>겉바속촉 인기 1위</p></div>
      <div class="item"><strong>크루아상</strong><p>버터 향 가득</p></div>
      <div class="item"><strong>단팥빵</strong><p>국산 팥 듬뿍</p></div>
    </div>

    <img
      class="photo"
      src="https://placehold.co/1000x400/ffb703/3a2e22?text=Bakery"
      alt="빵집 내부 사진"
    />

    <p class="footer">© 2026 보리 베이커리 · 부산광역시</p>
  </div>
</body>
</html>
