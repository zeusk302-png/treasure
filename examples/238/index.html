<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>[내 이름] 포트폴리오</title>
  <!-- 같은 저장소(같은 폴더)에 있는 style.css를 불러옵니다.
       index.html과 style.css 두 파일을 함께 올려야 디자인이 적용됩니다. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header class="profile">
      <!-- 사진이 없으면 이 div는 그대로 두어도 됩니다. 글자 이니셜이 동그라미로 보입니다. -->
      <div class="avatar">ME</div>
      <h1>[내 이름]</h1>
      <p class="role">웹 개발을 배우는 중 · 비전공 출신</p>
    </header>

    <section class="intro">
      <h2>소개</h2>
      <p>
        안녕하세요! 저는 코딩을 처음 배우는 사람입니다.
        이 페이지는 제가 직접 만들어 <strong>Vercel</strong>로 인터넷에 배포한
        첫 번째 포트폴리오입니다.
      </p>
    </section>

    <section class="skills">
      <h2>배우고 있는 것</h2>
      <ul class="chips">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>Supabase</li>
        <li>Vercel</li>
      </ul>
    </section>

    <section class="links">
      <h2>링크</h2>
      <p>
        <!-- 아래 주소를 본인 것으로 바꾸세요. 없으면 줄을 지워도 됩니다. -->
        <a href="https://github.com/내아이디" target="_blank" rel="noopener">GitHub</a>
        ·
        <a href="mailto:내이메일@example.com">이메일 보내기</a>
      </p>
    </section>

    <p class="badge">🚀 이 페이지는 Vercel로 배포된 진짜 인터넷 주소를 가지고 있습니다!</p>
  </main>

  <footer class="foot">
    <p>만든 사람: <strong>[내 이름]</strong> · 배포한 날: <strong>[날짜]</strong></p>
  </footer>
</body>
</html>
