<!--
  이 파일은 무엇인가:
  "이름·이메일·메시지"를 받는 문의 폼 화면(index.html)입니다.
  왜 있는가:
  - 사용자가 폼을 제출하면, 브라우저가 fetch 로 "내 서버(/api/contact)"에 내용을 보냅니다.
  - 진짜 메일 발송과 비밀 API 키 사용은 전부 서버(server.js)에서 일어납니다.
    이 화면에는 API 키가 한 글자도 없습니다(= 비밀은 브라우저에 두지 않는다).
  - 같은 서버가 이 화면도 제공하므로, http://localhost:3000 으로 열면 됩니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의 폼 — 확인 메일 자동 발송</title>
  <style>
    :root { --main:#4f46e5; --bg:#f7f7fb; --card:#fff; --line:#e5e7eb; --text:#1f2937; --muted:#6b7280; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background:var(--bg); color:var(--text); line-height:1.6; }
    main { max-width: 520px; margin: 0 auto; padding: 40px 20px 64px; }
    h1 { font-size: 1.4rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    label { display:block; font-weight:600; margin:14px 0 6px; font-size:.92rem; }
    input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line);
                      border-radius:8px; font-size:1rem; font-family:inherit; }
    textarea { min-height: 110px; resize: vertical; }
    button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:8px;
             background:var(--main); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
    /* 안내 메시지 영역. 성공이면 초록, 실패면 빨강 테두리로 보여 줍니다. */
    #status { margin-top:14px; padding:10px 12px; border-radius:8px; font-size:.92rem; display:none; }
    #status.ok  { display:block; background:#ecfdf5; border:1px solid #6ee7b7; color:#065f46; }
    #status.err { display:block; background:#fef2f2; border:1px solid #fca5a5; color:#991b1b; }
    .note { color:var(--muted); font-size:.85rem; margin-top:18px; }
  </style>
</head>
<body>
  <main>
    <h1>문의 남기기</h1>
    <p class="note">제출하면 입력한 이메일로 <strong>확인 메일</strong>이 자동 발송됩니다.</p>

    <div class="card">
      <!-- novalidate: 브라우저 기본 검증 대신 우리가 직접/서버가 검증하게 둡니다(메시지를 일관되게 보여 주려고). -->
      <form id="contactForm" novalidate>
        <label for="name">이름</label>
        <input id="name" name="name" type="text" autocomplete="name" required />

        <label for="email">이메일</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="message">메시지</label>
        <textarea id="message" name="message" required></textarea>

        <button id="submitBtn" type="submit">보내기</button>
      </form>

      <!-- 결과 안내가 표시될 자리. 내용은 자바스크립트가 textContent 로 채웁니다(아래 이유 참고). -->
      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <p class="note">
      이 페이지에는 비밀 API 키가 없습니다. 키는 서버(server.js)의 환경변수에만 있습니다.
      F12 → Sources 에서 <code>re_</code> 를 검색해도 안 나와야 정상입니다.
    </p>
  </main>

  <script>
    const form = document.getElementById("contactForm");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");

    // 안내 메시지를 보여 주는 함수.
    // 중요: textContent 로 넣습니다. innerHTML 로 넣으면, 서버가 돌려준 문자열에 태그가 섞였을 때
    //       그게 실행되는 XSS 위험이 있기 때문입니다. textContent 는 무조건 '글자'로만 취급합니다.
    function showStatus(message, kind) {
      statusEl.textContent = message;       // ← 안전한 출력
      statusEl.className = kind;             // 'ok' 또는 'err' 클래스로 색을 바꿈
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // 폼 기본 동작(페이지 새로고침)을 막고 fetch 로 직접 보냅니다.

      // 입력값을 모읍니다. trim 으로 앞뒤 공백을 제거합니다.
      const payload = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        message: form.message.value.trim(),
      };

      // 화면 단의 1차 검증(서버도 다시 검증합니다 — 서버 검증이 진짜 방어선).
      // 왜 둘 다: 프런트 검증은 빠른 사용자 안내용, 서버 검증은 우회 불가능한 보안용입니다.
      if (!payload.name || !payload.email || !payload.message) {
        showStatus("모든 칸을 채워 주세요.", "err");
        return;
      }

      submitBtn.disabled = true;            // 중복 클릭으로 메일이 여러 번 가는 걸 막습니다.
      showStatus("보내는 중…", "ok");

      try {
        // 내 서버의 /api/contact 로 보냅니다(외부 Resend 주소가 아님 — 키가 새지 않게).
        const res = await fetch("/api/contact", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (data.ok) {
          showStatus("확인 메일을 보냈습니다. 받은편지함(또는 스팸함)을 확인해 주세요.", "ok");
          form.reset(); // 성공 시 입력칸 비우기
        } else {
          // 서버가 돌려준 안내 메시지를 그대로(글자로만) 보여 줍니다.
          showStatus(data.error || "전송에 실패했습니다.", "err");
        }
      } catch (err) {
        // 네트워크 자체가 안 될 때(서버 꺼짐 등).
        showStatus("서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.", "err");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
