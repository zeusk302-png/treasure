<!DOCTYPE html>
<!--
  이 파일은 무엇인가: 블로그의 "글 상세" 페이지입니다.
  왜 있는가: 글 하나의 전체 내용을 보여주는 화면입니다. 이 페이지 하나로
  모든 글을 보여주는 게 핵심 — 어떤 글을 채울지는 주소 뒤 ?id=숫자 값을 보고
  script.js 가 결정합니다. 그래서 여기엔 내용 대신 "빈 자리(id)"만 둡니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- viewport: 휴대폰에서도 글자가 적당한 크기로 보이게 함(모바일 대응의 기본이라 넣음) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 블로그 - 글 상세</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">📖 내 블로그</h1>
  </header>

  <main class="container">
    <!-- 목록으로 돌아가는 링크 (라우팅의 반대 방향) -->
    <a href="index.html" class="back-link">← 목록으로 돌아가기</a>

    <!--
      이 자리에 글 내용이 채워집니다.
      어떤 글을 채울지는 주소 뒤의 ?id=숫자 값을 보고 script.js가 결정합니다.
    -->
    <article class="post-detail">
      <h2 id="post-title">불러오는 중...</h2>
      <p class="post-date" id="post-date"></p>
      <div class="post-body" id="post-body"></div>
    </article>
  </main>

  <footer class="site-footer">
    <p>비전공 청년 웹개발 가이드 · 실습 242</p>
  </footer>

  <!--
    script.js 를 </body> 바로 앞에 두는 이유: HTML(빈 자리)이 먼저 다 만들어진 뒤에
    스크립트가 실행돼야, getElementById 로 그 자리를 확실히 찾아 내용을 채울 수 있기 때문.
    <head> 에 넣으면 자리가 아직 없어서 못 찾을 수 있음.
  -->
  <script src="script.js"></script>
</body>
</html>
