<!DOCTYPE html>
<!--
  이 파일은 무엇인가: 블로그의 "글 목록(메인)" 페이지입니다.
  왜 있는가: 여러 글 중 하나를 고르는 입구 역할입니다. 각 제목 링크가
  같은 detail.html 로 가되 ?id=숫자 만 다르게 가리켜, "한 페이지로 여러 글을
  보여주는" 가장 단순한 라우팅을 체험시키기 위해 둡니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- viewport: 휴대폰에서도 글자가 적당한 크기로 보이게 함(모바일 대응의 기본이라 넣음) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 블로그 - 글 목록</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 모든 페이지가 공유하는 상단 영역 -->
  <header class="site-header">
    <h1 class="site-title">📖 내 블로그</h1>
    <p class="site-desc">목록에서 글 제목을 누르면 상세 페이지로 이동합니다.</p>
  </header>

  <main class="container">
    <h2>글 목록</h2>

    <!--
      핵심: 각 글로 가는 링크.
      같은 detail.html 페이지로 가되, 주소 뒤에 ?id=숫자 를 붙여
      "어떤 글을 보여줄지"를 알려줍니다. 이것이 가장 기초적인 라우팅입니다.
    -->
    <ul class="post-list">
      <li class="post-item">
        <a href="detail.html?id=1">HTML이 처음인 사람에게</a>
        <span class="post-date">2026-06-01</span>
      </li>
      <li class="post-item">
        <a href="detail.html?id=2">CSS로 색과 여백 다루기</a>
        <span class="post-date">2026-06-08</span>
      </li>
      <li class="post-item">
        <a href="detail.html?id=3">자바스크립트로 페이지에 생명 불어넣기</a>
        <span class="post-date">2026-06-15</span>
      </li>
    </ul>
  </main>

  <footer class="site-footer">
    <p>비전공 청년 웹개발 가이드 · 실습 242</p>
  </footer>
</body>
</html>
