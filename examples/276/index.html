<!--
  이 파일은 무엇인가: 실습 276 '닫는 태그 빠진 HTML 고치기'의 **정답(고친) 버전**입니다.
  왜 있는가: 같은 폴더의 broken.html(일부러 닫는 태그를 뺀 버전)과 한 줄씩 비교하면서,
            여는 태그(<div>)와 닫는 태그(</div>)가 한 짝이라는 것을 눈으로 확인하라고 둔 정답 파일입니다.
            broken.html과 다른 점은 단 한 줄 — 첫 번째 .card 상자를 제대로 닫는 </div>가 들어 있다는 것뿐입니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 동네 카페 — (고친 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #f4f1ea;
      color: #2b2b2b;
    }
    /* 가운데 정렬된 본문 상자 */
    .container {
      max-width: 720px;
      margin: 40px auto;        /* 좌우 auto = 화면 가운데로 */
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    /* .card = 메뉴/길찾기 같은 정보 한 덩어리를 담는 작은 상자.
       padding(안쪽 여백)이 있어서, 만약 한 카드가 다른 카드 '안에' 잘못 들어가면
       그 안쪽 여백만큼 오른쪽으로 한 칸 더 밀려 보입니다 — 이게 이번 버그의 '계단처럼 기울어 보이는' 정체입니다. */
    .card {
      border: 1px solid #e5e0d5;
      border-radius: 10px;
      padding: 20px;
      margin-top: 16px;
      background: #fbfaf6;
    }
    h1 { margin-top: 0; color: #6b4f2a; }
    .price { font-weight: bold; color: #a9772f; }
    footer { text-align: center; color: #999; margin: 24px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>우리 동네 카페</h1>
    <p>매일 아침 직접 볶은 원두로 내리는 작은 카페입니다.</p>

    <div class="card">
      <h2>오늘의 메뉴</h2>
      <p>핸드드립 커피 — <span class="price">4,500원</span></p>
    </div>
    <!-- FIXED: 첫 번째 .card 상자를 바로 윗줄에서 제대로 닫았습니다.
         왜 여기서 닫나: 여는 <div class="card">와 닫는 </div>는 한 짝이라, 이 카드의 내용(가격 <p>)이 끝나는 곳에서 닫아야
         다음 카드가 이 카드의 '형제'(같은 단계)로 나란히 놓입니다. 이 한 줄이 없으면 다음 카드가 이 카드 '안으로' 들어갑니다. -->

    <div class="card">
      <h2>찾아오시는 길</h2>
      <p>부산광역시 어딘가 1길 23, 1층</p>
    </div>
  </div>

  <footer>© 2026 우리 동네 카페</footer>
</body>
</html>
