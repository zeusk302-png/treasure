<!--
  이 파일은 무엇인가: 실습 276 '닫는 태그 빠진 HTML 고치기'의 **일부러 고장 낸 버전**입니다.
  왜 있는가: 닫는 태그(</div>) 한 개가 빠지면 화면이 어떻게 무너지는지 직접 보고 고쳐 보라고 둔 연습용 파일입니다.
            고장 지점은 아래 'BUG' 주석이 달린 곳 한 군데뿐입니다. (정답은 같은 폴더의 index.html)
  주의: 이 파일은 '틀린 상태가 정상'입니다. 함부로 고치지 말고, 먼저 브라우저로 열어 증상을 관찰한 뒤 직접 고쳐 보세요.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 동네 카페 — (고장난 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #f4f1ea;
      color: #2b2b2b;
    }
    /* 가운데 정렬된 본문 상자 */
    .container {
      max-width: 720px;
      margin: 40px auto;        /* 좌우 auto = 화면 가운데로 */
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }
    /* .card = 정보 한 덩어리를 담는 작은 상자. padding(안쪽 여백) 때문에,
       카드가 다른 카드 '안에' 잘못 들어가면 그 여백만큼 오른쪽으로 한 칸 더 밀려 계단처럼 보입니다.
       이 파일에서 바로 그 일이 일어납니다 — 원인은 CSS가 아니라 아래 HTML의 빠진 닫는 태그입니다. */
    .card {
      border: 1px solid #e5e0d5;
      border-radius: 10px;
      padding: 20px;
      margin-top: 16px;
      background: #fbfaf6;
    }
    h1 { margin-top: 0; color: #6b4f2a; }
    .price { font-weight: bold; color: #a9772f; }
    footer { text-align: center; color: #999; margin: 24px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>우리 동네 카페</h1>
    <p>매일 아침 직접 볶은 원두로 내리는 작은 카페입니다.</p>

    <div class="card">
      <h2>오늘의 메뉴</h2>
      <p>핸드드립 커피 — <span class="price">4,500원</span></p>
      <!-- BUG: 여기서 첫 번째 .card 상자를 닫는 닫는태그(</div>)가 빠져 있습니다.
           고치는 법: 바로 이 줄 아래에 </div> 한 줄을 넣으면 됩니다.
           왜 이게 문제냐: 닫는 태그가 없으니 브라우저는 '첫 카드가 아직 안 끝났다'고 보고
           다음 <div class="card">(찾아오시는 길)를 첫 카드 안으로 집어넣습니다. 그래서 화면이 한 칸 밀려 보입니다. -->

    <div class="card">
      <h2>찾아오시는 길</h2>
      <p>부산광역시 어딘가 1길 23, 1층</p>
    </div>
  </div>

  <footer>© 2026 우리 동네 카페</footer>
</body>
</html>
