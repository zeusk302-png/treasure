<!--
  이 파일은 무엇? : 좋아하는 사이트 3곳으로 이동하는 "링크 모음" 페이지(실습 007)입니다.
  왜 있나?       : 웹의 가장 기본인 하이퍼링크(<a> 태그)가 어떻게 동작하는지 직접 만들어 익히려고 만든 예제입니다.
  어떻게 보나?    : 이 파일을 더블클릭하면 브라우저가 열리고, 화면의 링크 글자를 누르면 해당 사이트로 이동합니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- charset=UTF-8 : 한글이 깨지지 않게(???? 처럼 안 보이게) 글자 인코딩을 지정 -->
  <meta charset="UTF-8" />
  <!-- viewport : 휴대폰에서도 글자가 작게 쪼그라들지 않고 화면 폭에 맞게 보이도록 넣음 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내가 좋아하는 사이트 링크 모음</title>
</head>
<body>
  <h1>내가 좋아하는 사이트 모음</h1>
  <p>아래 링크를 누르면 그 사이트로 이동해요.</p>

  <!--
    핵심: <a> 태그가 "링크"를 만들어요.
    href="여기에 주소" 가 "어디로 갈지"를 정합니다.
    글자 부분(여기서는 사이트 이름)을 누르면 해당 주소로 이동해요.
  -->
  <ul>
    <li>
      <!-- href 는 반드시 https:// 로 시작하는 전체 주소로 적어야 함 (https:// 를 빼면 내 폴더 안 파일을 찾으려 해서 링크가 깨짐) -->
      <a href="https://www.google.com">구글 (검색)</a>
    </li>
    <li>
      <a href="https://www.youtube.com">유튜브 (영상)</a>
    </li>
    <li>
      <a href="https://www.naver.com">네이버 (포털)</a>
    </li>
  </ul>

  <hr />

  <p>
    더 알아보기:
    <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Element/a">a 태그 공식 설명서(MDN)</a>
  </p>
</body>
</html>
