<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내가 좋아하는 사이트 링크 모음</title>
</head>
<body>
  <h1>내가 좋아하는 사이트 모음</h1>
  <p>아래 링크를 누르면 그 사이트로 이동해요.</p>

  <!--
    핵심: <a> 태그가 "링크"를 만들어요.
    href="여기에 주소" 가 "어디로 갈지"를 정합니다.
    글자 부분(여기서는 사이트 이름)을 누르면 해당 주소로 이동해요.
  -->
  <ul>
    <li>
      <a href="https://www.google.com">구글 (검색)</a>
    </li>
    <li>
      <a href="https://www.youtube.com">유튜브 (영상)</a>
    </li>
    <li>
      <a href="https://www.naver.com">네이버 (포털)</a>
    </li>
  </ul>

  <hr />

  <p>
    더 알아보기:
    <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Element/a">a 태그 공식 설명서(MDN)</a>
  </p>
</body>
</html>
