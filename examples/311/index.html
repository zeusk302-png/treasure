<!--
  ============================================================
  무엇: Supabase Realtime을 쓰는 "실시간 방명록" 한 페이지.
  왜:   직접 서버(WebSocket)를 짜지 않아도, Supabase가 대신 실시간 연결을 깔아준다.
        누군가 글을 남기면 → DB가 변경을 발행 → 이 페이지가 그 변경을 구독해서
        새로고침 없이 새 글이 화면 위에 스르륵 뜨게 만든다.
  보안: 여기 박는 SUPABASE_ANON_KEY는 "공개돼도 되는 출입증"이라 페이지에 둬도 된다.
        진짜 보호는 DB의 RLS(schema.sql)가 한다. service_role 키는 절대 여기 두면 안 된다.
  쓰는 법: schema.sql을 먼저 Supabase에서 실행 → 아래 두 상수를 내 값으로 바꾼다.
  ============================================================
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 방명록 — Supabase Realtime 실습</title>
  <style>
    :root {
      --main: #2563eb;
      --bg: #f6f8fc;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --new: #dbeafe; /* 새로 들어온 글을 잠깐 강조할 배경색 */
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      line-height: 1.6;
    }
    header { background: var(--main); color: #fff; padding: 28px 20px; text-align: center; }
    header h1 { margin: 0 0 6px; font-size: 1.5rem; }
    header p { margin: 0; opacity: 0.9; font-size: 0.95rem; }
    main { max-width: 560px; margin: 0 auto; padding: 20px 16px 64px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 14px 0; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    input, textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid var(--line); border-radius: 8px; font-size: 1rem; font-family: inherit; }
    button { padding: 10px 20px; background: var(--main); color: #fff; border: 0; border-radius: 999px; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    /* 실시간 연결 상태를 보여주는 작은 점 + 글자 */
    .status { font-size: .85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
    .dot.on { background: #22c55e; } /* 연결되면 초록 */
    .entry { border-bottom: 1px dashed var(--line); padding: 12px 4px; transition: background-color 1.2s ease; }
    .entry.flash { background: var(--new); } /* 새 글이 막 들어오면 잠깐 파랗게 깜빡 */
    .entry .who { font-weight: 700; }
    .entry .when { color: var(--muted); font-size: .82rem; }
    .empty { color: var(--muted); padding: 12px 4px; }
  </style>
</head>
<body>
  <header>
    <h1>실시간 방명록</h1>
    <p>두 개의 창을 띄워 한쪽에서 글을 남겨 보세요. 다른 창에 새로고침 없이 바로 뜹니다.</p>
  </header>

  <main>
    <section class="card">
      <!-- 글 작성 폼: 제출하면 DB에 insert → DB가 변경을 발행 → 모든 구독 창에 도착 -->
      <form id="form">
        <input id="name" placeholder="이름" maxlength="30" required />
        <textarea id="message" placeholder="한마디 남겨주세요" rows="3" maxlength="500" required></textarea>
        <button type="submit" id="submitBtn">남기기</button>
      </form>
    </section>

    <section class="card">
      <!-- 실시간 연결 상태 표시: 구독이 붙으면 점이 초록으로 바뀐다 -->
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">실시간 연결 준비 중…</span></div>
      <div id="list"><div class="empty">불러오는 중…</div></div>
    </section>
  </main>

  <!--
    Supabase 자바스크립트 라이브러리(CDN).
    왜 v2 고정 버전을 쓰나: 버전이 갑자기 올라가 동작이 바뀌는 일을 막으려고 메이저 버전을 명시.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── 1) 내 프로젝트 값으로 바꾸기 (Supabase 대시보드 → Project Settings → API) ──
    //    anon 키는 "공개돼도 되는 출입증"이라 브라우저 코드에 둬도 된다.
    //    진짜 보호는 schema.sql에서 켠 RLS가 담당한다. service_role 키는 절대 여기 두지 말 것!
    const SUPABASE_URL = "https://여기에-내-프로젝트.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_여기에-내-anon-키";

    // ── 2) Supabase 클라이언트 생성: 이걸로 DB 읽기/쓰기 + 실시간 구독을 한다 ──
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const listEl = document.getElementById('list');
    const dotEl = document.getElementById('dot');
    const statusEl = document.getElementById('statusText');
    const submitBtn = document.getElementById('submitBtn');

    // 화면에 이미 그린 글의 id를 모아둔다.
    // 왜: 실시간 이벤트와 첫 로딩이 겹쳐 같은 글이 두 번 그려지는 걸 막으려는 중복 방지 장치.
    const seenIds = new Set();

    // ── 3) 글 하나를 화면에 그리는 함수 ──
    //    isNew=true면 "방금 실시간으로 도착한 글"이라 맨 위에 넣고 잠깐 깜빡이게 한다.
    function renderEntry(row, isNew) {
      if (seenIds.has(row.id)) return; // 이미 그린 글이면 무시(중복 방지)
      seenIds.add(row.id);

      // 빈 상태 안내문이 있으면 지운다.
      const emptyEl = listEl.querySelector('.empty');
      if (emptyEl) emptyEl.remove();

      const wrap = document.createElement('div');
      wrap.className = 'entry' + (isNew ? ' flash' : '');

      // ★ 사용자가 입력한 값(name/message)은 textContent로 넣는다. ★
      //   왜: innerHTML로 넣으면 누가 <script>나 <img onerror=...>를 적었을 때 그게 실행될 수 있다(XSS).
      //   textContent는 태그를 '글자 그대로' 보여주므로 안전하다.
      const who = document.createElement('div');
      who.className = 'who';
      who.textContent = row.name;

      const msg = document.createElement('div');
      msg.textContent = row.message;

      const when = document.createElement('div');
      when.className = 'when';
      // 시각은 우리가 만든 값이라 안전하지만, 일관성을 위해 역시 textContent 사용.
      when.textContent = new Date(row.created_at).toLocaleString('ko-KR');

      wrap.appendChild(who);
      wrap.appendChild(msg);
      wrap.appendChild(when);

      if (isNew) {
        listEl.prepend(wrap); // 새 글은 맨 위로
        // 1.2초 뒤 강조(파란 배경)를 빼서 자연스럽게 가라앉게 한다.
        setTimeout(function () { wrap.classList.remove('flash'); }, 1200);
      } else {
        listEl.appendChild(wrap); // 첫 로딩분은 최신순으로 이미 정렬돼 있으므로 순서대로 아래에 붙임
      }
    }

    // ── 4) 페이지를 처음 열 때 기존 글을 한 번 불러온다(실시간은 '앞으로의 변경'만 알려주므로) ──
    async function loadEntries() {
      const { data, error } = await db
        .from('guestbook')
        .select('*')
        .order('created_at', { ascending: false }) // 최신순
        .limit(50);
      if (error) {
        listEl.innerHTML = '';
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = '불러오기 실패: ' + error.message; // 에러 메시지도 textContent로 안전하게
        listEl.appendChild(e);
        return;
      }
      listEl.innerHTML = '';
      if (!data.length) {
        const e = document.createElement('div');
        e.className = 'empty';
        e.textContent = '아직 글이 없어요. 첫 글을 남겨 보세요!';
        listEl.appendChild(e);
        return;
      }
      data.forEach(function (row) { renderEntry(row, false); });
    }

    // ── 5) 실시간 구독: guestbook 표에 INSERT가 생기면 그 글을 받아 화면에 추가한다 ──
    //    이 부분이 "직접 서버를 안 짜고도 실시간"의 핵심. WebSocket 연결을 Supabase가 대신 깔아준다.
    function subscribeRealtime() {
      db.channel('guestbook-realtime') // 채널 이름은 아무거나(같은 페이지 안에서 구분용)
        .on(
          'postgres_changes',
          {
            event: 'INSERT',          // 새 글이 들어올 때만(수정/삭제는 이 실습에선 안 다룸)
            schema: 'public',
            table: 'guestbook'
          },
          function (payload) {
            // payload.new = 방금 추가된 행. 이 한 줄이 다른 창에서 남긴 글을 내 화면에 띄운다.
            renderEntry(payload.new, true);
          }
        )
        .subscribe(function (status) {
          // 구독 상태가 바뀔 때마다 호출됨. 'SUBSCRIBED'면 실시간 연결 성공.
          if (status === 'SUBSCRIBED') {
            dotEl.classList.add('on');
            statusEl.textContent = '실시간 연결됨 — 새 글이 자동으로 떠요';
          } else {
            dotEl.classList.remove('on');
            statusEl.textContent = '실시간 연결 상태: ' + status;
          }
        });
    }

    // ── 6) 글 남기기: DB에 insert만 하면 끝. 화면 갱신은 실시간 구독이 알아서 해준다 ──
    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      if (!name || !message) return;

      submitBtn.disabled = true; // 중복 클릭 방지(두 번 눌러 두 번 저장되는 사고 막기)
      const { error } = await db.from('guestbook').insert({ name: name, message: message });
      submitBtn.disabled = false;

      if (error) {
        // alert 메시지에는 사용자 입력을 넣지 않으므로 그대로 둬도 안전.
        alert('저장 실패: ' + error.message);
        return;
      }
      e.target.reset();
      // 여기서 굳이 화면을 직접 안 그린다. 내가 쓴 글도 실시간 INSERT 이벤트로 똑같이 돌아오기 때문.
    });

    // ── 7) 순서: 먼저 기존 글 로딩 → 그 다음 실시간 구독 켜기 ──
    loadEntries();
    subscribeRealtime();
  </script>
</body>
</html>
