<!DOCTYPE html>
<!--
  이 파일은 무엇인가: 회원가입 폼의 '뼈대(HTML)'입니다.
  왜 있는가: 입력칸(이메일/비밀번호/휴대폰)과 각 칸의 안내 메시지를 화면에 배치하는 역할.
            "어떻게 보이는지(색·테두리)"는 같은 폴더의 style.css가 담당합니다.
            이렇게 구조(HTML)와 디자인(CSS)을 나눠 두면 각각 고치기 쉬워집니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 폼 — 검증 상태 스타일</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>회원가입</h1>
    <p class="subtitle">아래 칸에 입력해 보세요. 형식이 틀리면 빨간색, 맞으면 초록색으로 바뀝니다.</p>

    <!-- novalidate: 제출 시 브라우저 기본 경고창 대신, 우리가 만든 색/메시지로만 안내합니다.
         그래도 :valid / :invalid 판정은 그대로 동작합니다. -->
    <form action="#" novalidate>
      <!-- 1) 이메일 -->
      <div class="field">
        <label for="email">이메일</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="hong@example.com"
          required
        />
        <!-- 형식이 틀렸을 때만 보이는 안내 메시지 -->
        <p class="error-message">올바른 이메일 형식(아이디@도메인)으로 입력하세요.</p>
      </div>

      <!-- 2) 비밀번호 (최소 8글자) -->
      <div class="field">
        <label for="password">비밀번호</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="8글자 이상"
          minlength="8"
          required
        />
        <p class="error-message">비밀번호는 8글자 이상이어야 합니다.</p>
      </div>

      <!-- 3) 휴대폰 번호 (010-0000-0000 형식) -->
      <div class="field">
        <label for="phone">휴대폰 번호</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="010-1234-5678"
          pattern="010-[0-9]{4}-[0-9]{4}"
          required
        />
        <p class="error-message">010-0000-0000 형식으로 입력하세요.</p>
      </div>

      <button type="submit">가입하기</button>
    </form>
  </main>
</body>
</html>
