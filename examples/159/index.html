<!DOCTYPE html>
<!--
  이 파일이 무엇이고 왜 있는지:
  - 도서 검색 + 페이지네이션(쪽 넘기기) 실습의 '화면 뼈대'(구조)입니다.
  - 여기엔 '무엇이 있는지'만(검색칸·버튼·결과 목록·이전/다음 막대) 적고,
    꾸미기(색·여백)는 style.css가, 동작(검색·쪽 넘기기)은 script.js가 맡습니다.
  - 이렇게 구조(HTML)·꾸미기(CSS)·동작(JS)을 파일로 나누면, 한 군데를 고쳐도
    나머지에 영향이 적어 초보가 다루기 쉽기 때문입니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 글자 크기가 정상으로 보이게 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도서 검색 + 페이지네이션 (이전/다음 버튼)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>📚 도서 검색 (페이지 넘기기)</h1>
    <p class="lead">
      책 제목·작가를 검색하면 결과가 <strong>쪽(페이지) 단위</strong>로 나옵니다.
      검색 결과가 많아도 <strong>한 번에 다 받지 않고</strong>, 한 쪽에 10권씩만 받아
      <strong>[이전]·[다음] 버튼</strong>으로 넘겨 봅니다.
    </p>

    <!-- ===== 검색 입력 영역 ===== -->
    <section class="controls">
      <label class="ctrlLabel" for="queryInput">검색어</label>
      <div class="ctrlRow">
        <input
          id="queryInput"
          type="text"
          placeholder="예: 어린왕자, 해리포터, Python"
          autocomplete="off"
        />
        <button id="searchBtn" type="button">검색</button>
      </div>
      <p class="examples">
        눌러서 바로 시도:
        <button type="button" class="chip" data-q="어린왕자">어린왕자</button>
        <button type="button" class="chip" data-q="해리포터">해리포터</button>
        <button type="button" class="chip" data-q="python">python</button>
      </p>
    </section>

    <!-- ===== 상태 안내 줄 (검색 중 / 결과 수 / 실패) ===== -->
    <p id="status" class="status" role="status">
      위에 검색어를 입력하고 <strong>[검색]</strong>을 눌러 보세요.
    </p>

    <!-- ===== 검색 결과 목록이 그려질 자리 ===== -->
    <ul id="resultList" class="resultList"></ul>

    <!-- ===== 페이지네이션(쪽 넘기기) 막대 ===== -->
    <!-- 결과가 있을 때만 보이도록 처음엔 hidden 으로 숨겨 둡니다. -->
    <nav id="pager" class="pager" hidden aria-label="페이지 이동">
      <button id="prevBtn" type="button">← 이전</button>
      <span id="pageInfo" class="pageInfo">1 / 1</span>
      <button id="nextBtn" type="button">다음 →</button>
    </nav>
  </main>

  <!-- 화면(HTML)을 다 그린 뒤에 우리 동작(JS)을 불러온다 -->
  <script src="script.js"></script>
</body>
</html>
