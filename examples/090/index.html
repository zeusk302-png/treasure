<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 폼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <!-- form 으로 감싸면 안에 있는 입력칸들이 '하나의 제출 단위'가 됩니다 -->
    <form class="contact-form" action="#" method="post">
      <h1>문의하기</h1>
      <p class="desc">궁금한 점을 자유롭게 남겨 주세요. 답변은 이메일로 보내 드립니다.</p>

      <!-- 1) 한 줄 입력칸: 이름 -->
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="홍길동" />
      </div>

      <!-- 2) 한 줄 입력칸: 이메일 -->
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="hong@example.com" />
      </div>

      <!-- 3) 여러 줄 입력칸: textarea (이번 실습의 핵심) -->
      <div class="field">
        <label for="message">메시지</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="문의 내용을 여기에 적어 주세요."
        ></textarea>
      </div>

      <!-- 4) 제출 버튼: type="submit" 이면 form 이 제출됩니다 -->
      <div class="actions">
        <button type="submit">보내기</button>
        <button type="reset" class="secondary">지우기</button>
      </div>
    </form>
  </main>
</body>
</html>
