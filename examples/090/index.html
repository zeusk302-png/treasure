<!--
  파일: index.html (실습 090 — 여러 줄 메시지 입력칸 + 전송 버튼 폼)
  무엇: "이름 / 이메일 / 메시지 + 보내기" 형태의 문의 폼 화면을 그리는 HTML 파일.
  왜 있나: 여러 줄 입력은 <input>이 아니라 <textarea>로 받아야 하고,
          입력칸들을 <form> 하나로 묶어야 '한 번에 제출'된다는 폼의 기본 구조를 익히기 위함.
  짝꿍 파일: 모양(색·여백·강조)은 style.css가 담당.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 폼</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <!-- form 으로 감싸면 안에 있는 입력칸들이 '하나의 제출 단위'가 됩니다 -->
    <form class="contact-form" action="#" method="post">
      <h1>문의하기</h1>
      <p class="desc">궁금한 점을 자유롭게 남겨 주세요. 답변은 이메일로 보내 드립니다.</p>

      <!-- 1) 한 줄 입력칸: 이름 -->
      <!-- label의 for와 input의 id를 같은 'name'으로 맞추는 이유: 라벨 글씨를 눌러도 입력칸이 선택되고, 화면 낭독기(접근성)도 짝을 이해하기 때문 -->
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="홍길동" />
      </div>

      <!-- 2) 한 줄 입력칸: 이메일 -->
      <div class="field">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="hong@example.com" />
      </div>

      <!-- 3) 여러 줄 입력칸: textarea (이번 실습의 핵심) -->
      <!-- 왜 input이 아니라 textarea? input은 한 줄만 받지만, textarea는 엔터로 여러 줄을 받을 수 있어 '메시지' 같은 긴 글에 알맞기 때문 -->
      <!-- 왜 여는/닫는 태그가 따로 있고 사이를 비워 두나? 그 사이의 내용이 '처음 채워진 글'이 되므로, 빈 칸으로 시작하려면 비워 두는 것 -->
      <div class="field">
        <label for="message">메시지</label>
        <textarea
          id="message"
          name="message"
          rows="6"
          placeholder="문의 내용을 여기에 적어 주세요."
        ></textarea>
      </div>

      <!-- 4) 제출 버튼: type="submit" 이면 form 이 제출됩니다 -->
      <div class="actions">
        <button type="submit">보내기</button>
        <button type="reset" class="secondary">지우기</button>
      </div>
    </form>
  </main>
</body>
</html>
