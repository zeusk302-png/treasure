<!DOCTYPE html>
<!-- [이 파일은?] "버튼 클릭으로 화면 글자 바꾸기" 실습의 화면(HTML)입니다.
     [왜 있나?] 사용자에게 보일 문장(<p>)과 버튼(<button>)을 그려 두고,
               실제 동작(글자 바꾸기)은 아래에서 불러오는 script.js가 맡습니다.
               화면(HTML)과 동작(JS)을 나눠 두면 초보자가 "모양 vs 동작"을 구분해 배우기 좋습니다. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>버튼 클릭으로 화면 글자 바꾸기</title>
  <style>
    /* 화면 가운데에 글자와 버튼을 두기 위한 최소한의 꾸밈입니다 */
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      gap: 16px;
      text-align: center;
      padding: 0 16px;
    }
    /* 버튼을 누르면 내용이 바뀔 문장입니다 */
    #message {
      font-size: 22px;
      color: #111827;
      min-height: 30px;
    }
    /* 누를 버튼 모양 */
    #changeBtn {
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background-color: #4f46e5;
      color: white;
      cursor: pointer;
    }
    #changeBtn:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>
  <h1>화면 글자 바꾸기</h1>

  <!-- 이 문장이 버튼을 누르면 바뀝니다.
       id="message" 라는 이름표를 붙여 자바스크립트가 찾을 수 있게 합니다. -->
  <p id="message">아직 버튼을 누르지 않았어요.</p>

  <!-- 우리가 누를 버튼. id로 이름표를 붙여 자바스크립트가 찾을 수 있게 합니다 -->
  <button id="changeBtn">글자 바꾸기</button>

  <!-- 화면(HTML)을 다 만든 뒤에 자바스크립트를 불러옵니다 -->
  <script src="script.js"></script>
</body>
</html>
