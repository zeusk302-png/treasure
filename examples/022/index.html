<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>상품 소개 카드</title>
</head>
<!--
  이 실습은 "인라인 스타일"만으로 카드 UI를 만듭니다.
  인라인 스타일이란 태그 안에 style="..." 형태로 직접 꾸미는 방법입니다.
  (실무에서는 보통 style.css 파일로 분리하지만, 지금은 속성을 눈으로 익히는 게 목표예요.)
-->
<body style="margin: 0; padding: 40px; background-color: #f2f4f7; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">

  <!-- 카드 바깥 박스: 둥근 모서리(border-radius) + 그림자(box-shadow) + 가운데 정렬(margin auto) -->
  <!--
    초보가 자주 막히는 두 줄을 미리 설명해둡니다.
    - margin: 0 auto;  → 너비(width)가 정해진 박스를 가로 가운데로 보냅니다.
                         (좌우 여백을 'auto'로 두면 남는 공간을 양쪽이 똑같이 나눠 가져서 가운데로 옴.
                          width가 없으면 박스가 화면을 꽉 채워 가운데 정렬이 안 보입니다. 그래서 width와 짝으로 씁니다.)
    - overflow: hidden; → 카드 모서리를 둥글게 깎아도, 안에 든 이미지의 네 귀퉁이는 각진 채 삐져나옵니다.
                          이 줄이 박스 밖으로 넘치는 부분을 잘라줘서 이미지 위쪽 모서리까지 둥글게 보이게 합니다.
  -->
  <div style="
      width: 280px;
      margin: 0 auto;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      text-align: center;
    ">

    <!-- 상품 이미지: 카드 폭을 꽉 채우도록 width 100% -->
    <!--
      object-fit: cover; 는 정해진 width/height 칸에 맞게 사진을 '잘라서' 채웁니다.
      (이게 없으면 가로세로 비율이 안 맞을 때 사진이 찌그러져 보입니다. 비율을 지키며 칸을 채우려고 넣은 것.)
      display: block; 은 이미지 아래에 생기는 미세한 빈 틈을 없애줍니다(img는 기본이 글자처럼 취급돼 틈이 생김).
    -->
    <img
      src="https://picsum.photos/seed/coffee/280/180"
      alt="갓 내린 따뜻한 핸드드립 커피 사진"
      style="width: 100%; height: 180px; object-fit: cover; display: block;"
    />

    <!-- 글자 영역: 안쪽 여백(padding)으로 사진과 글자 사이를 띄움 -->
    <div style="padding: 20px;">

      <!-- 상품 제목 -->
      <h2 style="margin: 0 0 8px; font-size: 20px; color: #1a1a1a;">
        오늘의 핸드드립 커피
      </h2>

      <!-- 상품 설명 -->
      <p style="margin: 0 0 16px; font-size: 14px; line-height: 1.5; color: #6b7280;">
        매일 아침 갓 볶은 원두로 한 잔씩 정성껏 내려드립니다. 부드럽고 깔끔한 맛이 특징이에요.
      </p>

      <!-- 가격: 눈에 띄게 색과 굵기 강조 -->
      <p style="margin: 0 0 16px; font-size: 22px; font-weight: bold; color: #2563eb;">
        4,500원
      </p>

      <!-- 구매 버튼: 둥근 모서리 버튼 -->
      <a
        href="#"
        style="
          display: inline-block;
          padding: 12px 28px;
          background-color: #2563eb;
          color: #ffffff;
          text-decoration: none;
          border-radius: 8px;
          font-size: 15px;
        "
      >
        담기
      </a>

    </div>
  </div>

</body>
</html>
