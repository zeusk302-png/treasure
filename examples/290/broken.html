<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>방명록 (보안 사고 버전 - service_role 키 노출)</title>

  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-top: 12px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0; }
    button { padding: 8px 14px; }
    .warn { background: #fff3f3; border: 1px solid #f3b1b1; color: #a40000;
            border-radius: 8px; padding: 12px; font-size: 13px; margin-top: 20px; }
    code { background: #f2f2f2; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>우리 동네 방명록</h1>

  <div class="card">
    <input id="name" placeholder="이름" />
    <textarea id="message" placeholder="한 마디 남겨 주세요"></textarea>
    <button id="submit">남기기</button>
  </div>

  <div id="list" class="card">불러오는 중...</div>

  <div class="warn">
    이 페이지는 일부러 <strong>고장(보안 사고) 상태</strong>입니다.<br />
    F12(개발자 도구) → <strong>Sources(소스)</strong> 탭에서 이 파일을 열거나, 페이지에서 <strong>우클릭 → 페이지 소스 보기</strong>를 해 보세요.<br />
    아래 <code>&lt;script&gt;</code> 안에 <strong>절대 공개되면 안 되는 비밀키</strong>가 그대로 박혀 있습니다.
  </div>

  <!-- supabase-js 를 CDN 으로 불러온다 (실제 실습과 동일한 방식) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!--
    =========================================================================
    💥 이 파일의 보안 사고: "service_role(비밀) 키"를 프론트엔드 코드에 박았다.
    =========================================================================
    프론트엔드(브라우저) 코드는 누구나 F12 → Sources 또는 "소스 보기"로 통째로 볼 수 있다.
    그래서 여기에 적은 값은 전부 "전 세계에 공개된 것"과 같다.

    - 프로젝트 URL : 공개돼도 됨 (어차피 주소다)
    - anon / publishable 키 : 공개돼도 됨 (RLS 라는 잠금장치가 막아 줌 → 실습 291)
    - service_role / secret 키 : ❌ 절대 공개 금지!
        이 키는 RLS(행 수준 보안)를 "통째로 무시하고" DB 의 모든 행을 읽고/수정/삭제할 수 있다.
        프론트에 박는 순간, 방문자 누구나 이 키로 남의 글을 다 읽고 전부 지울 수 있다.
    =========================================================================
  -->
  <script>
    const SUPABASE_URL = "https://REPLACE_WITH_YOUR_PROJECT_REF.supabase.co";

    // ❌❌❌ 보안 사고의 핵심 ❌❌❌
    // service_role(비밀) 키를 프론트엔드에 박았다. 이건 F12 에 그대로 보인다.
    // (아래 값은 시연용 가짜 자리표시자다. 실제 키는 절대 이렇게 코드에 넣지 말 것.)
    const SUPABASE_SERVICE_ROLE_KEY = "REPLACE_WITH_YOUR_SERVICE_ROLE_SECRET_THIS_MUST_NEVER_SHIP";

    // 비밀키로 클라이언트를 만들면 RLS 가 전부 무시된다 → 사실상 DB 관리자 권한이 브라우저에 풀린다.
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);

    const listEl = document.getElementById("list");

    async function loadGuestbook() {
      const { data, error } = await db
        .from("guestbook")
        .select("name, message")
        .order("created_at", { ascending: false });

      if (error) { listEl.textContent = "에러: " + error.message; return; }
      listEl.innerHTML = (data || [])
        .map(function (row) { return "<p><b>" + row.name + "</b> : " + row.message + "</p>"; })
        .join("") || "아직 글이 없어요.";
    }

    document.getElementById("submit").addEventListener("click", async function () {
      const name = document.getElementById("name").value.trim();
      const message = document.getElementById("message").value.trim();
      if (!name || !message) { alert("이름과 메시지를 모두 입력하세요."); return; }

      const { error } = await db.from("guestbook").insert({ name: name, message: message });
      if (error) { alert("에러: " + error.message); return; }

      document.getElementById("name").value = "";
      document.getElementById("message").value = "";
      loadGuestbook();
    });

    loadGuestbook();
  </script>
</body>
</html>
