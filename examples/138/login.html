<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 보호된 페이지 실습(138)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="appHeader">
    <a class="logo" href="mypage.html">🔒 마이페이지</a>
  </header>

  <main>
    <h1>로그인</h1>
    <p class="hint">
      보호된 페이지(<code>mypage.html</code>)에 로그인 없이 들어가려고 하면,
      문지기(<code>auth-guard.js</code>)가 여기로 돌려보냅니다.<br />
      로그인에 성공하면 원래 가려던 페이지로 자동으로 돌아갑니다.
    </p>

    <form id="loginForm" class="login-form">
      <input id="email" type="email" placeholder="이메일" required />
      <input id="password" type="password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
    </form>
    <div id="msg"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="login.js"></script>
</body>
</html>
