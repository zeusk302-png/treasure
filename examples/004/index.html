<!--
  이 파일은 무엇인가: 실습 004 '오늘 할 일 체크리스트' 페이지(index.html)입니다.
  왜 있는가: 순서 없는 목록 태그 <ul>(바구니)과 <li>(낱개 항목)를 직접 써 보며,
            "여러 항목을 줄줄이 나열할 때는 목록 태그를 쓴다"는 감각을 익히기 위한 예제입니다.
  어떻게 보는가: 이 파일을 더블클릭하면 브라우저가 열리고, 각 항목 앞에 점(•)이 자동으로 붙은
                목록이 보이면 성공입니다. (점은 우리가 타이핑한 게 아니라 <ul>이 붙여준 것입니다.)
-->
<!DOCTYPE html>
<!-- 이 문서가 HTML5 문서임을 브라우저에게 알려주는 선언입니다 -->
<html lang="ko">
  <head>
    <!-- 글자가 깨지지 않도록 문자 인코딩을 UTF-8로 지정합니다 -->
    <meta charset="UTF-8" />
    <!-- 모바일에서도 적절한 크기로 보이도록 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 브라우저 탭에 표시되는 제목입니다 -->
    <title>오늘 할 일 체크리스트</title>
  </head>
  <body>
    <!--
      이번에 배우는 것: 순서 없는 목록(ul/li)

      - ul = Unordered List(순서 없는 목록)의 줄임말입니다.
             '여러 항목을 묶어두는 바구니' 라고 생각하면 쉽습니다.
      - li = List Item(목록 항목)의 줄임말입니다.
             바구니 안에 들어가는 '낱개 항목 하나' 입니다.

      ul 바구니 안에 li 항목들을 넣으면, 브라우저가 각 항목 앞에
      자동으로 점(•)을 붙여서 '점 목록'으로 보여줍니다.
      번호(1, 2, 3...)가 필요 없는, 순서가 중요하지 않은 목록에 씁니다.
      (예: 장 볼 물건, 오늘 할 일처럼 순서가 바뀌어도 상관없는 것들)
    -->

    <!-- h1: 이 페이지가 무엇인지 알려주는 가장 큰 제목 -->
    <h1>오늘 할 일</h1>

    <!-- p: 목록을 설명하는 한 문단 -->
    <p>오늘 꼭 해야 할 일들을 점 목록으로 정리했습니다.</p>

    <!--
      ul 시작 = 목록 바구니를 엽니다.
      이 안에 들어가는 li 하나하나가 점(•) 하나로 표시됩니다.
    -->
    <ul>
      <!-- li 하나 = 점 하나. 시작 태그 <li>와 끝 태그 </li>가 짝을 이룹니다. -->
      <li>아침 운동 30분 하기</li>
      <li>강의 영상 1편 보기</li>
      <li>실습 코드 따라 만들기</li>
      <li>물 8잔 마시기</li>
      <li>잠들기 전 일기 쓰기</li>
    </ul>
    <!-- ul 끝 = 목록 바구니를 닫습니다. -->
  </body>
</html>
