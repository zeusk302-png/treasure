<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>[나쁜 예시] 비밀키를 코드에 박은 위험한 페이지</title>
</head>
<body>
  <h1>방명록 (위험한 "before" 예시 — 이렇게 하면 안 됩니다!)</h1>

  <p>아래 script 를 보세요. 무엇이 잘못됐는지 찾을 수 있나요?</p>

  <script>
    // ❌ 문제 1: 설정값을 코드에 그대로 박아 넣었습니다.
    //    이 파일을 그대로 GitHub에 올리면 전 세계가 키를 볼 수 있습니다.
    const SUPABASE_URL = "https://abcdmyrealproject.supabase.co";

    // ❌ 문제 2 (치명적): service_role(비밀) 키를 브라우저 코드에 넣었습니다!
    //    service_role 은 RLS(행 보안)를 전부 무시하는 "마스터 키"입니다.
    //    누구나 F12 → 소스 보기로 이 키를 복사해 DB 전체를 읽고 지울 수 있습니다.
    const SUPABASE_SERVICE_ROLE_KEY =
      "eyJ나쁜예시_진짜service_role키를여기_절대박지마세요_DB전체털림";

    // ❌ 문제 3: 비밀키를 막아 줄 .gitignore / .env 분리가 전혀 없습니다.
    //    (이 폴더에는 .env 도, .gitignore 도 없다고 가정합니다.)

    console.log("연결 시도:", SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY);
    document.body.insertAdjacentHTML(
      "beforeend",
      "<p style='color:red'>이 페이지의 소스에는 비밀키가 그대로 노출되어 있습니다.</p>"
    );
  </script>
</body>
</html>
