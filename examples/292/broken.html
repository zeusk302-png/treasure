<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--
    실습 292 [깨진 버전] — 한국 자정에 올린 글이 '어제'로 찍히는 버그
    이 파일은 "고치기 전" 잘못된 상태입니다. 무엇이 문제인지 직접 찾아보세요.
    핵심 사고 지점은 아래 ❌ 주석에 표시돼 있습니다.
  -->
  <title>댓글 목록 (깨진 버전)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 20px; }
    .hint { background: #fff3cd; border: 1px solid #ffe08a; padding: 12px; border-radius: 8px; font-size: 14px; }
    ul { list-style: none; padding: 0; }
    li { border-bottom: 1px solid #eee; padding: 12px 0; }
    .name { font-weight: 700; }
    .date { color: #888; font-size: 13px; margin-left: 6px; }
    .msg { margin-top: 4px; }
  </style>
</head>
<body>
  <h1>댓글 목록 (깨진 버전)</h1>
  <p class="hint">
    이 페이지의 날짜가 어떻게 찍히는지 보세요. 마지막 댓글은 "한국 시간 7월 1일 0시 30분"에 작성됐는데,
    화면에는 <strong>6월 30일</strong>로 나옵니다. 하루가 어긋났습니다.
  </p>

  <ul id="list"></ul>

  <script>
    // 서버(Supabase 등)에서 내려온 댓글 데이터.
    // 데이터베이스는 보통 시각을 'UTC(세계 표준시)'로 저장합니다. 끝에 'Z'가 UTC라는 표시예요.
    // 예: "2026-07-01T00:30:00+09:00"(한국 7/1 0:30) 은 UTC로는 "2026-06-30T15:30:00Z" 입니다.
    const comments = [
      { name: "민수", message: "잘 보고 갑니다!",     created_at: "2026-06-30T05:10:00Z" },
      { name: "지영", message: "도움 많이 됐어요",     created_at: "2026-06-30T11:00:00Z" },
      // ↓ 이 댓글이 함정입니다. 한국 시간으로는 7/1 0:30 에 쓴 글인데, UTC로는 6/30 15:30 입니다.
      { name: "현우", message: "자정에 첫 댓글!",       created_at: "2026-06-30T15:30:00Z" },
    ];

    const list = document.getElementById("list");

    comments.forEach(function (c) {
      const li = document.createElement("li");

      // ❌ 문제: created_at 문자열에서 'T' 앞쪽(날짜 부분)만 그대로 잘라 씁니다.
      //    이 문자열은 UTC 기준이라, 한국(UTC+9)으로 바꾸지 않고 그냥 쓰면
      //    자정 근처에 쓴 글은 날짜가 하루 어긋납니다.
      //    "2026-06-30T15:30:00Z".split("T")[0]  →  "2026-06-30"  (실제로는 한국 7/1)
      const dateText = c.created_at.split("T")[0]; // ❌ 타임존 무시 + 문자열 자르기

      // 이름 + 날짜
      const head = document.createElement("div");
      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = c.name;
      const dateEl = document.createElement("span");
      dateEl.className = "date";
      dateEl.textContent = dateText; // ❌ 어긋난 날짜가 그대로 화면에
      head.appendChild(nameEl);
      head.appendChild(dateEl);

      const msgEl = document.createElement("div");
      msgEl.className = "msg";
      msgEl.textContent = c.message;

      li.appendChild(head);
      li.appendChild(msgEl);
      list.appendChild(li);
    });
  </script>
</body>
</html>
