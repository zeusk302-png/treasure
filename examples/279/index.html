<!DOCTYPE html>
<!--
  이 파일은 무엇인가: 실습 279 "오타 클래스명 매칭" 의 '고친 정답' 페이지입니다.
  왜 있는가: 고장난 broken.html(class="continer" 오타)을 어떻게 고쳐야 하는지 보여주는 '정답지'입니다.
            HTML의 class="container" 와 CSS의 .container 선택자 철자가 정확히 일치하므로,
            흰 카드·둥근 모서리·그림자·가운데 정렬이 모두 제대로 적용됩니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가운데 정렬 박스 — (고친 정답 버전)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "맑은 고딕", sans-serif;
      background: #eef1f6;

      /* 박스를 화면 한가운데(가로·세로 중앙)에 둡니다 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 이 규칙이 아래 <div class="container"> 에 정확히 적용됩니다 (철자 일치!) */
    .container {
      width: 320px;
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .container h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #6c4ad6;
    }

    .container p {
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>
  <!-- FIX: class="continer" → class="container" 로 고쳤습니다. 이제 CSS의 .container 규칙과 철자가 정확히 일치합니다. -->
  <div class="container">
    <h1>환영합니다</h1>
    <p>이 박스는 화면 한가운데에 떠 있어야 합니다.</p>
  </div>
</body>
</html>
