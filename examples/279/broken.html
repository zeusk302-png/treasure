<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가운데 정렬 박스 — (고장난 버전)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "맑은 고딕", sans-serif;
      background: #eef1f6;

      /* 박스를 화면 한가운데(가로·세로 중앙)에 두려고 flex 중앙 정렬을 했습니다 */
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /*
      이 .container 스타일이 박스를 카드처럼 꾸미고 글자를 가운데로 모읍니다.
      그런데 아래 HTML의 <div>에는 class="continer" (오타!) 가 적혀 있어서
      이 규칙(.container)과 철자가 안 맞아 스타일이 하나도 적용되지 않습니다.
    */
    .container {
      width: 320px;
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      text-align: center;
    }

    .container h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #6c4ad6;
    }

    .container p {
      margin: 0;
      color: #555;
    }
  </style>
</head>
<body>
  <!--
    BUG: class 이름이 "continer" 로 오타가 났습니다. (정답은 "container")
    CSS에는 .container 규칙만 있고 .continer 규칙은 없으므로,
    이 박스에는 흰 배경·둥근 모서리·그림자·가운데 정렬이 하나도 안 붙습니다.
    그 결과 박스가 화면 가운데로 모이지 않고 글자만 덩그러니 보입니다.
  -->
  <div class="continer">
    <h1>환영합니다</h1>
    <p>이 박스는 화면 한가운데에 떠 있어야 합니다.</p>
  </div>
</body>
</html>
