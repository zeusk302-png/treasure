<!--
  이 파일은 무엇인가:
  Stripe 테스트 결제 실습의 '가게 화면'입니다. 상품 하나와 "구매하기" 버튼이 있고,
  버튼을 누르면 우리 서버(server.js)에 결제 세션을 만들어 달라고 요청한 뒤,
  서버가 돌려준 Stripe 결제 페이지 주소로 손님을 보냅니다.

  왜 여기서 직접 Stripe를 부르지 않는가 (보안):
  결제를 만들려면 '시크릿 키'가 필요한데, 이 파일은 브라우저에서 열리므로
  F12로 코드가 다 보입니다. 그래서 시크릿 키는 절대 여기 두지 않고, 서버에만 둡니다.
  이 화면은 "서버야, 결제 세션 하나 만들어 줘"라고 부탁만 합니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stripe 테스트 결제 데모</title>
  <style>
    :root {
      --main: #635bff;        /* Stripe 브랜드 보라색 */
      --bg: #f6f7fb;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      text-align: center;
    }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    .price { font-size: 2rem; font-weight: 800; color: var(--main); margin: 12px 0; }
    .desc { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }
    button {
      width: 100%;
      background: var(--main);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { filter: brightness(0.95); }
    button:disabled { opacity: 0.6; cursor: progress; }
    .note {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--muted);
      background: #eef0ff;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
    }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
    #error { color: #b91c1c; font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>부산코딩스쿨 굿즈 스티커팩</h1>
    <div class="price">3,000원</div>
    <p class="desc">테스트 결제 데모입니다. 진짜 돈은 빠져나가지 않습니다.</p>

    <!-- 이 버튼이 결제 흐름의 시작점입니다. 클릭 시 서버에 세션 생성을 요청합니다. -->
    <button id="buyBtn">구매하기 (테스트)</button>

    <!-- 에러 메시지 자리. 사용자에게 보여줄 메시지는 textContent로만 넣습니다(아래 script.js 참고). -->
    <p id="error"></p>

    <div class="note">
      <strong>테스트 카드</strong>: 번호 <code>4242 4242 4242 4242</code> ·
      만료일은 미래 아무 날짜 · CVC 아무 3자리 · 우편번호 아무 값.
      이 카드로는 실제 청구가 발생하지 않습니다.
    </div>
  </div>

  <!-- 화면(HTML)과 동작(JS)을 분리해 두면 읽기 쉽고, 보안 점검(키가 안 박혔는지)도 쉽습니다. -->
  <script src="script.js"></script>
</body>
</html>
