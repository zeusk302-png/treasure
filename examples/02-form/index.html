<!--
  이 파일이 무엇이고 왜 있는지:
  - 무엇: 이름·연락처·문의 내용을 입력받는 "문의 폼" 연습용 한 페이지(HTML+CSS+JS 모두 이 파일 안에).
  - 왜: 폼(<form>)의 기본과, 자바스크립트가 "보내기" 순간에 끼어들어 동작하는 흐름을 손으로 익히기 위함.
  - 주의: 아직 서버가 없어 입력은 어디에도 저장되지 않고 화면 메시지만 띄운다(진짜 저장은 실습 03).
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않게 하는 문자 인코딩 선언 — 빠지면 "ìíì" 같은 깨진 글자가 나올 수 있어 꼭 넣는다. -->
  <meta charset="UTF-8" />
  <!-- 휴대폰 화면에 맞춰 크기를 잡는 설정 — 없으면 모바일에서 글자가 깨알같이 작게 보인다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 — 실습</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
    h1 { color: #7b5e3b; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 18px; padding: 12px 20px; background: #7b5e3b; color: #fff; border: 0; border-radius: 999px; font-size: 1rem; cursor: pointer; }
    .ok { margin-top: 16px; color: #2e7d32; display: none; }
  </style>
</head>
<body>
  <h1>문의하기</h1>
  <p>아래 폼을 채우고 보내기를 눌러 보세요. (지금은 저장되지 않고 알림만 뜹니다 — 저장은 실습 03에서!)</p>

  <!-- id="contactForm": 아래 자바스크립트가 이 폼을 찾아 "보내기" 동작을 가로채려고 붙인 이름표. -->
  <form id="contactForm">
    <!-- label의 for 값과 input의 id 값을 같게("name") 맞춘다 — 그래야 글자를 눌러도 입력칸에 커서가 가고 접근성에도 좋다. -->
    <label for="name">이름</label>
    <!-- required: 빈칸이면 브라우저가 제출을 막아준다(우리가 코드를 안 짜도 기본 검사가 됨). -->
    <input id="name" type="text" required />

    <label for="phone">연락처</label>
    <!-- type="tel": 휴대폰에서 숫자 위주 키패드가 떠 입력이 편해진다. placeholder는 빈칸일 때 보이는 예시 안내문. -->
    <input id="phone" type="tel" required placeholder="010-0000-0000" />

    <label for="message">문의 내용</label>
    <!-- textarea: 여러 줄을 받는 입력칸(한 줄짜리 input과 다름). rows="4"로 기본 높이를 4줄로 지정. -->
    <textarea id="message" rows="4" required></textarea>

    <!-- type="submit": 이 버튼을 누르면 form의 제출(submit)이 일어난다 → 아래 자바스크립트가 그 순간을 잡는다. -->
    <button type="submit">보내기</button>
  </form>

  <!-- 평소엔 CSS의 display:none으로 숨겨두는 성공 메시지 — 제출에 성공했을 때만 자바스크립트가 보이게 한다. -->
  <p class="ok" id="ok">접수되었습니다! 감사합니다. 🙌</p>

  <script>
    // HTML에서 id로 붙여둔 폼과 메시지 요소를 자바스크립트가 붙잡아 변수에 담는다 — 이래야 코드로 다룰 수 있다.
    const form = document.getElementById('contactForm');
    const ok = document.getElementById('ok');
    // "submit"(보내기) 사건이 일어나면 안쪽 함수를 실행하라고 폼에 미리 등록해 둔다.
    form.addEventListener('submit', function (e) {
      // 핵심: 폼은 원래 제출 시 페이지를 새로고침(또는 다른 곳으로 이동)한다.
      // preventDefault()로 그 기본 동작을 막아야 자바스크립트가 화면을 직접 바꿀 수 있다(안 쓰면 메시지가 보이자마자 새로고침돼 사라진다).
      e.preventDefault(); // 페이지 새로고침 막기
      // 지금은 서버가 없으니 화면에 확인 메시지만 보여준다.
      // 숨겨뒀던 성공 메시지를 보이게(display:block) 바꾼다.
      ok.style.display = 'block';
      // 입력칸을 모두 비워 다음 입력을 준비한다 — 같은 폼에 또 쓸 수 있게.
      form.reset();
    });
  </script>
</body>
</html>
