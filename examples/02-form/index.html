<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 — 실습</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
    h1 { color: #7b5e3b; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    button { margin-top: 18px; padding: 12px 20px; background: #7b5e3b; color: #fff; border: 0; border-radius: 999px; font-size: 1rem; cursor: pointer; }
    .ok { margin-top: 16px; color: #2e7d32; display: none; }
  </style>
</head>
<body>
  <h1>문의하기</h1>
  <p>아래 폼을 채우고 보내기를 눌러 보세요. (지금은 저장되지 않고 알림만 뜹니다 — 저장은 실습 03에서!)</p>

  <form id="contactForm">
    <label for="name">이름</label>
    <input id="name" type="text" required />

    <label for="phone">연락처</label>
    <input id="phone" type="tel" required placeholder="010-0000-0000" />

    <label for="message">문의 내용</label>
    <textarea id="message" rows="4" required></textarea>

    <button type="submit">보내기</button>
  </form>

  <p class="ok" id="ok">접수되었습니다! 감사합니다. 🙌</p>

  <script>
    const form = document.getElementById('contactForm');
    const ok = document.getElementById('ok');
    form.addEventListener('submit', function (e) {
      e.preventDefault(); // 페이지 새로고침 막기
      // 지금은 서버가 없으니 화면에 확인 메시지만 보여준다.
      ok.style.display = 'block';
      form.reset();
    });
  </script>
</body>
</html>
