<!DOCTYPE html>
<!-- 이 한 페이지만으로 동작합니다. 더블클릭해서 브라우저로 여세요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>간단 가계부 v1 (localStorage 실습)</title>
  <style>
    /* 꾸밈은 핵심이 아니라 보기 편하라고 넣은 최소한의 스타일입니다. */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 50px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #222;
    }
    h1 { font-size: 1.5rem; }
    .hint { color: #888; font-size: 0.9rem; }

    /* 입력 폼 한 줄 */
    .form-row { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
    .form-row input,
    .form-row select {
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    #descInput { flex: 2; min-width: 120px; }
    #amountInput { flex: 1; min-width: 90px; }
    #typeSelect { flex: 1; min-width: 90px; }

    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: 0;
      border-radius: 8px;
      background: #4a6cf7;
      color: #fff;
      cursor: pointer;
    }
    button.ghost { background: #eee; color: #333; }

    /* 합계 카드 3개 (수입 / 지출 / 잔액) */
    .summary { display: flex; gap: 8px; margin: 20px 0; }
    .summary .card {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      background: #f5f6fb;
    }
    .summary .card .label { font-size: 0.85rem; color: #666; }
    .summary .card .value { font-size: 1.1rem; font-weight: 700; margin-top: 4px; }
    .income .value { color: #1b8a4b; } /* 수입은 초록 */
    .expense .value { color: #c0392b; } /* 지출은 빨강 */
    .balance .value { color: #2c3e50; } /* 잔액은 짙은 회색 */

    /* 거래 목록 */
    ul#list { list-style: none; padding: 0; }
    ul#list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    li .amount.plus { color: #1b8a4b; }   /* 수입 금액은 초록 */
    li .amount.minus { color: #c0392b; }  /* 지출 금액은 빨강 */
    li .desc { flex: 1; }
    li .del {
      background: none;
      border: 0;
      color: #c0392b;
      cursor: pointer;
      font-size: 1rem;
      padding: 0 4px;
    }
    .empty { color: #999; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>
  <h1>간단 가계부 v1</h1>
  <p class="hint">내용·금액·종류를 적어 추가하면, 수입/지출 합계와 잔액이 <b>자동으로</b> 계산됩니다.</p>

  <!-- 입력 폼: 내용 + 금액 + 수입/지출 선택 + 추가 버튼 -->
  <div class="form-row">
    <input id="descInput" type="text" placeholder="내용 (예: 점심값, 용돈)" />
    <input id="amountInput" type="number" min="0" placeholder="금액" />
    <select id="typeSelect">
      <option value="income">수입</option>
      <option value="expense">지출</option>
    </select>
    <button id="addBtn">추가</button>
  </div>

  <!-- 합계 카드 3개 -->
  <div class="summary">
    <div class="card income">
      <div class="label">총수입</div>
      <div class="value" id="totalIncome">0원</div>
    </div>
    <div class="card expense">
      <div class="label">총지출</div>
      <div class="value" id="totalExpense">0원</div>
    </div>
    <div class="card balance">
      <div class="label">잔액</div>
      <div class="value" id="balance">0원</div>
    </div>
  </div>

  <div style="text-align:right; margin-bottom:8px;">
    <button id="clearBtn" class="ghost">전체 지우기</button>
  </div>

  <!-- 거래 목록이 여기에 그려집니다 -->
  <ul id="list"></ul>

  <script>
    // 1) 화면 요소들을 미리 찾아 둡니다.
    const descInput = document.getElementById("descInput");
    const amountInput = document.getElementById("amountInput");
    const typeSelect = document.getElementById("typeSelect");
    const addBtn = document.getElementById("addBtn");
    const clearBtn = document.getElementById("clearBtn");
    const listEl = document.getElementById("list");
    const totalIncomeEl = document.getElementById("totalIncome");
    const totalExpenseEl = document.getElementById("totalExpense");
    const balanceEl = document.getElementById("balance");

    // localStorage에 저장할 때 쓸 "이름표(키)"입니다.
    const STORAGE_KEY = "ledgerItems";

    // 2) 데이터를 담을 배열. 각 항목은 객체 하나입니다.
    //    예: { desc: "점심값", amount: 8000, type: "expense" }
    //    페이지가 열릴 때 localStorage에 저장된 게 있으면 꺼내서 시작합니다.
    let items = loadItems();

    // 3) localStorage에서 배열을 꺼내는 함수.
    //    저장된 값은 글자(문자열)이므로 JSON.parse로 다시 배열로 바꿉니다.
    function loadItems() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return []; // 저장된 게 없으면 빈 배열로 시작
      try {
        return JSON.parse(saved);
      } catch (e) {
        return []; // 혹시 값이 깨져 있어도 앱이 멈추지 않게 빈 배열로
      }
    }

    // 4) 배열을 localStorage에 저장하는 함수.
    //    배열은 그대로 못 넣으므로 JSON.stringify로 글자로 바꿔 저장합니다.
    function saveItems() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    }

    // 5) 숫자를 "1,000원" 처럼 보기 좋게 바꾸는 함수.
    function formatWon(n) {
      return n.toLocaleString("ko-KR") + "원";
    }

    // 6) 합계를 계산해 화면 위쪽 카드 3개를 갱신하는 함수.
    //    ★ reduce: 배열을 처음부터 끝까지 돌며 값을 "하나로 합치는" 도구입니다.
    function updateSummary() {
      // 수입만 골라 금액을 모두 더합니다. (sum은 누적 합계, item은 항목 하나)
      const totalIncome = items
        .filter(function (item) { return item.type === "income"; })
        .reduce(function (sum, item) { return sum + item.amount; }, 0);

      // 지출만 골라 금액을 모두 더합니다.
      const totalExpense = items
        .filter(function (item) { return item.type === "expense"; })
        .reduce(function (sum, item) { return sum + item.amount; }, 0);

      // 잔액 = 총수입 - 총지출
      const balance = totalIncome - totalExpense;

      totalIncomeEl.textContent = formatWon(totalIncome);
      totalExpenseEl.textContent = formatWon(totalExpense);
      balanceEl.textContent = formatWon(balance);
    }

    // 7) 거래 목록을 화면에 다시 그리는 함수.
    //    배열이 바뀔 때마다 목록을 통째로 새로 그립니다.
    function render() {
      listEl.innerHTML = ""; // 일단 비우고

      if (items.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "아직 기록이 없어요. 위에서 내용과 금액을 추가해 보세요.";
        listEl.appendChild(li);
      } else {
        // 배열의 각 항목을 <li>로 만들어 붙입니다.
        items.forEach(function (item, index) {
          const li = document.createElement("li");

          // 내용
          const descSpan = document.createElement("span");
          descSpan.className = "desc";
          descSpan.textContent = item.desc;

          // 금액 (수입이면 +, 지출이면 -)
          const amountSpan = document.createElement("span");
          const isIncome = item.type === "income";
          amountSpan.className = "amount " + (isIncome ? "plus" : "minus");
          amountSpan.textContent = (isIncome ? "+" : "-") + formatWon(item.amount);

          // 삭제 버튼
          const delBtn = document.createElement("button");
          delBtn.className = "del";
          delBtn.textContent = "✕";
          delBtn.addEventListener("click", function () {
            // index 번째 항목만 빼고 새 배열을 만듭니다. (filter)
            items = items.filter(function (_, i) { return i !== index; });
            saveItems();
            render();
            updateSummary();
          });

          li.appendChild(descSpan);
          li.appendChild(amountSpan);
          li.appendChild(delBtn);
          listEl.appendChild(li);
        });
      }
    }

    // 8) [추가] 버튼: 입력값을 읽어 새 항목을 배열에 넣고 저장합니다.
    addBtn.addEventListener("click", function () {
      const desc = descInput.value.trim();
      const amount = Number(amountInput.value); // 글자 → 숫자
      const type = typeSelect.value;

      // 간단한 검증
      if (!desc) {
        alert("내용을 입력해 주세요.");
        return;
      }
      if (!amount || amount <= 0) {
        alert("금액은 0보다 큰 숫자로 입력해 주세요.");
        return;
      }

      // 새 항목을 배열 끝에 추가
      items.push({ desc: desc, amount: amount, type: type });
      saveItems();   // ★ 브라우저에 저장
      render();      // 목록 다시 그리기
      updateSummary(); // 합계 다시 계산

      // 입력칸 비우고 다음 입력 준비
      descInput.value = "";
      amountInput.value = "";
      descInput.focus();
    });

    // 9) [전체 지우기] 버튼: 모든 기록을 삭제합니다.
    clearBtn.addEventListener("click", function () {
      if (!confirm("모든 가계부 기록을 지울까요?")) return;
      items = [];
      saveItems();
      render();
      updateSummary();
    });

    // 10) 페이지가 열리자마자 한 번 그려 줍니다.
    render();
    updateSummary();
  </script>
</body>
</html>
