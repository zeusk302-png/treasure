<!DOCTYPE html>
<html lang="ko">
  <head>
    <!--
      이 파일(index.html) = 장바구니 화면의 "뼈대"입니다.
      여기에는 빈 자리(상품 목록·장바구니 목록·합계)만 미리 만들어 두고,
      실제 내용은 script.js가 cart 배열을 보고 채워 넣습니다.
      (HTML=뼈대 / style.css=꾸미기 / script.js=동작·계산, 으로 역할을 나눠 둔 것)
      그래서 id="product-list", id="cart-list" 같은 빈 칸이 핵심입니다 —
      script.js가 이 id를 찾아 내용을 그려 넣기 때문에 함부로 바꾸면 화면이 비어 보입니다.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실습 250 — localStorage 장바구니</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>🛒 미니 쇼핑몰 장바구니</h1>
      <p class="sub">담기 · 빼기 · 수량 변경 · 총액 계산 (새로고침해도 유지됩니다)</p>
    </header>

    <main class="layout">
      <!-- 왼쪽: 판매 중인 상품 목록 -->
      <section class="products" aria-label="상품 목록">
        <h2>상품 목록</h2>
        <!-- 상품 카드는 script.js가 PRODUCTS 배열을 보고 자동으로 그립니다. -->
        <div id="product-list" class="product-list"></div>
      </section>

      <!-- 오른쪽: 장바구니 -->
      <aside class="cart" aria-label="장바구니">
        <h2>장바구니</h2>

        <!-- 비었을 때 안내 문구 -->
        <p id="cart-empty" class="cart-empty">장바구니가 비어 있어요. 왼쪽에서 상품을 담아 보세요.</p>

        <!-- 담긴 상품 목록(script.js가 채웁니다) -->
        <ul id="cart-list" class="cart-list"></ul>

        <!-- 합계 영역 -->
        <div class="summary">
          <div class="summary-row">
            <span>상품 수</span>
            <span><strong id="total-count">0</strong> 개</span>
          </div>
          <div class="summary-row total">
            <span>합계 금액</span>
            <span><strong id="total-price">0</strong> 원</span>
          </div>
        </div>

        <button id="clear-cart" class="clear-btn" type="button">장바구니 비우기</button>
      </aside>
    </main>

    <script src="script.js"></script>
  </body>
</html>
