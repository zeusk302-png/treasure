<!DOCTYPE html>
<!--
  이 파일이 무엇인가:
    실습 181의 예제 페이지(정적 HTML 한 장)입니다. '햇살카페'라는 가상의 카페 소개 페이지죠.
  왜 있는가:
    이 실습의 진짜 목표는 화면 디자인이 아니라, 아래 <head> 안의
    <title>과 <meta name="description"> 두 줄을 직접 채워 보는 것입니다.
    이 두 줄이 구글 검색결과에 보이는 '제목·설명'과 브라우저 탭 이름을 결정하기 때문입니다.
-->
<html lang="ko">
<head>
  <!-- 문자 인코딩: 한글이 깨지지 않게 utf-8 지정 -->
  <meta charset="UTF-8" />
  <!-- 모바일에서 화면 너비에 맞게 보이도록 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ▼▼▼ 이번 실습의 핵심 두 줄 ▼▼▼ -->

  <!-- title: 구글 검색결과의 '파란 제목'으로 나오는 부분.
       브라우저 탭에도 이 글자가 보인다. 페이지마다 '고유하게' 적는다.
       권장 길이: 한글 기준 30자 안팎 (너무 길면 검색결과에서 잘림) -->
  <title>햇살카페 — 동네 골목 끝 수제 디저트 카페</title>

  <!-- meta description: 검색결과에서 제목 아래에 보이는 '설명 두 줄'.
       검색 순위에 직접 영향은 작지만, 사람이 클릭할지 말지를 결정한다.
       권장 길이: 한글 기준 70~80자 안팎 -->
  <meta name="description" content="동네 골목 끝 작은 카페, 햇살카페입니다. 매일 아침 직접 굽는 수제 디저트와 핸드드립 커피를 즐겨 보세요." />

  <!-- ▲▲▲ 핵심 두 줄 끝 ▲▲▲ -->

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>햇살카페</h1>
    <p>동네 골목 끝, 햇살 잘 드는 작은 사랑방</p>
  </header>

  <main>
    <p>
      이 페이지의 본문은 실습의 핵심이 아닙니다.
      이번 실습의 진짜 결과물은 위쪽 <code>&lt;head&gt;</code> 안의
      <strong>title</strong>과 <strong>meta description</strong> 두 줄입니다.
    </p>
    <p>
      브라우저 탭의 제목 글자가 바로 <code>&lt;title&gt;</code> 내용이고,
      구글 검색결과에 보일 설명이 <code>meta description</code> 내용입니다.
    </p>
  </main>

  <footer>
    <small>© 2026 햇살카페</small>
  </footer>
</body>
</html>
