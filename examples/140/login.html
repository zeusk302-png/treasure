<!DOCTYPE html>
<!--
  실습 140 — login.html (로그인 시작 페이지)
  무엇: '구글로 계속하기' 버튼 하나가 있는 첫 화면입니다.
  왜 있나: 사용자가 비밀번호를 따로 만들지 않고 구글 계정으로 로그인을 '시작'하는 입구이기 때문입니다.
          버튼 클릭 → 구글 화면 이동(login.js) → 동의 후 callback.html 복귀, 이 흐름의 출발점입니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — 구글 소셜 로그인 실습(140)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="appHeader">
    <a class="logo" href="login.html">🔐 소셜 로그인</a>
  </header>

  <main>
    <h1>로그인</h1>
    <p class="hint">
      비밀번호를 따로 만들 필요 없이, 이미 가진 <strong>구글 계정</strong>으로 바로 로그인합니다.<br />
      아래 버튼을 누르면 구글 화면으로 갔다가, 동의하면 이 앱의 <code>callback.html</code>로 돌아옵니다.
    </p>

    <!-- ★ 이번 실습의 주인공: '구글로 계속하기' 버튼 ★ -->
    <button id="googleBtn" class="google-btn" type="button">
      <span class="g-icon" aria-hidden="true">G</span>
      구글로 계속하기
    </button>

    <div id="msg"></div>

    <p class="hint" style="margin-top:24px;">
      이미 로그인돼 있나요? <a href="callback.html">내 정보 페이지로 가기</a>
    </p>
  </main>

  <!-- Supabase 라이브러리 → 공통 설정 → 이 페이지 전용 스크립트 순서로 불러옵니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="login.js"></script>
</body>
</html>
