<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fr 단위로 비율 나눈 대시보드 격자 - CSS Grid 실습</title>
  <!-- 같은 폴더에 있는 style.css 파일을 불러옵니다 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>나의 대시보드</h1>
    <p>CSS Grid의 <code>fr</code> 단위로 영역 크기를 비율(1:2:1)로 나눈 격자입니다.</p>
  </header>

  <main>
    <!-- 이 div가 '격자판' 역할을 합니다. 여기에 display:grid 를 줍니다.
         grid-template-columns: 1fr 2fr 1fr  ->  왼쪽:가운데:오른쪽 = 1:2:1 비율 -->
    <section class="dashboard">

      <!-- 윗줄: 작은 카드 3개를 1:2:1 비율로 -->
      <div class="card card--small">
        <span class="card-label">오늘 방문자</span>
        <strong class="card-number">128</strong>
      </div>

      <!-- 가운데는 2fr 이라 양옆(1fr)의 2배 너비를 차지합니다 -->
      <div class="card card--wide">
        <span class="card-label">이번 주 매출</span>
        <strong class="card-number">₩1,240,000</strong>
        <p class="card-desc">가운데 칸은 <code>2fr</code> 이라 양옆 칸(1fr)보다 2배 넓습니다.</p>
      </div>

      <div class="card card--small">
        <span class="card-label">신규 가입</span>
        <strong class="card-number">17</strong>
      </div>

      <!-- 아랫줄: 큰 영역 1개가 3칸 전체를 차지(가로로 길게) -->
      <div class="card card--full">
        <span class="card-label">최근 활동 로그</span>
        <ul class="log-list">
          <li>09:12  김민수님이 가입했습니다.</li>
          <li>09:30  주문 #1042 가 결제 완료되었습니다.</li>
          <li>10:05  이서연님이 후기를 남겼습니다.</li>
        </ul>
        <p class="card-desc">이 칸은 <code>grid-column: 1 / -1</code> 로 첫 칸부터 마지막 칸까지 가로 전체를 차지합니다.</p>
      </div>

    </section>
  </main>
</body>
</html>
