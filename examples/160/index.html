<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 글자 크기가 정상으로 보이게 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 도서 검색 (디바운스 · 중복요청 막기)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>🔎 실시간 도서 검색 (타이핑하며 찾기)</h1>
    <p class="lead">
      검색 버튼을 누르지 않아도, <strong>타이핑이 멈추면</strong> 알아서 검색합니다.
      단, 글자 하나하나마다 서버를 두들기지 않도록 <strong>입력이 멈춘 뒤에만</strong> 한 번 보내고(<strong>디바운스</strong>),
      그 사이 새 검색이 시작되면 <strong>이전 요청은 취소</strong>합니다.
    </p>

    <!-- ===== 검색 입력 영역 ===== -->
    <section class="controls">
      <label class="ctrlLabel" for="queryInput">검색어 (입력만 하면 자동 검색)</label>
      <div class="ctrlRow">
        <input
          id="queryInput"
          type="text"
          placeholder="예: 어린왕자, 해리포터, Python"
          autocomplete="off"
        />
        <!-- 검색 중일 때만 보이는 작은 회전 표시(스피너) -->
        <span id="spinner" class="spinner" hidden aria-hidden="true"></span>
      </div>
      <p class="examples">
        눌러서 바로 시도:
        <button type="button" class="chip" data-q="어린왕자">어린왕자</button>
        <button type="button" class="chip" data-q="해리포터">해리포터</button>
        <button type="button" class="chip" data-q="python">python</button>
      </p>
    </section>

    <!-- ===== 상태 안내 줄 (대기 / 검색 중 / 결과 수 / 실패) ===== -->
    <p id="status" class="status" role="status">
      위 칸에 <strong>두 글자 이상</strong> 입력해 보세요. 타이핑을 멈추면 자동으로 검색합니다.
    </p>

    <!-- ===== '몇 번 호출했는지' 보여주는 학습용 계기판 ===== -->
    <!-- 디바운스가 정말 호출을 줄여 주는지 눈으로 확인하기 위한 패널입니다. -->
    <section class="meter" aria-label="요청 횟수 계기판">
      <span class="meterItem">키 입력: <b id="keyCount">0</b>회</span>
      <span class="meterItem">실제 검색 요청: <b id="reqCount">0</b>회</span>
      <span class="meterItem">취소된 요청: <b id="abortCount">0</b>회</span>
    </section>

    <!-- ===== 검색 결과 목록이 그려질 자리 ===== -->
    <ul id="resultList" class="resultList"></ul>
  </main>

  <!-- 화면(HTML)을 다 그린 뒤에 우리 동작(JS)을 불러온다 -->
  <script src="script.js"></script>
</body>
</html>
