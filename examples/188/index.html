<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 페이지 기본 정보 (181번 실습 참고) -->
  <title>부산 코딩스쿨 — 비전공자 웹개발 가이드</title>
  <meta name="description" content="비전공 청년을 위한 웹개발 따라하기 가이드입니다." />

  <!-- ★ 이번 실습의 핵심: 대표 주소(canonical) 한 개 지정 ★ -->
  <!--
    같은 페이지가 여러 주소로 열릴 수 있습니다. 예:
      https://내사이트.com/
      https://www.내사이트.com/
      https://내사이트.com/index.html
      https://내사이트.com/?utm_source=kakao   (광고 추적용 꼬리표)
    검색엔진은 이걸 "다른 페이지"로 오해해서 점수를 나눠 가질 수 있습니다.
    아래 한 줄로 "진짜 대표 주소는 이거예요" 하고 딱 한 개를 지정합니다.
    반드시 https:// 로 시작하는 "전체 주소"를 적어야 합니다. (/about 처럼 짧게 쓰면 안 됨)
  -->
  <link rel="canonical" href="https://내사이트.com/" />
</head>
<body>
  <header>
    <h1>부산 코딩스쿨</h1>
    <p>비전공 청년을 위한 웹개발 따라하기 가이드</p>
  </header>

  <main>
    <section>
      <h2>이 페이지는 무엇인가요?</h2>
      <p>
        이 페이지는 canonical(대표 주소) 태그를 연습하기 위한 예시입니다.
        화면에 보이는 내용보다 위쪽 &lt;head&gt; 안의
        <code>&lt;link rel="canonical"&gt;</code> 한 줄이 핵심입니다.
      </p>
      <p>
        브라우저에서 마우스 오른쪽 버튼 → "페이지 소스 보기"를 눌러
        &lt;head&gt; 안에 canonical 줄이 들어 있는지 확인해 보세요.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 부산 코딩스쿨</p>
  </footer>
</body>
</html>
