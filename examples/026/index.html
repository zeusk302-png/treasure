<!-- 이 한 줄은 "이 파일은 최신 HTML 문서입니다"라고 브라우저에게 알려주는 선언입니다. 항상 맨 위에 둡니다. -->
<!DOCTYPE html>

<!-- lang="ko"는 "이 페이지는 한국어"라는 뜻입니다. -->
<html lang="ko">

  <head>
    <!-- 한글이 깨지지 않게 글자 방식을 UTF-8로 지정합니다. -->
    <meta charset="UTF-8" />
    <!-- 휴대폰에서도 글자 크기가 적절히 보이게 하는 설정입니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS 첫걸음 — 글자 색·배경색·글꼴 크기</title>

    <!--
      여기가 오늘의 핵심입니다. <style> 안에 'CSS'를 적습니다.
      CSS의 기본 문법은 딱 세 부분으로 이루어져 있어요.

        선택자 {
          속성: 값;
        }

      - 선택자(selector): "누구를 꾸밀까?"  (예: p = 모든 문단)
      - 속성(property)  : "무엇을 바꿀까?"  (예: color = 글자 색)
      - 값(value)       : "어떻게 바꿀까?"  (예: white = 흰색)

      한 줄씩 읽으면 이렇게 됩니다.
      "p(문단)의 / color(글자 색)을 / white(흰색)으로 바꿔라."
    -->
    <style>
      /* p = 화면의 모든 <p> 문단을 골라서 꾸미겠다는 뜻 */
      p {
        /* 1) color: 글자 자체의 색 */
        color: white;

        /* 2) background-color: 글자 뒤 배경(바탕) 색 */
        background-color: #2563eb;

        /* 3) font-size: 글자 크기. px(픽셀)가 가장 직관적입니다. 숫자가 클수록 큰 글자. */
        font-size: 24px;

        /* (보너스) 글자 주변에 숨 쉴 공간을 줘서 더 읽기 좋게 만든 것 — 핵심 3개는 위 3줄입니다. */
        padding: 16px;
        border-radius: 8px;
      }
    </style>
  </head>

  <body>
    <!-- 이 제목은 일부러 꾸미지 않았습니다. 'CSS를 안 준 기본 글자'와 비교해 보세요. -->
    <h1>CSS 첫걸음</h1>

    <!-- 이 문단(<p>)이 위 <style>의 규칙에 따라 색·배경·크기가 바뀝니다. -->
    <p>이 문단은 CSS로 글자 색, 배경색, 글꼴 크기를 바꾼 문단입니다.</p>

    <!-- 같은 <p>이므로 이 문단도 똑같이 꾸며집니다. (선택자 p는 '모든 문단'을 가리키니까요) -->
    <p>같은 p 규칙을 받기 때문에 이 문단도 똑같은 모양이 됩니다.</p>
  </body>

</html>
