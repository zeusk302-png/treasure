<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEFORE — 키를 코드에 직접 박은 (위험한) 버전</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #1f2937; }
    .danger { background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; padding: 16px 20px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
    h1 { font-size: 1.4rem; }
  </style>
</head>
<body>
  <h1>❌ BEFORE — 이렇게 하면 안 됩니다</h1>
  <div class="danger">
    <p><strong>아래 스크립트는 Supabase URL과 키를 코드 본문에 그대로 박아(하드코딩) 두었습니다.</strong></p>
    <p>이 파일을 그대로 깃허브 <em>공개</em> 저장소에 올리면, 누구나 키를 줍어 갈 수 있습니다.
       이것이 바로 그 유명한 키 유출 사고들의 진짜 원인입니다 — "키를 잘못 만들어서"가 아니라
       <strong>"코드에 박아둔 채 공개 저장소에 올려서"</strong>입니다.</p>
  </div>

  <script>
    // ❌ 나쁜 예: 비밀이 코드 안에 그대로 노출됨
    const SUPABASE_URL = "https://abcdefghijklmnop.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.HARDCODED_ANON_KEY";
    // ❌ 최악: service_role(secret) 키까지 브라우저 코드에 박음 (마스터키 유출)
    const SUPABASE_SERVICE_ROLE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.HARDCODED_SERVICE_ROLE_SECRET";

    console.log("이 값들이 화면 소스와 깃허브에 그대로 노출됩니다:", SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY);
  </script>
</body>
</html>
