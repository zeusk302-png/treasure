<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFTER — 키를 분리한 (안전한) 버전</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; color: #1f2937; }
    .ok { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 12px; padding: 16px 20px; }
    .box { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 20px; margin-top: 16px; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
    h1 { font-size: 1.4rem; }
    .label { color: #6b7280; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>✅ AFTER — 키를 코드에서 분리했습니다</h1>
  <div class="ok">
    <p>이제 <code>index.html</code>에는 키 값이 한 글자도 없습니다.
       공개돼도 되는 값(URL · anon 키)은 <code>config.js</code>로,
       비밀 값(service_role)은 <code>.env.local</code>로 분리하고,
       <code>.env.local</code>은 <code>.gitignore</code>로 막아 깃허브에 안 올라가게 했습니다.</p>
  </div>

  <div class="box">
    <p class="label">화면에서 읽어온 공개 설정값(이건 노출돼도 안전합니다):</p>
    <p>URL: <code id="url">불러오는 중…</code></p>
    <p>anon 키: <code id="anon">불러오는 중…</code></p>
    <p class="label" style="margin-top:12px;">service_role(비밀) 키: 화면 코드에는 <strong>없습니다</strong>. (정상)</p>
  </div>

  <!-- 키 값은 코드 본문이 아니라 분리된 config.js에서 읽어옵니다 -->
  <script src="config.js"></script>
  <script>
    // 코드 본문에는 키가 없고, 분리된 설정에서 꺼내 씁니다.
    const cfg = window.APP_CONFIG;
    document.getElementById("url").textContent = cfg.SUPABASE_URL;
    document.getElementById("anon").textContent = cfg.SUPABASE_ANON_KEY;

    // 여기서부터 Supabase 클라이언트를 만든다면 anon 키만 사용합니다.
    // 예) const supabase = createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    // service_role 키는 이 화면 어디에서도 사용하지 않습니다.
  </script>
</body>
</html>
