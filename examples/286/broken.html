<!DOCTYPE html>
<!--
  이 파일은 무엇인가?
    "일부러 고장 내 둔" 버그 버전 화면이다. 목록이 항상 비어 보인다.
  왜 있는가?
    await 를 빠뜨리면 어떤 일이 벌어지는지 직접 체험하라고 둔 교보재다.
    F12 → Console 에서 todos 에 진짜 배열이 아니라 Promise 가 들어오는 순간을
    눈으로 확인한 뒤, 고친 정답 버전(index.html + script.js)과 비교한다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 할 일 목록 (버그 버전)</title>

  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    #status { color: #888; font-size: 14px; min-height: 20px; }
    ul { padding-left: 20px; }
    li { margin: 6px 0; }
    .hint { color: #888; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>오늘의 할 일 목록</h1>
  <p id="status">불러오는 중...</p>
  <ul id="todoList"></ul>

  <p class="hint">
    이 페이지는 일부러 고장 나 있습니다. 목록이 항상 비어 보입니다.<br />
    F12(개발자 도구) → Console 탭을 열어 무엇이 찍히는지 순서를 살펴보세요.
  </p>

  <!-- ❌ 문제의 핵심: fetch는 "지금 당장"이 아니라 "나중에" 끝나는 비동기 작업이다.
       그런데 아래 코드는 그 결과를 await(기다림) 없이 곧바로 사용한다.
       그래서 화면을 그리는 순간에는 데이터가 아직 도착하지 않아 목록이 늘 비어 보인다. -->
  <script>
    // 진짜 서버 대신, 0.5초 뒤에 응답이 도착하는 가짜 API를 흉내 낸다.
    // (실제 fetch도 응답이 "나중에" 오는 점은 똑같다.)
    function fetchTodos() {
      return new Promise(function (resolve) {
        setTimeout(function () {
          resolve(["우유 사기", "운동 30분", "이메일 답장하기"]);
        }, 500);
      });
    }

    function loadTodos() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("todoList");

      // 💥 버그: fetchTodos()는 "결과"가 아니라 "약속(Promise)"을 돌려준다.
      //    await 없이 받았으니 todos 안에는 [할 일 3개]가 아니라 Promise 객체가 들어 있다.
      const todos = fetchTodos();
      console.log("1) todos 값:", todos); // → Promise { <pending> } 가 찍힌다 (배열이 아님!)

      // Promise에는 .length(개수)도, 반복할 항목도 없다.
      // todos.length 는 undefined → 아래 for 반복은 한 번도 돌지 않는다.
      console.log("2) todos.length:", todos.length); // → undefined

      for (let i = 0; i < todos.length; i++) {
        const li = document.createElement("li");
        li.textContent = todos[i];
        listEl.appendChild(li);
      }

      // 데이터가 도착하기도 전에 "완료"라고 말해 버린다.
      statusEl.textContent = "할 일 " + todos.length + "개를 불러왔습니다.";
      console.log("3) 화면 그리기 끝 (그런데 목록은 비어 있다)");
    }

    loadTodos();
  </script>
</body>
</html>
