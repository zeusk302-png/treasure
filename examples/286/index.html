<!DOCTYPE html>
<!--
  이 파일은 무엇인가?
    비동기 순서 꼬임 버그를 "고친 정답 버전" 화면이다(broken.html 의 짝).
  왜 있는가?
    실제 그리는 로직은 script.js 에 있고, 이 HTML 은 그 로직이 채워 넣을
    빈 자리(#status, #todoList)만 제공한다. broken.html 과 나란히 열어
    before(빈 목록) ↔ after(할 일 3개)를 눈으로 비교하라고 둔 파일이다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 할 일 목록 (고친 버전)</title>

  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    #status { color: #888; font-size: 14px; min-height: 20px; }
    ul { padding-left: 20px; }
    li { margin: 6px 0; }
    .hint { color: #888; font-size: 13px; margin-top: 20px; }
  </style>

  <!-- ✅ 고친 핵심: 스크립트를 별도 파일로 빼고 defer 를 붙였다.
       defer = "HTML(DOM)을 다 읽은 뒤에 실행해 줘"라는 뜻이라
       script.js 가 돌 때는 아래 #status, #todoList 가 이미 존재한다. -->
  <script src="script.js" defer></script>
</head>
<body>
  <h1>오늘의 할 일 목록</h1>
  <p id="status">불러오는 중...</p>
  <ul id="todoList"></ul>

  <p class="hint">
    이 페이지는 정상 동작합니다. 잠깐(약 0.5초) 기다리면 할 일 3개가 나타납니다.
  </p>
</body>
</html>
