<!DOCTYPE html>
<!--
  이 파일(index.html): '안전한 챗봇'의 프론트(브라우저 화면)입니다.
  왜 있나: 사용자가 질문을 입력하면, AI를 '직접' 부르지 않고 우리가 배포한
          서버 함수(Edge Function /functions/v1/chat)에 질문만 보냅니다.
  왜 이렇게 하나: AI 비밀 키를 이 파일에 적으면 누구나 페이지 소스를 열어
          훔쳐 쓸 수 있기 때문(요금 폭탄). 그래서 비밀 키는 서버에만 두고,
          이 파일에는 공개돼도 되는 anon 키만 둡니다.
  짝꿍 파일: supabase/functions/chat/index.ts (실제 AI 호출을 대신하는 서버 함수)
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안전한 챗봇 — Edge Function 중계 실습</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; line-height: 1.6; color: #222; }
    h1 { font-size: 1.4rem; }
    .note { background: #eef6ff; border: 1px solid #cfe3ff; border-radius: 10px; padding: 12px 14px; font-size: 0.9rem; color: #234; }
    #chat { border: 1px solid #e2e2e2; border-radius: 12px; padding: 14px; min-height: 200px; margin: 16px 0; background: #fafafa; }
    .bubble { padding: 9px 13px; border-radius: 14px; margin: 8px 0; max-width: 80%; white-space: pre-wrap; word-break: break-word; }
    .me  { background: #2563eb; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
    .bot { background: #fff; border: 1px solid #e2e2e2; margin-right: auto; border-bottom-left-radius: 4px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 11px; border: 1px solid #ccc; border-radius: 999px; font-size: 1rem; }
    button { padding: 11px 18px; background: #2563eb; color: #fff; border: 0; border-radius: 999px; cursor: pointer; font-size: 1rem; }
    button:disabled { background: #9bb6e8; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>안전한 챗봇 (서버 중계 방식)</h1>

  <p class="note">
    이 페이지(브라우저)에는 <strong>비밀 AI 키가 전혀 없습니다.</strong>
    질문은 우리가 만든 <strong>Edge Function(서버 함수)</strong>으로 보내고, 진짜 AI 호출은 서버가 대신 합니다.
    여기 적는 값은 공개돼도 되는 <strong>anon(공개) 키</strong>뿐입니다.
  </p>

  <div id="chat">
    <div class="bubble bot">안녕하세요! 무엇이든 물어보세요. (이 답변은 서버 함수를 거쳐서 옵니다)</div>
  </div>

  <form id="form">
    <input id="q" placeholder="질문을 입력하세요" autocomplete="off" required />
    <button type="submit" id="send">보내기</button>
  </form>

  <script>
    // ─────────────────────────────────────────────────────────────
    // 아래 두 값을 내 Supabase 프로젝트 값으로 바꾸세요. (Settings → API)
    //  - PROJECT_REF: 내 프로젝트 주소 앞부분 (예: abcdwxyz1234)
    //  - ANON_KEY: anon(공개) 키. 공개돼도 되는 '출입증'이라 여기 둬도 됩니다.
    //
    // ★ 절대 여기에 service_role(비밀) 키나 AI API 키를 넣지 마세요. ★
    //    그 키들은 오직 Edge Function의 Secret(서버)에서만 살아 있어야 합니다.
    // ─────────────────────────────────────────────────────────────
    const PROJECT_REF = "REPLACE_WITH_YOUR_PROJECT_REF";              // 예: 내-프로젝트-아이디
    const ANON_KEY    = "REPLACE_WITH_YOUR_ANON_PUBLIC_KEY";          // anon(공개) 키

    // 우리가 배포한 챗봇 중계 함수의 주소
    const FUNCTION_URL = `https://${PROJECT_REF}.supabase.co/functions/v1/chat`;

    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const sendBtn = document.getElementById("send");

    // 말풍선 하나를 만들어 화면에 붙이는 함수.
    function addBubble(text, who) {
      const div = document.createElement("div");
      div.className = "bubble " + (who === "me" ? "me" : "bot");
      // textContent로 글자를 넣습니다(innerHTML 아님).
      // 왜: 사용자나 AI가 보낸 글에 <script> 같은 태그가 섞여 있어도
      //     '글자 그대로' 보여줄 뿐 실행되지 않게 막기 위함(XSS 방지).
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      addBubble(message, "me");
      input.value = "";
      sendBtn.disabled = true;
      const thinking = addBubble("생각 중…", "bot");

      try {
        // 서버 함수로 '질문만' 보냅니다. 비밀 키는 보내지 않습니다.
        // anon 키는 Supabase가 "이 함수를 불러도 되는 출입증"으로 요구합니다(공개 OK).
        const res = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + ANON_KEY,
          },
          body: JSON.stringify({ message }),
        });

        const data = await res.json();
        if (!res.ok) {
          thinking.textContent = "오류: " + (data.error || res.status);
        } else {
          thinking.textContent = data.reply;
        }
      } catch (err) {
        thinking.textContent = "네트워크 오류: " + err.message;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
