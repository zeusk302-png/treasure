<!--
  이 파일은 무엇인가: 첫 화면(index.html)의 "가게 소개" 링크가 도착하는 두 번째 페이지다.
  왜 있는가: "내부 링크(같은 사이트 안의 다른 파일로 이동)"가 제대로 연결되는지 확인하는
            착지점(landing page) 역할. index.html 에서 href="about.html" 로 여기 오고,
            아래 "← 첫 화면으로 돌아가기"(href="index.html")로 되돌아가면 경로가 올바른 것.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>가게 소개 — 우리 동네 분식집</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; line-height: 1.7; color: #202124; }
    h1 { color: #1a73e8; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h1>가게 소개</h1>
  <p>여기는 "가게 소개" 페이지(<code>about.html</code>)입니다. 첫 페이지(<code>index.html</code>)의 "가게 소개" 링크가 이 페이지로 정상 연결되면 링크 경로가 올바른 것입니다.</p>
  <p><a href="index.html">← 첫 화면으로 돌아가기</a></p>
</body>
</html>
