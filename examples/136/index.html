<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그아웃 버튼 만들기 — 깔끔하게 빠져나가기 실습</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ──────────────────────────────────────────────────────────
       이 파일은 무엇? : 실습 136 '로그아웃 버튼 만들기'의 화면(틀)입니다.
       왜 있나?        : 로그인한 사람만 보는 '비밀 메모' 보호 페이지를 흉내 내서,
                         로그아웃 = (세션 지우기 + 화면 정리 + 이동)을 직접 눌러 체험하기 위해서입니다.
       실제 동작(로그아웃 처리·로그인 상태에 따른 화면 그리기)은 모두 app.js에 들어 있습니다.
       이 HTML은 빈 자리(헤더·비밀 메모 박스·버튼)만 마련해 두고, app.js가 채워 넣습니다.
  ─────────────────────────────────────────────────────────── -->

  <!-- 공통 헤더: 로그인 상태면 이메일 + 로그아웃 버튼, 아니면 '로그인하러 가기'가 보입니다.
       (비어 있는 이유: 로그인 상태에 따라 내용이 달라서, app.js가 실행될 때 채웁니다.) -->
  <header id="appHeader"></header>

  <main>
    <h1>내 비밀 메모 (로그인한 사람만 볼 수 있는 보호 데이터)</h1>
    <p class="hint">
      이 페이지는 로그인한 사람의 '비밀 메모'를 보여주는 가상의 보호된 페이지입니다.<br />
      <strong>로그아웃 버튼</strong>을 누르면 세션이 지워지고, 화면의 비밀 메모도 깨끗이 사라진 뒤
      로그인 페이지로 자동 이동합니다.
    </p>

    <!-- ★ 로그아웃하면 이 안의 내용(보호 데이터)을 반드시 비워야 합니다. -->
    <section id="secretBox" class="secret">
      <p class="loading">불러오는 중…</p>
    </section>

    <!-- 본문 안에도 로그아웃 버튼을 하나 더 둬서, 큰 버튼으로 동작을 체험합니다. -->
    <button id="logoutMain" class="logout-big">로그아웃하고 나가기</button>

    <!-- ──────────────────────────────────────────────────────────
         아래 데모 로그인 박스는 '로그아웃을 체험하려면 먼저 로그인부터'
         하기 편하라고 넣은 보조 장치입니다.
         실제 서비스에서는 로그인은 login.html(실습 132)에서 합니다.
    ─────────────────────────────────────────────────────────── -->
    <div class="demo-login" id="demoLogin">
      <p><strong>로그아웃을 체험하려면 먼저 로그인하세요</strong></p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="이메일" required />
        <input id="password" type="password" placeholder="비밀번호" required />
        <button type="submit">로그인</button>
      </form>
      <div id="msg"></div>
    </div>
  </main>

  <!-- Supabase 자바스크립트 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 이번 실습의 결과물: 로그아웃 로직이 담긴 스크립트 -->
  <script src="app.js"></script>
</body>
</html>
