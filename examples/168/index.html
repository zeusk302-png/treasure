<!-- ============================================================
     이 파일은 GitHub Pages로 인터넷에 공개할 "대문 페이지"입니다.
     - 왜 이 파일이 있나: GitHub Pages는 저장소 맨 위의 index.html을
       자동으로 첫 화면으로 띄웁니다. 그래서 파일 이름이 반드시
       소문자 index.html 이어야 하고(다른 이름이면 404), 같은 폴더의
       style.css와 함께 올려야 디자인까지 보입니다.
     - 이 페이지에는 비밀값(비밀번호·API 키 등)이 전혀 없습니다.
       정적 사이트는 소스 코드가 누구에게나 공개되므로, 공개돼도
       안전한 내용만 넣는 것이 원칙입니다.
     ============================================================ -->
<!DOCTYPE html>
<html lang="ko"> <!-- lang="ko": 이 페이지가 한국어임을 브라우저·검색엔진·스크린리더에 알려 줌 -->
<head>
  <meta charset="UTF-8" /> <!-- 한글이 깨지지 않게 글자 인코딩을 UTF-8로 지정 -->
  <!-- viewport: 휴대폰에서도 글자가 작게 쪼그라들지 않고 화면 너비에 맞춰 보이게 함.
       이 줄이 없으면 모바일에서 PC 화면을 축소한 것처럼 작게 나옴 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 첫 GitHub Pages 사이트</title>
  <!-- 같은 저장소에 있는 style.css 파일을 불러옵니다.
       두 파일을 함께 올려야 디자인이 적용됩니다. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>인터넷에 공개됐습니다! 🌐</h1>
    <p class="lead">이 페이지는 GitHub Pages로 무료 주소에 띄운 제 첫 번째 사이트입니다.</p>

    <p>
      지금 보이는 이 화면이 <code>username.github.io</code> 주소로
      <strong>누구나 접속할 수 있게</strong> 공개되었습니다.
    </p>

    <p class="badge">🔗 내 코드가 진짜 인터넷 주소를 가졌습니다!</p>

    <p class="note">
      이 주소를 친구에게 보내거나 휴대폰으로 열어 보세요.<br />
      내 컴퓨터가 꺼져 있어도 전 세계 어디서든 열립니다.
    </p>
  </main>

  <footer class="foot">
    <!-- [내 이름]·[날짜]는 자리표시자입니다. 대괄호째 지우고 실제 값으로 바꿔 쓰세요.
         (배포 뒤 공개되는 부분이라 개인 비밀정보는 적지 마세요.) -->
    <p>만든 사람: <strong>[내 이름]</strong> · 공개한 날: <strong>[날짜]</strong></p>
  </footer>
</body>
</html>
