<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 검색 필터</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>맛집 검색 필터</h1>
    <p class="desc">검색창에 글자를 적으면 아래 목록이 즉시 걸러집니다. 가게 이름이나 메뉴 일부만 적어도 됩니다.</p>

    <!-- 검색 입력칸 -->
    <div class="search">
      <input
        type="search"
        id="searchInput"
        placeholder="예) 김밥, 분식, 파스타..."
        autocomplete="off"
      />
      <!-- 지금 몇 개가 보이는지 알려주는 자리 -->
      <span id="count" class="count" aria-live="polite"></span>
    </div>

    <!-- 검색 대상이 되는 목록 -->
    <!-- 각 li 의 data-keywords 에 검색에 쓸 단어를 미리 모아둔다 -->
    <ul id="list" class="list">
      <li data-keywords="행복김밥 분식 김밥 라면 떡볶이">
        <strong>행복김밥</strong>
        <span class="tag">분식 · 김밥/라면/떡볶이</span>
      </li>
      <li data-keywords="초밥하우스 일식 초밥 회 우동">
        <strong>초밥하우스</strong>
        <span class="tag">일식 · 초밥/회/우동</span>
      </li>
      <li data-keywords="파스타공방 양식 파스타 피자 리조또">
        <strong>파스타공방</strong>
        <span class="tag">양식 · 파스타/피자/리조또</span>
      </li>
      <li data-keywords="할매국밥 한식 국밥 수육 순대">
        <strong>할매국밥</strong>
        <span class="tag">한식 · 국밥/수육/순대</span>
      </li>
      <li data-keywords="청춘치킨 치킨 후라이드 양념 맥주">
        <strong>청춘치킨</strong>
        <span class="tag">치킨 · 후라이드/양념/맥주</span>
      </li>
      <li data-keywords="향기카페 카페 커피 라떼 케이크 디저트">
        <strong>향기카페</strong>
        <span class="tag">카페 · 커피/라떼/케이크</span>
      </li>
      <li data-keywords="만리장성 중식 짜장면 짬뽕 탕수육">
        <strong>만리장성</strong>
        <span class="tag">중식 · 짜장면/짬뽕/탕수육</span>
      </li>
      <li data-keywords="한입분식 분식 떡볶이 순대 튀김 김밥">
        <strong>한입분식</strong>
        <span class="tag">분식 · 떡볶이/순대/튀김</span>
      </li>
    </ul>

    <!-- 결과가 하나도 없을 때 보여줄 안내문 (평소엔 숨김) -->
    <p id="empty" class="empty" hidden>검색 결과가 없습니다.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
