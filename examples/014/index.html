<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>헤더·메인·푸터로 페이지 영역 나누기</title>

  <!--
    아래 <style>은 "영역이 눈에 보이도록" 색을 입힌 것뿐입니다.
    오늘의 핵심은 CSS가 아니라, 페이지를 header/main/footer 세 칸으로 나누는 것입니다.
    스타일은 지금 이해 못 해도 괜찮아요. (CSS는 B 카테고리에서 따로 배웁니다.)
  -->
  <style>
    /* 영역 구분이 한눈에 보이도록 각 영역에 옅은 배경색을 줍니다. */
    body   { margin: 0; font-family: sans-serif; line-height: 1.6; }
    header { background: #e3f2fd; padding: 20px; }   /* 머리말: 옅은 파랑 */
    main   { background: #ffffff; padding: 20px; }   /* 본문: 흰색 */
    footer { background: #eceff1; padding: 20px; }   /* 꼬리말: 옅은 회색 */
  </style>
</head>
<body>

  <!--
    ============================================================
    핵심 개념: "시맨틱(semantic) 태그"
    ------------------------------------------------------------
    semantic = "의미가 담긴". 즉 "이 영역이 무슨 역할인지"를
    태그 이름 자체로 알려 주는 태그입니다.

    예전에는 모든 영역을 그냥 <div>(의미 없는 빈 상자)로만 만들었습니다.
    그러면 사람이 봐도, 검색엔진/화면낭독기(시각장애인용 프로그램)가 봐도
    "여기가 머리말인지 본문인지" 알 수가 없었어요.

    그래서 만든 게 "이름에 의미가 있는 상자"들입니다:
      <header>  : 페이지 맨 위 "머리말" (제목/로고/메뉴 자리)
      <main>    : 페이지의 "진짜 본문" (그 페이지에서 제일 중요한 내용)
      <footer>  : 페이지 맨 아래 "꼬리말" (저작권/연락처 자리)

    이번 실습은 한 페이지를 이 세 칸으로 나누는 것이 전부입니다.
    ============================================================
  -->

  <!--
    [1] header = 머리말 (페이지 맨 위)
    보통 사이트 제목, 로고, 메뉴(네비게이션)가 들어갑니다.
    "이 페이지가 무엇인지"를 가장 먼저 알려 주는 자리예요.
  -->
  <header>
    <h1>부산 커피 한 잔</h1>
    <p>비전공자가 만든 첫 동네 카페 소개 페이지</p>
  </header>

  <!--
    [2] main = 본문 (페이지의 진짜 알맹이)
    그 페이지에서 "제일 보여 주고 싶은 내용"을 넣습니다.
    중요 규칙: <main>은 한 페이지에 딱 1개만 씁니다.
    (머리말/꼬리말처럼 반복되는 부분은 main에 넣지 않아요.)
  -->
  <main>
    <h2>오늘의 추천 메뉴</h2>
    <p>
      매일 아침 직접 내린 핸드드립 커피와, 갓 구운 스콘을 함께 즐겨 보세요.
      햇살 좋은 창가 자리가 특히 인기랍니다.
    </p>

    <h2>찾아오시는 길</h2>
    <p>부산 해운대구 어딘가 1층 (지하철 2호선 ○○역 3번 출구에서 도보 5분)</p>

    <h2>영업 시간</h2>
    <ul>
      <li>평일: 오전 8시 ~ 오후 9시</li>
      <li>주말: 오전 10시 ~ 오후 6시</li>
      <li>매주 월요일 휴무</li>
    </ul>
  </main>

  <!--
    [3] footer = 꼬리말 (페이지 맨 아래)
    저작권 표시, 연락처, 작은 안내 문구 등 "마무리 정보"가 들어갑니다.
    어느 페이지에 가든 맨 아래에 반복되는 부분이라고 생각하면 쉬워요.
  -->
  <footer>
    <p>© 2026 부산 커피 한 잔. 모든 권리 보유.</p>
    <p>문의: hello@example.com</p>
  </footer>

</body>
</html>
