<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마우스 올리면 떠오르는 hover 카드 효과</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>떠오르는 카드</h1>
    <p>아래 카드 위에 마우스를 올려보세요. 부드럽게 위로 떠오릅니다.</p>
  </header>

  <main class="card-grid">
    <!-- 카드 1 -->
    <article class="card">
      <div class="card-emoji">🌊</div>
      <h2 class="card-title">바다 여행</h2>
      <p class="card-text">파도 소리를 들으며 쉬어가는 해변 코스를 소개합니다.</p>
      <a class="card-link" href="#">자세히 보기</a>
    </article>

    <!-- 카드 2 -->
    <article class="card">
      <div class="card-emoji">⛰️</div>
      <h2 class="card-title">산 트레킹</h2>
      <p class="card-text">초보자도 걷기 좋은 완만한 등산로를 모았습니다.</p>
      <a class="card-link" href="#">자세히 보기</a>
    </article>

    <!-- 카드 3 -->
    <article class="card">
      <div class="card-emoji">🍜</div>
      <h2 class="card-title">맛집 탐방</h2>
      <p class="card-text">현지인이 즐겨 찾는 숨은 맛집 리스트를 만나보세요.</p>
      <a class="card-link" href="#">자세히 보기</a>
    </article>
  </main>
</body>
</html>
