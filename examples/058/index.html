<!DOCTYPE html>
<!--
  이 파일은 무엇? 이 실습의 '화면 뼈대'(HTML)입니다.
  왜 있나? 색이 바뀔 박스(id=colorBox)와 버튼 3개를 화면에 그려두는 곳입니다.
  실제 색을 바꾸는 동작은 script.js가, 모양·여백은 style.css가 담당합니다(역할 분리).
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>박스 색깔 바꾸기 버튼 3개</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>박스 색깔 바꾸기</h1>
    <p class="hint">아래 버튼을 누르면 박스 색이 바뀌어요.</p>

    <!-- 색이 바뀔 박스: id로 JS가 이 박스를 찾아냅니다 -->
    <div id="colorBox" class="box"></div>

    <!-- 버튼 3개: 각각 누르면 어떤 색으로 바꿀지 data-color에 적어둡니다 -->
    <div class="buttons">
      <button type="button" class="btn btn-red" data-color="#e53935">빨강</button>
      <button type="button" class="btn btn-green" data-color="#43a047">초록</button>
      <button type="button" class="btn btn-blue" data-color="#1e88e5">파랑</button>
    </div>
  </main>

  <!--
    script.js를 </body> '바로 앞'에서 불러오는 이유:
    위쪽 HTML(박스·버튼)이 먼저 다 그려진 뒤에 JS가 실행되어야
    document.getElementById/querySelectorAll이 그 요소들을 제대로 찾을 수 있기 때문입니다.
  -->
  <script src="script.js"></script>
</body>
</html>
