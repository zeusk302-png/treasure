<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 — Supabase 인증 실습</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 420px; margin: 60px auto; padding: 0 16px; line-height: 1.6; }
    h1 { color: #7b5e3b; }
    input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #7b5e3b; color: #fff; border: 0; border-radius: 999px; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: 0.6; cursor: default; }
    /* 결과 메시지 박스: 기본은 숨김, JS로 보이게 함 */
    #msg { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
    #msg.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    #msg.err { display: block; background: #fdecea; color: #c62828; }
  </style>
</head>
<body>
  <h1>로그인</h1>

  <form id="form">
    <!-- type=email 이면 형식이 틀릴 때 브라우저가 먼저 막아줍니다 -->
    <input id="email" type="email" placeholder="이메일" required />
    <input id="password" type="password" placeholder="비밀번호" required />
    <button type="submit">로그인</button>
  </form>

  <!-- 성공/실패 결과가 여기에 표시됩니다 -->
  <div id="msg"></div>

  <!-- Supabase 자바스크립트 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 아래 두 값을 내 Supabase 프로젝트 값으로 바꾸세요. (Settings → API)
    // anon(publishable) 키는 공개돼도 되는 '출입증'이라 여기 둬도 됩니다.
    // service_role(secret) 키는 절대 여기에 넣지 마세요 — RLS를 통째로 우회합니다.
    const SUPABASE_URL = "https://여기에-내-프로젝트.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_여기에-내-anon-키";

    const auth = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const msgEl = document.getElementById('msg');
    const btn = document.querySelector('button');

    // 결과 메시지를 화면에 보여주는 작은 도우미 함수
    function showMessage(text, isOk) {
      msgEl.textContent = text;
      msgEl.className = isOk ? 'ok' : 'err';
    }

    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault(); // 폼 기본 제출(새로고침)을 막습니다
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true; // 처리 중 중복 클릭 방지

      // signInWithPassword: 이메일·비밀번호로 로그인 시도
      const { data, error } = await auth.signInWithPassword({
        email: email,
        password: password
      });

      btn.disabled = false;

      if (error) {
        // 실패: 비밀번호가 틀렸거나, 가입 안 된 계정 등
        showMessage('로그인 실패: ' + error.message, false);
        return;
      }

      // 성공: 로그인한 사용자의 이메일로 환영 메시지
      showMessage(data.user.email + '님, 로그인 성공! 환영합니다 🎉', true);
    });
  </script>
</body>
</html>
