<!DOCTYPE html>
<!--
  파일 요약: WebSocket 실시간 채팅 "클라이언트"(브라우저 화면) — 실습 310

  이 파일은 무엇인가:
   - 사용자가 보는 채팅 화면입니다. server.js 와 WebSocket으로 연결해,
     메시지를 보내고 / 서버가 퍼뜨려 준 메시지를 즉시 화면에 그립니다.
   - 새로고침 없이 메시지가 실시간으로 뜨는 걸 직접 확인하는 게 목적입니다.

  중요(보안):
   - 사용자가 입력한 닉네임/메시지는 반드시 textContent 로만 출력합니다.
     innerHTML 로 넣으면 누군가 <script>를 채팅에 적었을 때 그게 실행되는 XSS 공격이 가능하기 때문에,
     "글자 그대로"만 보여 주는 textContent 로 막습니다.
   - 이 실습엔 API 키/비밀값이 전혀 없습니다(서버 주소만 있음). 그래서 페이지에 코드를 그대로 둬도 안전합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 채팅 (WebSocket 데모)</title>
  <style>
    :root {
      --main: #4f46e5;
      --bg: #f7f7fb;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --mine: #4f46e5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--main);
      color: #fff;
      padding: 16px 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 4px; font-size: 1.2rem; }
    header p { margin: 0; opacity: 0.9; font-size: 0.85rem; }
    #status {
      font-size: 0.8rem;
      text-align: center;
      padding: 6px;
      background: #eef2ff;
      color: var(--muted);
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 12px;
    }
    /* 닉네임 입력 줄 */
    .name-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .name-row input {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
    }
    /* 메시지가 쌓이는 영역 */
    #messages {
      height: 56vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
    }
    .msg { margin: 8px 0; }
    .msg .meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .msg .bubble {
      display: inline-block;
      background: #f1f5f9;
      padding: 8px 12px;
      border-radius: 12px;
      white-space: pre-wrap;       /* 줄바꿈/공백을 그대로 보여 줌 */
      word-break: break-word;      /* 긴 단어가 화면 밖으로 나가지 않게 */
      max-width: 100%;
    }
    /* 내가 보낸 메시지는 오른쪽 + 색을 다르게 */
    .msg.mine { text-align: right; }
    .msg.mine .bubble { background: var(--mine); color: #fff; }
    /* 시스템(입장/퇴장) 안내 */
    .msg.system {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }
    /* 메시지 입력 줄 */
    .send-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .send-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .send-row button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--main);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .send-row button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>실시간 채팅 (WebSocket 데모)</h1>
    <p>창을 2개 띄워 보세요 — 한쪽에서 보내면 다른 쪽에 즉시 뜹니다.</p>
  </header>

  <!-- 연결 상태(연결됨/끊김)를 사람이 눈으로 보게 표시합니다. -->
  <div id="status">서버에 연결 중…</div>

  <main>
    <div class="name-row">
      <!-- 닉네임 입력. 비워 두면 서버가 '익명'으로 처리합니다. -->
      <input id="name" type="text" placeholder="닉네임 (예: 세영)" maxlength="20" />
    </div>

    <!-- 메시지가 위에서 아래로 쌓이는 영역 -->
    <div id="messages" aria-live="polite"></div>

    <div class="send-row">
      <!-- 메시지 입력칸. Enter로도 전송되게 아래 스크립트에서 처리합니다. -->
      <input id="text" type="text" placeholder="메시지를 입력하고 Enter" maxlength="500" autocomplete="off" />
      <button id="send" disabled>보내기</button>
    </div>
  </main>

  <script>
    // ── 1) 화면 요소들을 미리 잡아 둡니다 (매번 다시 찾지 않으려고) ──
    const $status = document.getElementById("status");
    const $messages = document.getElementById("messages");
    const $name = document.getElementById("name");
    const $text = document.getElementById("text");
    const $send = document.getElementById("send");

    // ── 2) 서버 주소 정하기 ──
    // 로컬에서 직접 열면 ws://localhost:3000, 실제 배포(https)면 wss:// 로 자동 전환합니다.
    // 왜 자동 전환? https 페이지에서는 보안되지 않은 ws:// 연결이 브라우저에 의해 차단되기 때문입니다.
    // (배포 시에는 아래 WS_URL 을 실제 서버 주소로 바꾸면 됩니다. 비밀값이 아니라 주소일 뿐입니다.)
    const isSecure = location.protocol === "https:";
    const WS_URL = (isSecure ? "wss://" : "ws://") + (location.hostname || "localhost") + ":3000";

    // 내가 쓴 닉네임을 기억해 두기 위한 변수(내 메시지를 오른쪽에 그리려고 비교용).
    let myName = "";

    // ── 3) WebSocket 연결 열기 ──
    let socket;
    function connect() {
      socket = new WebSocket(WS_URL);

      // 연결이 열리면: 버튼을 켜고 상태 표시를 바꿉니다.
      socket.addEventListener("open", () => {
        $status.textContent = "연결됨 ✓ — 메시지를 보내 보세요";
        $send.disabled = false;
      });

      // 서버가 메시지를 보낼 때마다 실행 — 이게 "실시간"의 핵심입니다(요청 안 했는데도 옴).
      socket.addEventListener("message", (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch {
          return; // 형식이 깨진 데이터는 무시
        }
        renderMessage(data);
      });

      // 연결이 끊기면: 버튼을 끄고, 2초 뒤 자동으로 다시 붙습니다.
      // 왜 자동 재연결? 와이파이가 잠깐 끊겨도 사용자가 새로고침하지 않게 하려는 배려입니다.
      socket.addEventListener("close", () => {
        $status.textContent = "연결이 끊겼습니다. 다시 연결 중…";
        $send.disabled = true;
        setTimeout(connect, 2000);
      });

      socket.addEventListener("error", () => {
        $status.textContent = "연결 오류 — 서버(node server.js)가 켜져 있는지 확인하세요.";
      });
    }
    connect();

    // ── 4) 메시지를 화면에 그리는 함수 ──
    function renderMessage(data) {
      const wrap = document.createElement("div");

      if (data.type === "system") {
        // 입장/퇴장 같은 시스템 안내
        wrap.className = "msg system";
        // textContent 사용 — 서버가 만든 문구라도 항상 글자 그대로만 출력해 안전하게.
        wrap.textContent = data.text || "";
      } else {
        // 일반 채팅 메시지
        const mine = data.name === myName && myName !== "";
        wrap.className = "msg" + (mine ? " mine" : "");

        // 메타(닉네임 · 시간)
        const meta = document.createElement("div");
        meta.className = "meta";
        const time = data.time ? new Date(data.time).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) : "";
        // 닉네임과 시간을 합쳐 표시. 여기서도 textContent라 XSS 걱정이 없습니다.
        meta.textContent = `${data.name || "익명"} · ${time}`;

        // 말풍선(실제 메시지 내용)
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        // ★보안 핵심★ innerHTML 이 아니라 textContent.
        // 누군가 "<img src=x onerror=alert(1)>" 같은 걸 채팅에 적어도,
        // textContent는 그걸 "글자" 그대로 보여 줄 뿐 실행하지 않아 XSS를 막습니다.
        bubble.textContent = data.message || "";

        wrap.appendChild(meta);
        wrap.appendChild(bubble);
      }

      $messages.appendChild(wrap);
      // 새 메시지가 오면 항상 맨 아래로 스크롤(최신 글이 보이게).
      $messages.scrollTop = $messages.scrollHeight;
    }

    // ── 5) 메시지 보내기 ──
    function sendMessage() {
      const message = $text.value.trim();
      if (!message) return;               // 빈 메시지는 안 보냄
      if (!socket || socket.readyState !== WebSocket.OPEN) return; // 연결 안 됐으면 무시

      myName = $name.value.trim() || "익명"; // 보낼 때의 닉네임을 기억(내 메시지 정렬용)

      // 서버에는 객체를 JSON 문자열로 바꿔 보냅니다(WebSocket은 문자열만 전송 가능).
      socket.send(JSON.stringify({ name: myName, message }));

      $text.value = "";   // 입력칸 비우기
      $text.focus();      // 다음 메시지를 바로 칠 수 있게 커서 유지
    }

    // 버튼 클릭으로 전송
    $send.addEventListener("click", sendMessage);

    // Enter 키로도 전송 (줄바꿈이 아니라 보내기로 동작하게)
    $text.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
