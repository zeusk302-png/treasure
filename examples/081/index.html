<!-- ===== 이 파일은? =====
     스톱워치 실습의 '뼈대'(화면 구조) 파일입니다.
     화면에 보이는 숫자판과 버튼만 여기에 두고, 실제 시간 측정·갱신은 script.js가,
     색·크기 같은 꾸미기는 style.css가 맡습니다. 역할을 셋으로 나눠야
     나중에 한 곳만 고쳐도 다른 곳이 안 깨지기 때문입니다. -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스톱워치 (시작/정지/리셋)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>스톱워치</h1>
    <p class="desc">
      시작을 누르면 시간이 흐르고, 정지하면 멈추며, 리셋하면 0으로 돌아가는
      <strong>스톱워치</strong>입니다. 1/100초(0.01초)까지 표시됩니다.
      설치나 서버 없이 <code>index.html</code>을 더블클릭하면 바로 동작합니다.
    </p>

    <!-- ===== 스톱워치 위젯 =====
         숫자판(display)과 버튼 3개로만 이루어진 단순한 구조입니다.
         실제 시간 측정과 화면 갱신은 모두 script.js가 담당합니다. -->
    <section class="stopwatch">
      <!-- 경과 시간을 보여줄 숫자판. 형식은 분:초.1/100초 입니다. -->
      <div class="display" id="display">00:00.00</div>

      <div class="buttons">
        <!-- 시작/정지를 한 버튼으로 번갈아 합니다. 글자는 JS가 바꿉니다. -->
        <button id="startStopBtn" class="btn btn-start">시작</button>
        <!-- 0으로 되돌립니다. 멈춰 있을 때만 의미가 있습니다. -->
        <button id="resetBtn" class="btn btn-reset">리셋</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
