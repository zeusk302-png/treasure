<!-- 이 한 줄은 "이 파일은 최신 HTML 문서입니다"라고 브라우저에게 알려주는 선언입니다. 항상 맨 위에 둡니다. -->
<!DOCTYPE html>

<!-- <html>은 문서 전체를 감싸는 바깥 상자, lang="ko"는 "이 페이지는 한국어"라는 뜻입니다. -->
<html lang="ko">

  <head>
    <!-- 한글이 깨지지 않게 글자 방식을 UTF-8로 지정합니다. (없으면 한글이 ???로 보일 수 있어요) -->
    <meta charset="UTF-8" />
    <!-- 휴대폰에서도 글자 크기가 적절히 보이게 하는 설정입니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title>은 브라우저 탭에 표시되는 이름입니다. -->
    <title>여백(margin)과 안쪽 여백(padding) 비교</title>

    <!-- CSS는 보통 별도 파일로 빼지만, 이번엔 한 파일에서 한눈에 보려고 <style> 안에 모았습니다. -->
    <style>
      /* 페이지 전체의 기본 글꼴과 배경입니다. 본문이 아니라 '꾸미기'라 따로 신경 쓰지 않아도 됩니다. */
      body {
        font-family: "맑은 고딕", sans-serif;
        background-color: #f4f5f7;
        padding: 24px;          /* 페이지 가장자리와 내용 사이를 살짝 띄웁니다. */
        line-height: 1.6;
        color: #222;
      }

      h1 {
        font-size: 22px;
      }

      /* 설명 문단입니다. */
      .desc {
        max-width: 640px;
        color: #555;
      }

      /*
        아래 '바깥 회색 영역'은 박스가 페이지 안에서 어디에 놓이는지 보여주려고 만든 틀입니다.
        background-color를 회색으로 줘서, 박스의 'margin(바깥 여백)'이 만든 빈 공간이
        회색으로 비쳐 보이도록 했습니다. 즉 회색이 보이는 곳 = margin이 밀어낸 자리입니다.
      */
      .stage {
        background-color: #d9dde3;   /* 이 회색 위로 margin이 만든 빈틈이 드러납니다. */
        border: 2px dashed #9aa3af;  /* 틀의 경계를 점선으로 표시 */
        max-width: 640px;
        margin-bottom: 28px;
      }

      /*
        ★ 이번 실습의 주인공 박스입니다. ★
        - margin   : 박스 '바깥쪽' 여백. 박스와 옆/위/아래 다른 것들 사이를 벌립니다.
        - padding  : 박스 '안쪽' 여백. 테두리와 글자(내용) 사이를 벌립니다.
        아래 세 박스에 margin / padding을 다르게 줘서 차이를 눈으로 비교합니다.
      */
      .box {
        background-color: #4c8bf5;   /* 박스 자체의 색 (파랑) */
        color: #ffffff;
        border: 3px solid #1f5fd1;   /* 테두리를 진하게 줘서 '안쪽 padding'이 보이게 함 */
        width: 220px;
        font-weight: bold;
        text-align: center;
      }

      /* 1번 박스: margin·padding 둘 다 없음 (기준점) */
      .box-1 {
        margin: 0;     /* 바깥 여백 0 → 회색 틀에 딱 붙음 */
        padding: 0;    /* 안쪽 여백 0 → 글자가 테두리에 딱 붙음 */
      }

      /* 2번 박스: 안쪽 여백(padding)만 크게 → 박스가 통통해지고 글자가 테두리에서 멀어짐 */
      .box-2 {
        margin: 0;       /* 바깥은 그대로 붙어 있음 */
        padding: 30px;   /* 안쪽만 30px → 같은 글자라도 박스가 커집니다 */
      }

      /* 3번 박스: 바깥 여백(margin)만 크게 → 박스 크기는 그대로지만 회색 틀에서 멀어짐 */
      .box-3 {
        margin: 30px;    /* 바깥쪽 30px → 박스가 회색 틀 안에서 안쪽으로 들어옵니다 */
        padding: 0;      /* 안쪽은 0 → 글자는 테두리에 딱 붙음 */
      }
    </style>
  </head>

  <body>
    <h1>여백(margin) vs 안쪽 여백(padding) 눈으로 비교하기</h1>

    <p class="desc">
      회색 점선 틀은 "박스가 놓이는 자리"입니다. 회색이 보이는 빈 공간은
      <strong>margin(바깥 여백)</strong>이 만든 틈이고, 파란 박스 안에서 글자가
      테두리로부터 떨어진 거리는 <strong>padding(안쪽 여백)</strong>이 만든 틈입니다.
    </p>

    <!-- 1번: 기준 박스 (여백 없음) -->
    <div class="stage">
      <div class="box box-1">1번 · 여백 없음</div>
    </div>

    <!-- 2번: padding만 30px → 박스가 통통해짐, 회색은 안 보임 -->
    <div class="stage">
      <div class="box box-2">2번 · padding 30px</div>
    </div>

    <!-- 3번: margin만 30px → 박스 크기는 그대로, 회색 틈이 사방에 생김 -->
    <div class="stage">
      <div class="box box-3">3번 · margin 30px</div>
    </div>

    <p class="desc">
      핵심 한 줄: <strong>padding은 박스를 더 크게(통통하게)</strong> 만들고,
      <strong>margin은 박스를 주변에서 더 멀리 밀어냅니다.</strong>
    </p>
  </body>

</html>
