<!DOCTYPE html>
<!--
  이 파일(index.html): "비밀번호 강도 막대" 화면의 뼈대(구조)를 담당한다.
  왜 있나: 사용자가 비밀번호를 입력하는 칸·강도를 보여줄 막대·글자·조건 체크리스트 같은
          '눈에 보이는 요소'를 먼저 만들어 둬야, JS가 그 요소들을 찾아 값을 바꿀 수 있기 때문이다.
  역할 분담: 구조=이 파일(html), 꾸미기=style.css, 움직임(실시간 강도 계산)=script.js.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 강도 막대 (약함·보통·강함)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>비밀번호 강도 막대</h1>
    <p class="desc">
      비밀번호 칸에 글자를 입력해 보세요. 길이·숫자·특수문자 같은 조건을
      얼마나 만족하느냐에 따라 아래 막대가 빨강(약함) → 주황(보통) → 초록(강함)으로
      실시간으로 바뀝니다.
    </p>

    <!-- 1) 비밀번호 입력칸 -->
    <label for="password">비밀번호</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="비밀번호를 입력하세요"
      autocomplete="new-password"
    />

    <!-- 2) 강도 막대: 바깥 틀(.meter)과 그 안에서 채워지는 부분(.meter-bar) 두 겹으로 만든다. -->
    <!--    왜 두 겹? 바깥 틀은 회색 배경(아직 안 찬 부분)으로 고정해 두고,
            안쪽 막대만 JS가 너비(0~100%)와 색을 바꾸면 '차오르는' 느낌을 줄 수 있어서다. -->
    <!--    aria-hidden="true": 막대는 시각 장식이라 화면 낭독기가 굳이 읽지 않게 숨긴다. -->
    <div class="meter" aria-hidden="true">
      <div id="meterBar" class="meter-bar"></div>
    </div>

    <!-- 3) 강도 글자 표시 (약함/보통/강함) -->
    <!-- aria-live="polite": 화면 낭독기가 강도가 바뀔 때 읽어줌 -->
    <p id="strengthText" class="strength-text" aria-live="polite">비밀번호를 입력하세요</p>

    <!-- 4) 어떤 조건을 만족했는지 보여주는 체크리스트 -->
    <ul class="checklist">
      <li id="ruleLength">8자 이상</li>
      <li id="ruleNumber">숫자 포함</li>
      <li id="ruleSpecial">특수문자(!@#$ 등) 포함</li>
      <li id="ruleUpper">영어 대문자 포함</li>
    </ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
