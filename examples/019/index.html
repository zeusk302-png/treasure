<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6월 가계부</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>이번 달 가계부 만들기</h1>

  <!--
    표의 4가지 의미적 구역
    - caption : 표의 제목 (표가 무엇에 대한 표인지 설명)
    - thead   : 표의 머리 구역 (열 이름이 들어가는 곳)
    - tbody   : 표의 본문 구역 (실제 내용/데이터가 들어가는 곳)
    - tfoot   : 표의 바닥 구역 (합계처럼 요약하는 행이 들어가는 곳)
  -->
  <table>
    <!-- caption: 표 제목. table 바로 안, 맨 위에 한 번만 씁니다. -->
    <caption>2026년 6월 가계부</caption>

    <!-- thead: 머리 구역. 열 이름은 th(table header)로 적습니다. -->
    <thead>
      <tr>
        <th>날짜</th>
        <th>내용</th>
        <th>분류</th>
        <th>금액(원)</th>
      </tr>
    </thead>

    <!-- tbody: 본문 구역. 실제 지출 내역이 한 줄(tr)씩 들어갑니다. -->
    <tbody>
      <tr>
        <td>6/1</td>
        <td>점심 김밥</td>
        <td>식비</td>
        <td>5,000</td>
      </tr>
      <tr>
        <td>6/3</td>
        <td>버스·지하철</td>
        <td>교통</td>
        <td>3,200</td>
      </tr>
      <tr>
        <td>6/7</td>
        <td>노트 구매</td>
        <td>생활</td>
        <td>4,500</td>
      </tr>
      <tr>
        <td>6/10</td>
        <td>커피</td>
        <td>식비</td>
        <td>4,800</td>
      </tr>
    </tbody>

    <!-- tfoot: 바닥 구역. 합계처럼 요약하는 행을 넣습니다. -->
    <tfoot>
      <tr>
        <!-- colspan=3 : 가로로 칸 3개를 하나로 합쳐 '합계' 글자를 넣습니다. -->
        <th colspan="3">합계</th>
        <td>17,500</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
