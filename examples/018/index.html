<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>셀 병합으로 가격표 만들기</title>

  <!--
    이 실습의 주인공은 "셀 병합" 입니다.
    앞 단원(017)에서 표는 가로줄(<tr>) 안에 칸(<th>/<td>)을 나열해 만든다고 배웠어요.
    그런데 가격표를 보면 "한 칸이 옆으로 쭉 늘어나" 여러 칸을 덮거나,
    "한 칸이 아래로 쭉 늘어나" 여러 줄을 덮는 경우가 있습니다. 이것이 셀 병합입니다.

    - colspan="2"  : 이 칸을 "가로로(옆으로) 2칸" 차지하게 합친다. (column = 세로 열, 그 열을 가로로 먹는다)
    - rowspan="2"  : 이 칸을 "세로로(아래로) 2줄" 차지하게 합친다. (row = 가로 줄, 그 줄을 세로로 먹는다)

    [아주 중요한 규칙 - 칸 수 계산]
    한 칸이 colspan="2" 로 옆 2칸을 먹으면, 그 줄에서는 <td>/<th> 를 1개 "덜" 적습니다.
    한 칸이 rowspan="2" 로 아래 줄까지 먹으면, "아래 줄"에서는 그 자리에 칸을 1개 "덜" 적습니다.
    (이미 위 칸이 그 자리를 차지하고 내려왔기 때문이에요.)
    이 "덜 적기"를 깜빡하면 표가 오른쪽으로 삐져나가거나 칸이 어긋납니다.

    아래 <style> 의 테두리/색은 "어느 칸이 어디까지 합쳐졌는지" 눈에 보이게 하는 보조 장치예요.
    (CSS는 뒤 단원에서 본격적으로 배웁니다. 지금은 colspan/rowspan "구조"에 집중하세요.)
  -->
  <style>
    body { margin: 0; font-family: sans-serif; line-height: 1.6; color: #222; padding: 20px; }

    /* border-collapse: 칸과 칸 사이의 이중 테두리를 한 줄로 합쳐 깔끔하게 보이게 함 */
    table { border-collapse: collapse; width: 100%; max-width: 680px; }

    /* th(머리글)와 td(데이터) 모두에 테두리와 여백을 줘서 격자가 또렷이 보이게 함 */
    th, td { border: 1px solid #bbb; padding: 12px; text-align: center; }

    /* 머리글 칸(th)은 색을 입혀 "여기가 제목 줄/제목 칸"임을 한눈에 보이게 함 */
    th { background: #2b3a55; color: #fff; }

    /* caption: 표의 제목. 표 위쪽 가운데에 표시됩니다 */
    caption { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }

    /* 가운데 'PRO' 요금제를 살짝 강조해 "한 칸이 두 줄을 덮은" 느낌을 더 잘 보이게 함 (보조 장치) */
    .highlight { background: #fff4e0; }
  </style>
</head>
<body>

  <h1>요금제 비교 가격표</h1>

  <!--
    [이 표가 보여주려는 모양 - 글로 먼저 그려봅니다]

      ┌───────────────────────────────────────────────┐
      │           요금제 비교 (이 줄 = colspan 으로 3칸을 옆으로 합침) │   ← 1줄
      ├──────────────┬──────────────┬──────────────────┤
      │   항목       │   무료        │   프로            │   ← 2줄 (머리글)
      ├──────────────┼──────────────┼──────────────────┤
      │   월 요금    │   0원         │   9,900원         │   ← 3줄
      ├──────────────┼──────────────┼──────────────────┤
      │ 저장공간(이 칸이 │   1GB         │   100GB           │   ← 4줄
      │  rowspan 으로  ├──────────────┼──────────────────┤
      │  아래 2줄을 세로 │   파일만      │   파일+사진+영상   │   ← 5줄 (왼쪽 칸 없음! 위 칸이 내려옴)
      │  로 합침)      │              │                  │
      └──────────────┴──────────────┴──────────────────┘

    위 그림을 그대로 코드로 옮긴 것이 아래 <table> 입니다.
  -->
  <table>
    <!-- caption: 표 전체의 제목 -->
    <caption>○○ 서비스 요금제 한눈에 비교하기</caption>

    <!--
      [1] 맨 윗줄: 표 전체를 가로지르는 큰 제목 칸.
      이 표는 한 줄에 칸이 3개(항목/무료/프로)인데,
      이 줄은 그 3칸을 "옆으로 통째로" 합쳐 하나의 제목 칸으로 씁니다.
      => colspan="3" : 가로(열)로 3칸을 차지.
      그래서 이 <tr> 안에는 <th> 가 "단 1개" 뿐입니다. (3칸을 한 칸이 다 먹었으니까요)
    -->
    <tr>
      <th colspan="3">요금제 비교</th>
    </tr>

    <!--
      [2] 머리글 줄: 빈 모서리('항목') + 요금제 이름 2개.
      여기는 평범하게 칸 3개를 모두 적습니다. (병합 없음)
    -->
    <tr>
      <th>항목</th>
      <th>무료</th>
      <th class="highlight">프로</th>
    </tr>

    <!--
      [3] '월 요금' 줄: 맨 왼쪽 '월 요금'은 그 줄의 제목이라 <th>,
      나머지 금액은 데이터라 <td>. 병합 없이 칸 3개.
    -->
    <tr>
      <th>월 요금</th>
      <td>0원</td>
      <td class="highlight">9,900원</td>
    </tr>

    <!--
      [4] '저장공간' 줄 (rowspan 의 핵심!):
      맨 왼쪽 '저장공간' 칸이 "이 줄 + 바로 아래 줄" = 세로로 2줄을 차지합니다.
      => rowspan="2" : 세로(행)로 2줄을 차지.
      그래서 이 줄에는 칸이 3개: [저장공간(rowspan)] [1GB] [100GB]
    -->
    <tr>
      <th rowspan="2">저장공간</th>
      <td>1GB</td>
      <td class="highlight">100GB</td>
    </tr>

    <!--
      [5] 위 '저장공간' 칸이 내려온 줄:
      이미 왼쪽 첫 칸 자리는 위에서 내려온 '저장공간' 칸이 차지하고 있으므로,
      이 줄에서는 맨 왼쪽 칸을 "적지 않습니다". (적으면 칸이 1개 남아 표가 어긋나요)
      => 이 <tr> 에는 <td> 가 2개뿐! ([저장 가능 형식] 2개)
    -->
    <tr>
      <td>파일만</td>
      <td class="highlight">파일+사진+영상</td>
    </tr>
  </table>

  <!--
    [정리]
    - 1줄: <th> 1개 (colspan="3" 으로 3칸을 옆으로 합침)
    - 2줄: 칸 3개 (병합 없음)
    - 3줄: 칸 3개 (병합 없음)
    - 4줄: 칸 3개 (왼쪽 첫 칸이 rowspan="2")
    - 5줄: 칸 2개 (위 칸이 내려와 왼쪽 자리를 차지했으므로 1개 덜 적음)
    "병합한 만큼 그 줄의 칸을 덜 적는다" 가 셀 병합의 전부입니다.
  -->

</body>
</html>
