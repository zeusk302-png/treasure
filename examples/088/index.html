<!--
  무엇: 라디오 버튼(택일)과 체크박스(복수 선택)로 만든 "미니 설문 폼" 한 파일입니다.
  왜 있나: 같은 name으로 묶인 라디오는 하나만 켜지고, 체크박스는 여러 개 켜진다는 차이를
          서버·DB 없이 더블클릭만으로 눈으로 확인해 보라고 만든 실습 파일입니다.
          (라디오/체크박스 자체는 HTML만으로 작동하고, 맨 아래 JS는 고른 값을 화면에 보여주는 보조 장치일 뿐입니다.)
-->

<!-- 이 한 줄은 "이 파일은 최신 HTML 문서입니다"라고 브라우저에게 알려주는 선언입니다. 항상 맨 위에 둡니다. -->
<!DOCTYPE html>

<!-- <html>은 문서 전체를 감싸는 가장 바깥 상자입니다. lang="ko"는 "이 페이지는 한국어"라는 뜻입니다. -->
<html lang="ko">

  <!-- <head>는 "화면에 안 보이는 정보(설정)" 칸입니다. -->
  <head>
    <!-- 한글이 깨지지 않게 글자 방식을 UTF-8로 지정합니다. -->
    <meta charset="UTF-8" />

    <!-- 휴대폰에서도 글자 크기가 적절히 보이게 하는 설정입니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 탭에 표시되는 제목입니다. -->
    <title>미니 설문 폼 — 라디오와 체크박스</title>

    <!-- 이 실습은 한 파일로 끝내기 위해 간단한 스타일만 head 안에 넣었습니다. (핵심은 name 그룹이에요) -->
    <style>
      /* 글자체와 여백을 살짝 줘서 보기 편하게만 합니다. */
      body {
        font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
        max-width: 480px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }

      /* 질문 하나하나를 카드처럼 묶어 구분이 잘 되게 합니다. */
      fieldset {
        margin-bottom: 18px;
        padding: 14px 16px;
        border: 1px solid #e2e2e2;
        border-radius: 10px;
        background: #fafafa;
      }

      /* legend는 fieldset(질문 묶음)의 제목입니다. 질문 글자를 굵게 보여줍니다. */
      legend {
        font-weight: bold;
        padding: 0 6px;
      }

      /* 보기(선택지) 한 줄을 누르기 편하게 넓게 만듭니다. */
      .option {
        display: block;
        padding: 6px 0;
        cursor: pointer;
      }

      /* 동그라미/네모와 글자 사이에 살짝 간격을 줍니다. */
      .option input {
        margin-right: 8px;
        transform: scale(1.2); /* 손가락으로 누르기 쉽게 살짝 크게 */
        vertical-align: middle;
      }

      /* 제출 버튼을 누르기 좋게 크게 만듭니다. */
      button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        color: #fff;
        background: #4b7bec;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #3867d6;
      }

      /* 제출 결과를 보여주는 박스입니다. 처음에는 숨겨 둡니다. */
      #result {
        margin-top: 18px;
        padding: 14px 16px;
        border: 1px solid #c3e6cb;
        border-radius: 10px;
        background: #eafaf0;
        white-space: pre-line; /* 줄바꿈(\n)을 화면에서 실제 줄바꿈으로 보여줍니다 */
      }

      .hint {
        font-size: 13px;
        color: #666;
        margin: 6px 0 0;
      }
    </style>
  </head>

  <!-- <body>는 "화면에 실제로 보이는 내용"이 들어가는 칸입니다. -->
  <body>
    <h1>미니 설문 폼</h1>
    <p>
      선택형 입력에는 두 종류가 있습니다.
      <strong>라디오 버튼(◉)</strong>은 여러 보기 중 <strong>딱 하나만</strong> 고르는 칸이고,
      <strong>체크박스(☑)</strong>는 <strong>여러 개를 동시에</strong> 고를 수 있는 칸입니다.
      <br />
      비밀은 <strong>name 속성</strong>이에요. 같은 <code>name</code>으로 묶인 라디오 버튼끼리는
      "하나만 켜지는 한 묶음"이 됩니다.
    </p>

    <!--
      <form>은 입력칸들을 하나로 묶는 상자입니다.
      여기서는 서버로 보내지 않고(JS로 결과만 보여줌) 선택값을 화면에 표시할 거예요.
    -->
    <form id="surveyForm">

      <!--
        [질문 1] 라디오 버튼 = 택일(하나만)
        포인트: 아래 3개 input의 name이 모두 "channel"로 같습니다.
        같은 name으로 묶였기 때문에 하나를 켜면 나머지는 자동으로 꺼집니다.
        - id와 label의 for를 같은 이름으로 맞추면, 글자를 눌러도 동그라미가 켜집니다.
        - value는 "이 보기를 골랐을 때 실제로 전달되는 값"입니다.
      -->
      <fieldset>
        <legend>1. 우리 서비스를 어떻게 알게 되셨나요? (하나만)</legend>

        <label class="option" for="ch-search">
          <input type="radio" name="channel" id="ch-search" value="검색" checked />
          검색(네이버·구글)
        </label>

        <label class="option" for="ch-sns">
          <input type="radio" name="channel" id="ch-sns" value="SNS" />
          SNS(인스타·유튜브)
        </label>

        <label class="option" for="ch-friend">
          <input type="radio" name="channel" id="ch-friend" value="지인추천" />
          지인 추천
        </label>

        <p class="hint">세 개 다 <code>name="channel"</code> 이라서 <strong>하나만</strong> 켜집니다.</p>
      </fieldset>

      <!--
        [질문 2] 체크박스 = 복수 선택(여러 개)
        포인트: 아래 4개 input의 name이 모두 "interest"로 같지만,
        체크박스는 같은 name이어도 서로 끄지 않습니다. 원하는 만큼 켤 수 있어요.
      -->
      <fieldset>
        <legend>2. 관심 있는 주제를 모두 골라 주세요 (여러 개)</legend>

        <label class="option" for="int-web">
          <input type="checkbox" name="interest" id="int-web" value="웹개발" />
          웹 개발
        </label>

        <label class="option" for="int-design">
          <input type="checkbox" name="interest" id="int-design" value="디자인" />
          디자인
        </label>

        <label class="option" for="int-ai">
          <input type="checkbox" name="interest" id="int-ai" value="AI" />
          AI
        </label>

        <label class="option" for="int-marketing">
          <input type="checkbox" name="interest" id="int-marketing" value="마케팅" />
          마케팅
        </label>

        <p class="hint">네모(체크박스)는 같은 <code>name</code>이어도 <strong>여러 개</strong> 켤 수 있어요.</p>
      </fieldset>

      <!-- type="submit" 버튼을 누르면 form이 "제출"됩니다. -->
      <button type="submit">설문 제출</button>
    </form>

    <!-- 제출하면 여기에 고른 값이 표시됩니다. 처음엔 hidden(숨김)으로 안 보입니다. -->
    <div id="result" hidden></div>

    <!--
      아래 JavaScript는 "이번 실습의 핵심"은 아닙니다.
      서버 없이도 '내가 고른 값'을 눈으로 확인하라고 결과를 화면에 보여줄 뿐이에요.
      라디오/체크박스 자체는 JS 없이도 HTML만으로 잘 작동합니다.
    -->
    <script>
      // 폼(form)을 가져옵니다.
      const form = document.getElementById("surveyForm");
      const resultBox = document.getElementById("result");

      // 제출(submit) 이벤트가 일어나면 아래 함수가 실행됩니다.
      form.addEventListener("submit", function (event) {
        // 기본 동작(페이지 새로고침/서버 전송)을 막습니다. 우리는 화면에만 보여줄 거예요.
        event.preventDefault();

        // [라디오] 체크된 한 개를 찾습니다. (name="channel" 중 checked 된 것)
        const checkedChannel = form.querySelector('input[name="channel"]:checked');
        const channelValue = checkedChannel ? checkedChannel.value : "(선택 안 함)";

        // [체크박스] 체크된 것들을 "모두" 찾아 값만 모읍니다.
        const checkedInterests = form.querySelectorAll('input[name="interest"]:checked');
        const interestValues = Array.from(checkedInterests).map((box) => box.value);
        const interestText = interestValues.length > 0 ? interestValues.join(", ") : "(선택 안 함)";

        // 결과 박스에 보기 좋게 출력합니다.
        resultBox.hidden = false;
        // textContent로 출력합니다. (innerHTML로 넣으면 보기 값(value)에 들어온 글자가
        //  코드처럼 실행될 수 있어 XSS 보안 위험이 있어요. textContent는 글자를 글자 그대로만 보여줘 안전합니다.)
        resultBox.textContent =
          "제출된 값\n" +
          "1. 알게 된 경로(택일): " + channelValue + "\n" +
          "2. 관심 주제(복수): " + interestText;
      });
    </script>
  </body>

</html>
