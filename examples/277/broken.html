<!DOCTYPE html>
<!--
  이 파일은 무엇? : 실습 277의 '디버깅 연습용(일부러 고장 낸)' 파일입니다. 추천 도서 카드를 보여주려 하지만 디자인이 안 먹습니다.
  왜 있나?       : 스스로 버그를 찾는 연습을 하라고 둔 파일입니다. CSS 속성명에 오타 5개가 숨어 있습니다.
                   먼저 이 파일을 브라우저로 열어 '왜 밋밋하지?'를 직접 찾고, 그다음 같은 폴더의 index.html(정답)과 비교하세요.
  핵심 포인트     : CSS는 오타 난 속성명을 에러 없이 '조용히 무시'하므로, 콘솔에 빨간 에러가 안 떠도 스타일이 안 먹을 수 있습니다.
                   아래 BUG ①~⑤ 주석이 일부러 심어둔 오타 위치입니다. (F12 → Elements → Styles 에서 취소선으로도 확인됩니다.)
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천 도서 카드 — (고장난 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #eef1f6;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    /* 추천 도서 카드 — 보라색 배경에 흰 글씨, 가격은 굵게 강조하려고 했으나 오타 때문에 하나도 안 먹습니다 */
    .card {
      width: 280px;
      padding: 24px;
      border-radius: 16px;

      /* BUG ①: 속성명이 'background' 인데 'bacground' 로 오타 → 보라색 배경이 안 칠해짐 */
      bacground: #6c4ad6;

      /* BUG ②: 속성명이 'color' 인데 'colour'(영국식) 로 오타 → 글자색이 흰색이 안 됨 */
      colour: #ffffff;

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .card h2 {
      margin: 0 0 8px 0;

      /* BUG ③: 속성명이 'font-size' 인데 'font-sze' 로 오타 → 제목이 커지지 않음 */
      font-sze: 22px;
    }

    .card .author {
      margin: 0 0 16px 0;

      /* BUG ④: 속성명이 'opacity' 인데 'opactiy' 로 오타 → 글자가 살짝 연해지지 않음 */
      opactiy: 0.8;
    }

    .card .price {
      /* BUG ⑤: 속성명이 'font-weight' 인데 'font-weigth' 로 오타 → 가격이 굵게 강조 안 됨 */
      font-weigth: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>아주 작은 습관의 힘</h2>
    <p class="author">제임스 클리어 지음</p>
    <p class="price">15,800원</p>
  </div>
</body>
</html>
