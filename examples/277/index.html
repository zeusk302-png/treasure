<!DOCTYPE html>
<!--
  이 파일은 무엇? : 실습 277의 '정답(고친 버전)' 파일입니다. 추천 도서 카드 한 개를 보여줍니다.
  왜 있나?       : 같은 폴더의 broken.html(일부러 CSS 속성명에 오타 5개를 낸 파일)과 한 줄씩 비교하라고 둔 정답입니다.
                   여기서는 오타가 모두 고쳐져 있어, 카드가 보라색 배경 + 흰 글씨 + 굵은 가격으로 제대로 보입니다.
  핵심 포인트     : CSS는 모르는(오타 난) 속성명을 만나면 에러 없이 그 줄을 '조용히 무시'합니다.
                   그래서 철자 한 글자만 틀려도 그 스타일이 통째로 안 먹습니다. 아래 FIXED 주석이 그 비교 지점입니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>추천 도서 카드 — (고친 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #eef1f6;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    /* 추천 도서 카드 — 보라색 배경에 흰 글씨, 가격은 굵게 강조 */
    .card {
      width: 280px;
      padding: 24px;
      border-radius: 16px;

      /* FIXED ①: 'bacground' → 'background' (배경색 정상 적용) */
      background: #6c4ad6;

      /* FIXED ②: 'colour' → 'color' (글자색 정상 적용, color 는 미국식 철자만 인정) */
      color: #ffffff;

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .card h2 {
      margin: 0 0 8px 0;

      /* FIXED ③: 'font-sze' → 'font-size' (제목 크기 정상 적용) */
      font-size: 22px;
    }

    .card .author {
      margin: 0 0 16px 0;

      /* FIXED ④: 'opactiy' → 'opacity' (글자가 살짝 연해짐) */
      opacity: 0.8;
    }

    .card .price {
      /* FIXED ⑤: 'font-weigth' → 'font-weight' (가격 굵게 강조) */
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>아주 작은 습관의 힘</h2>
    <p class="author">제임스 클리어 지음</p>
    <p class="price">15,800원</p>
  </div>
</body>
</html>
