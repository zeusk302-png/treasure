<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 글자 크기가 정상으로 보이게 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 날씨 위젯 — 도시 이름 넣으면 날씨 표시</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>🌤️ 오늘 날씨 위젯</h1>
    <p class="lead">
      도시 이름을 넣으면 <strong>무료 공개 날씨 API</strong>를 불러
      <strong>기온·날씨 상태·아이콘</strong>을 보여줍니다.
      이번 실습의 핵심은 <strong>"열쇠(API 키) 없이 쓰는 공개 API"</strong>와
      <strong>"응답 속 숫자 코드를 한국어 날씨로 바꾸기"</strong>입니다.
    </p>

    <!-- 검색창. form으로 감싸면 Enter로도 즉시 검색할 수 있다. -->
    <form id="cityForm" class="searchBar">
      <input
        id="city"
        type="text"
        placeholder="예: 부산, 서울, Tokyo, Paris"
        value="부산"
        autocomplete="off"
      />
      <button type="submit">날씨 보기</button>
    </form>

    <!-- ★학습 포인트★ 우리가 실제로 만들어 보낸 '주소'를 눈으로 보여주는 칸.
         도시 이름이 어떻게 두 번의 요청(① 좌표 찾기 → ② 날씨 받기)으로 바뀌는지 확인한다. -->
    <div class="urlBox">
      <span class="urlLabel">① 도시 → 좌표 찾기 요청 주소</span>
      <code id="geoUrlView" class="urlView">(아직 검색 전)</code>
      <span class="urlLabel" style="margin-top:10px;">② 좌표 → 날씨 받기 요청 주소</span>
      <code id="weatherUrlView" class="urlView">(아직 검색 전)</code>
    </div>

    <!-- 받아오는 중/결과 없음/실패 안내가 들어갈 자리 -->
    <p id="status" class="status">도시 이름을 입력하면 오늘 날씨가 표시됩니다.</p>

    <!-- 날씨 결과 카드. 처음에는 숨겨져 있다. -->
    <section id="result" class="weather" hidden>
      <div class="icon" id="weatherIcon">⛅</div>
      <div class="temp" id="temp">--°C</div>
      <div class="desc" id="desc">날씨 상태</div>
      <p class="place" id="place">도시 이름</p>
      <ul class="extra">
        <li><span class="exLabel">체감</span><span id="feels">--°C</span></li>
        <li><span class="exLabel">습도</span><span id="humidity">--%</span></li>
        <li><span class="exLabel">바람</span><span id="wind">-- m/s</span></li>
      </ul>
    </section>
  </main>

  <!-- 화면(HTML)을 다 그린 뒤에 동작(JS)을 불러온다 -->
  <script src="script.js"></script>
</body>
</html>
