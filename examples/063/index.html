<!--
  실시간 글자 수 카운터 - 화면(구조) 파일
  무엇: 자기소개를 적는 입력칸(textarea)과, 그 아래 "현재/최대" 글자 수 표시를 담은 한 페이지.
  왜 있나: 글자 수를 세는 자바스크립트(script.js)가 "어느 입력칸을 읽고 / 어느 자리에 숫자를 쓸지"
          알 수 있도록, 각 요소에 id를 붙여 둔 뼈대 역할을 한다.
          (디자인은 style.css, 실시간 동작은 script.js가 따로 맡는다 — 역할을 파일별로 나눠 둠.)
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 글자 수 카운터</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="wrap">
    <h1>한 줄 소개 적기</h1>
    <p class="hint">타이핑할 때마다 아래에 글자 수가 바로바로 표시돼요.</p>

    <!-- 여러 줄 입력칸(textarea) -->
    <!-- maxlength="100" : 100자를 넘으면 더 이상 입력되지 않습니다 (브라우저가 막아줍니다) -->
    <label for="message">소개 문구 (최대 100자)</label>
    <textarea
      id="message"
      maxlength="100"
      rows="4"
      placeholder="여기에 자기소개를 적어보세요"
    ></textarea>

    <!-- 글자 수가 표시될 자리.
         처음 값 0/100은 화면이 비어 있을 때를 보여주는 것이고,
         타이핑이 시작되면 script.js가 이 숫자를 계속 바꿉니다. -->
    <p class="counter">
      <span id="count">0</span>/<span id="max">100</span>
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
