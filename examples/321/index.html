<!--
  실습 321 — 스켈레톤 로딩 UI (index.html)
  무엇: 데이터를 불러오는 동안 회색 뼈대(스켈레톤)를 먼저 보여주고,
        도착하면 진짜 카드로 바꾸는 화면의 "뼈대"입니다.
  왜: 빈 흰 화면 대신 스켈레톤을 보여주면 같은 대기 시간도 더 빠르게 느껴집니다(체감 속도).
  구성: 이 파일은 골격만 담고, 모양은 style.css, 동작(상태 전환)은 script.js가 맡습니다.
        (역할을 파일별로 나누면 초보가 어디를 고칠지 찾기 쉬워서 이렇게 분리했습니다.)
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 한글이 깨지지 않도록 글자 인코딩을 UTF-8로 지정합니다. -->
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 카드 그리드가 알맞게 보이도록 하는 반응형 기본 설정입니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스켈레톤 로딩 UI 데모</title>
  <!-- 모양(스켈레톤 박스, shimmer 애니메이션, 카드 디자인)은 모두 이 파일에 있습니다. -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>스켈레톤 로딩 UI</h1>
    <p>데이터를 기다리는 동안 빈 화면 대신 "뼈대"를 보여줘 체감 속도를 올립니다.</p>
  </header>

  <main class="container">
    <!--
      조작 버튼 영역.
      - 불러오기: 정상 흐름(스켈레톤 → 진짜 카드)을 실행합니다.
      - 실패 모드: 일부러 실패시켜 에러 상태(에러 메시지 + 다시 시도)를 확인합니다.
      두 경로를 버튼으로 나눈 이유: 로딩 상태 3종(loading/success/error)을 직접 비교해 보게 하려는 것입니다.
    -->
    <div class="toolbar">
      <button id="loadBtn" class="btn btn-primary" type="button">불러오기</button>
      <button id="failBtn" class="btn" type="button">실패 모드로 불러오기</button>
    </div>

    <!--
      카드가 실제로 들어갈 영역. 처음엔 비어 있고, script.js가 상태에 따라 채웁니다.
      aria-busy: 화면을 못 보는 사람을 위한 "지금 로딩 중" 신호입니다.
                 로딩이 시작되면 script.js가 true로, 끝나면 false로 바꿔 줍니다.
      aria-live="polite": 내용이 바뀌면 보조기기가 조용히 알려 주도록 합니다.
    -->
    <section id="list" class="grid" aria-busy="false" aria-live="polite">
      <!-- 시작 안내. 버튼을 누르면 script.js가 이 안내를 스켈레톤/카드/에러로 교체합니다. -->
      <p class="hint">위의 버튼을 눌러 로딩 UI를 확인해 보세요.</p>
    </section>
  </main>

  <footer class="foot">
    실습 321 · 부산코딩스쿨 비전공 청년용 웹개발 가이드
  </footer>

  <!-- 동작(상태 전환 로직)은 이 스크립트에 있습니다. defer: HTML을 다 읽은 뒤 실행되게 합니다. -->
  <script defer src="script.js"></script>
</body>
</html>
