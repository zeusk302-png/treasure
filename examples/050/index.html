<!DOCTYPE html>
<!--
  이 파일은 무엇인가: CSS만으로 만든 '로딩 스피너' 예제의 화면(HTML) 부분입니다.
  왜 있는가: 데이터를 불러오는 동안 "처리 중이에요"를 알려 주는 빙글 도는 고리를
            이미지·JavaScript 없이 CSS만으로 만드는 원리를 익히기 위한 실습입니다.
  구조: 스피너의 '모양과 움직임'은 모두 같은 폴더의 style.css 가 담당하고,
        이 HTML 은 스피너를 놓을 빈 상자(div/span)만 제공합니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 모바일에서도 화면 너비에 맞게 보이도록 하는 필수 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>빙글 도는 로딩 스피너</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="wrap">
    <h1>로딩 스피너 만들기</h1>
    <p class="desc">
      아래 동그란 고리가 <strong>멈추지 않고 빙글빙글</strong> 돈다면 성공입니다.
      데이터를 불러오는 동안 "기다려 주세요"를 보여줄 때 자주 쓰는 모양입니다.
    </p>

    <!-- ① 가장 기본: 한 줄이 빠진 고리가 회전하는 스피너 -->
    <section class="demo">
      <!-- 이 div 하나가 곧 스피너입니다. 모양은 모두 CSS가 만듭니다.
           role="status" 와 aria-label 을 넣은 이유: 빙글 도는 모양은 '눈'으로만 보이고
           화면낭독기(시각장애인용 음성 안내)에는 안 보이기 때문에, "지금 불러오는 중"임을
           소리로도 알려 주려고 붙입니다. -->
      <div class="spinner" role="status" aria-label="불러오는 중"></div>
      <p class="label">기본 스피너</p>
    </section>

    <!-- ② 응용: 점 세 개가 차례로 통통 튀는 스피너 -->
    <section class="demo">
      <div class="dots" role="status" aria-label="불러오는 중">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
      <p class="label">점 세 개 스피너</p>
    </section>
  </main>

</body>
</html>
