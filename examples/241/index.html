<!-- 이 한 줄은 "이 파일은 최신 HTML 문서입니다"라고 브라우저에게 알려주는 선언입니다. 항상 맨 위에 둡니다. -->
<!DOCTYPE html>

<!-- 문서 전체를 감싸는 가장 바깥 상자입니다. lang="ko"는 "이 페이지는 한국어"라는 뜻입니다. -->
<html lang="ko">

  <head>
    <!-- 한글이 깨지지 않게 글자 방식을 UTF-8로 지정합니다. (없으면 한글이 ???로 보일 수 있어요) -->
    <meta charset="UTF-8" />

    <!-- 휴대폰에서도 글자 크기가 적절히 보이게 하는 설정입니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 브라우저 "탭"에 표시되는 이름입니다. (화면 본문이 아니라 탭 제목) -->
    <title>다크모드 기억하기 — localStorage 실습</title>

    <!-- 디자인(색·여백)은 style.css 파일에 따로 적어 두고 여기서 불러옵니다. -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <!--
    여기가 핵심입니다.
    <html> 태그에 data-theme="..." 라는 표시(속성)를 붙여 두면,
    style.css 가 그 표시를 보고 "지금은 밝은 모드구나 / 어두운 모드구나" 판단해 색을 바꿉니다.
    아래 script.js 가 페이지가 열리자마자 이 표시를 저장된 값으로 바꿔 줍니다.
  -->
  <body>

    <!-- 페이지 맨 위 영역. 제목과 테마 전환 버튼을 둡니다. -->
    <header>
      <h1>다크모드 기억하기</h1>

      <!--
        이 버튼을 누르면 밝은 화면 ↔ 어두운 화면이 번갈아 바뀝니다.
        버튼 안의 글자(🌙 / ☀️)는 자바스크립트가 현재 상태에 맞춰 바꿔 줍니다.
        id="theme-toggle" 는 "이 버튼을 자바스크립트에서 부를 때 쓰는 이름표"입니다.
      -->
      <button id="theme-toggle" type="button">🌙 어둡게</button>
    </header>

    <!-- 이 페이지의 본문입니다. 테마가 바뀌면 글자색·배경색이 함께 바뀌는 것을 눈으로 확인하세요. -->
    <main>
      <section class="card">
        <h2>이 실습에서 배우는 것</h2>
        <p>
          위 버튼으로 테마를 한 번 바꾼 다음, <strong>새로고침(F5)</strong> 하거나
          브라우저를 껐다 켜고 다시 들어와 보세요. 직전에 고른 테마가 그대로 유지됩니다.
        </p>
        <p>
          비밀은 <strong>localStorage</strong>(브라우저 안의 작은 메모장)입니다.
          내가 고른 값을 여기에 적어 두기 때문에, 새로고침해도 그 메모를 다시 읽어
          같은 화면을 보여 줄 수 있습니다.
        </p>
      </section>

      <section class="card">
        <h2>지금 저장된 값</h2>
        <!-- 자바스크립트가 localStorage에 저장한 값을 이 칸에 그대로 보여 줍니다. (학습용) -->
        <p>localStorage 에 저장된 theme 값: <code id="saved-value">읽는 중…</code></p>
      </section>
    </main>

    <!--
      자바스크립트는 보통 </body> 바로 앞에서 불러옵니다.
      그래야 위쪽 버튼·문단 같은 화면 요소가 모두 만들어진 뒤에 코드가 실행됩니다.
      이번 실습의 "결과물"은 바로 이 script.js 입니다.
    -->
    <script src="script.js"></script>
  </body>

</html>
