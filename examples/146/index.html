<!DOCTYPE html>
<!--
  이 파일: '오늘의 명언' 페이지의 뼈대(화면 구조)다.
  왜 있나: 보이는 것(HTML)·꾸밈(style.css)·동작(script.js)을 따로 두면
          역할이 또렷해 비전공자도 어디를 고칠지 찾기 쉽기 때문이다.
  이 파일은 '자리'만 만든다. 명언을 실제로 받아 채우는 일은 script.js가 한다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 글자 크기가 정상으로 보이게 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 명언</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>오늘의 명언</h1>

    <!-- 명언이 들어올 자리. 처음엔 안내 문구만 보여준다. -->
    <blockquote id="quote">버튼을 눌러 명언을 받아보세요.</blockquote>

    <!-- 명언을 말한 사람 이름이 들어올 자리 -->
    <p id="author" class="author"></p>

    <!-- 이 버튼을 누르면 script.js의 함수가 실행된다 -->
    <button id="getBtn">명언 받기</button>
  </main>

  <!-- 화면(HTML)을 다 그린 뒤에 동작(JS)을 불러온다 -->
  <script src="script.js"></script>
</body>
</html>
