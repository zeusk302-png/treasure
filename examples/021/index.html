<!--
  이 파일이 무엇인가: div 박스에 인라인 style(태그 안에 직접 적는 CSS)로
  background(배경색)·padding(안쪽 여백)·border(테두리)를 줘서 색이 있는 알림 박스를 만드는 실습 페이지입니다.
  왜 있는가: CSS 파일을 따로 만들지 않고 태그 옆에 바로 적어보며,
  이 세 가지 속성이 박스를 어떻게 꾸미는지 "눈으로" 확인하기 위한 입문용 예제입니다.
  (실무에서는 보통 style 속성 대신 별도 CSS 파일로 분리하지만, 여기서는 한 파일에서 바로 효과를 보려고 인라인으로 둡니다.)
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>알림 박스 만들기</title>
</head>
<body style="font-family: 'Segoe UI', sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; line-height: 1.6;">

  <h1 style="font-size: 24px;">알림 박스 모음</h1>
  <p>div에 인라인 style로 배경색(background), 안쪽 여백(padding), 테두리(border)를 주면 눈에 띄는 안내 박스를 만들 수 있어요.</p>

  <!-- 1. 성공(초록) 알림 박스
       세 가지 핵심 속성을 한 박스에 모았습니다. 왜 이렇게 적는지:
       - background: 박스 안쪽을 채우는 배경색. 성공을 뜻하는 연한 초록(#e6f4ea)으로 "긍정" 느낌을 줍니다.
       - padding: 글자와 테두리 사이 안쪽 여백. 0이면 글자가 선에 딱 붙어 답답하므로 16px로 숨 쉴 공간을 줍니다.
       - border: "두께 종류 색" 순서(1px solid #34a853 = 1px 두께의 실선, 진한 초록)로 박스 경계를 그립니다.
       - border-radius: 모서리를 둥글게(6px) 해 딱딱하지 않게 보이게 합니다.
       - color: 글자색. 배경과 같은 색 계열이지만 더 진하게 해서 잘 읽히게 합니다.
       - margin-bottom: 아래 박스와의 바깥 간격. 박스끼리 붙지 않게 띄웁니다. -->
  <div style="background: #e6f4ea; padding: 16px; border: 1px solid #34a853; border-radius: 6px; color: #1e6b32; margin-bottom: 16px;">
    저장이 완료되었습니다. (성공 알림)
  </div>

  <!-- 2. 경고(노랑) 알림 박스 -->
  <div style="background: #fff8e1; padding: 16px; border: 1px solid #f9a825; border-radius: 6px; color: #8a6d00; margin-bottom: 16px;">
    입력하지 않은 항목이 있습니다. (경고 알림)
  </div>

  <!-- 3. 오류(빨강) 알림 박스 -->
  <div style="background: #fde8e8; padding: 16px; border: 1px solid #d93025; border-radius: 6px; color: #a01a12; margin-bottom: 16px;">
    비밀번호가 일치하지 않습니다. (오류 알림)
  </div>

  <!-- 4. 정보(파랑) + 왼쪽 굵은 테두리로 강조한 박스
       왜 border가 아니라 border-left인가: border는 네 면(상하좌우)에 모두 선을 긋지만,
       border-left는 "왼쪽 면에만" 굵은 선(5px solid #1a73e8)을 줍니다.
       한쪽만 굵게 하면 시선이 그쪽으로 쏠려 "여기 주목!" 하는 강조 효과를 낼 수 있어 안내문에 자주 씁니다. -->
  <!-- 4. 정보(파랑) + 왼쪽 굵은 테두리로 강조한 박스 -->
  <div style="background: #e8f0fe; padding: 16px; border-left: 5px solid #1a73e8; border-radius: 6px; color: #174ea6;">
    이 기능은 무료로 이용할 수 있습니다. (정보 알림 — 왼쪽 테두리 강조)
  </div>

</body>
</html>
