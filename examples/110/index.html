<!DOCTYPE html>
<!-- 이 한 페이지만으로 동작합니다. 더블클릭해서 브라우저로 여세요. -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 목록 저장하기 (배열 + JSON 실습)</title>
  <style>
    /* 꾸밈은 핵심이 아니라 보기 편하라고 넣은 최소한의 스타일입니다. */
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 16px;
      line-height: 1.6;
      color: #222;
    }
    h1 { font-size: 1.4rem; }
    .row { display: flex; gap: 8px; margin: 16px 0; }
    input {
      flex: 1;
      padding: 10px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: 0;
      border-radius: 8px;
      background: #4a6cf7;
      color: #fff;
      cursor: pointer;
    }
    /* 할 일이 쌓이는 목록 */
    #todoList {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }
    #todoList li {
      padding: 12px 14px;
      border: 1px solid #eee;
      border-radius: 8px;
      margin-bottom: 8px;
      background: #fafafa;
    }
    .hint { color: #888; font-size: 0.9rem; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>할 일 목록 (브라우저에 저장됨)</h1>
  <p class="hint">할 일을 여러 개 추가한 뒤 <b>새로고침(F5)</b> 해도 그대로 남아 있는지 확인해 보세요.</p>

  <div class="row">
    <!-- 사용자가 할 일을 입력하는 칸 -->
    <input id="todoInput" type="text" placeholder="할 일을 입력하세요 (예: 우유 사기)" />
    <!-- 추가 버튼 -->
    <button id="addBtn">추가</button>
  </div>

  <!-- 저장된 할 일들이 표시되는 곳 -->
  <ul id="todoList"></ul>

  <script>
    // 1) 화면 요소들을 미리 찾아 둡니다.
    const todoInput = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const todoList = document.getElementById("todoList");

    // localStorage에 저장할 때 쓸 "이름표(키)"입니다. 항상 같은 글자를 써야 다시 꺼낼 수 있습니다.
    const STORAGE_KEY = "todos";

    // 2) 할 일들을 담아 둘 "배열" 변수.
    //    여러 개의 데이터는 이렇게 배열 하나에 모아서 다룹니다.
    //    예: ["우유 사기", "운동 가기", "책 읽기"]
    let todos = [];

    // 3) 페이지가 열리자마자 localStorage에서 저장된 할 일을 꺼내 봅니다.
    //    localStorage에는 "글자(문자열)"만 저장할 수 있어서,
    //    배열을 그대로 넣을 수 없습니다. 그래서 저장할 땐 JSON 글자로 바꾸고,
    //    꺼낼 땐 다시 배열로 되돌립니다.
    function loadTodos() {
      const saved = localStorage.getItem(STORAGE_KEY); // 저장된 "글자"를 꺼냄 (없으면 null)
      if (saved) {
        // JSON.parse: 저장돼 있던 글자를 다시 "배열"로 되돌립니다.
        todos = JSON.parse(saved);
      } else {
        todos = []; // 처음 방문이면 빈 배열로 시작
      }
    }

    // 4) 현재 배열(todos)을 localStorage에 저장하는 함수.
    //    JSON.stringify: 배열을 저장 가능한 "글자"로 바꿉니다.
    function saveTodos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); // ★ 여기서 브라우저에 저장됩니다.
    }

    // 5) 배열(todos)을 보고 화면 목록을 처음부터 다시 그리는 함수.
    //    "한 줄만 추가"가 아니라 매번 "통째로 다시 그리는" 방식을 씁니다.
    //    이유: 화면을 항상 배열(todos) 기준으로 새로 만들면, 배열과 화면이 어긋날 일이 없어
    //    초보자가 추적하기 가장 쉽기 때문입니다(나중에 삭제/완료 기능을 붙여도 그대로 동작).
    function render() {
      todoList.innerHTML = ""; // 일단 화면을 비우고 (직전에 그린 목록을 지워 중복 표시를 막음)

      if (todos.length === 0) {
        // 할 일이 하나도 없을 때 안내 문구
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "아직 할 일이 없어요. 위에서 추가해 보세요.";
        todoList.appendChild(li);
        return;
      }

      // 배열에 들어 있는 할 일을 하나씩 꺼내 <li>로 만들어 붙입니다.
      todos.forEach(function (todo) {
        const li = document.createElement("li");
        // textContent로 출력합니다. innerHTML로 하면 사용자가 입력한 <script> 같은 글자가
        // 진짜 코드로 실행될 수 있어(XSS 위험) 막는 것입니다. textContent는 항상 "글자 그대로"만 보여 줍니다.
        li.textContent = todo;
        todoList.appendChild(li);
      });
    }

    // 6) [추가] 버튼: 입력칸의 값을 배열에 넣고, 저장하고, 다시 그립니다.
    function addTodo() {
      const text = todoInput.value.trim(); // 앞뒤 공백 제거
      if (!text) {
        alert("할 일을 입력해 주세요.");
        return;
      }
      todos.push(text); // ★ 배열 끝에 새 할 일을 추가
      saveTodos();      // 바뀐 배열을 localStorage에 저장
      render();         // 화면 다시 그리기
      todoInput.value = ""; // 입력칸 비우기
      todoInput.focus();    // 바로 다음 할 일을 칠 수 있게 커서 두기
    }

    // 7) 버튼 클릭과 Enter 키 모두로 추가할 수 있게 연결합니다.
    addBtn.addEventListener("click", addTodo);
    todoInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        addTodo();
      }
    });

    // 8) 시작: 저장된 할 일을 불러와서 화면에 그립니다.
    loadTodos();
    render();
  </script>
</body>
</html>
