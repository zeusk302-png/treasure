<!DOCTYPE html>
<!--
  이 파일은 무엇인가: "라면 끓이는 순서"를 보여주는 가장 단순한 HTML 한 장입니다.
  왜 있는가: 순서가 중요한 내용을 표시하는 '순서 있는 목록(<ol>)'을 처음 익히는 실습용 예제입니다.
            번호(1, 2, 3...)를 사람이 직접 적지 않아도 브라우저가 자동으로 붙여준다는 점을 눈으로 확인하는 게 목표입니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>라면 끓이는 순서</title>
</head>
<body>
  <h1>라면 맛있게 끓이는 순서</h1>

  <p>아래 순서대로 따라 하면 누구나 맛있는 라면을 끓일 수 있어요.</p>

  <!-- ol = ordered list(순서 있는 목록). li 하나하나에 1, 2, 3... 번호가 자동으로 붙습니다. -->
  <!-- 왜 <ol>을 쓰나: 조리 단계처럼 '먼저-다음-그다음' 순서가 의미를 가질 때 씁니다.
       li를 추가하거나 위아래 순서를 바꿔도 번호가 알아서 다시 매겨지므로, 숫자를 손으로 적을 필요가 없습니다.
       (순서가 상관없는 목록이라면 점으로 표시되는 <ul>을 써야 합니다.) -->
  <ol>
    <li>냄비에 물 550ml(종이컵 약 3컵)를 붓습니다.</li>
    <li>물을 센 불에 올려 팔팔 끓입니다.</li>
    <li>물이 끓으면 면과 분말 수프, 건더기 수프를 함께 넣습니다.</li>
    <li>면을 젓가락으로 풀어주며 4분 30초 동안 끓입니다.</li>
    <li>기호에 따라 계란이나 파를 넣습니다.</li>
    <li>불을 끄고 그릇에 옮겨 담아 맛있게 먹습니다.</li>
  </ol>

  <p>참고: 물 양과 끓이는 시간은 라면 봉지 뒷면 설명을 따르면 더 정확해요.</p>
</body>
</html>
