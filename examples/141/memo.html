<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀 메모장 — RLS로 본인 데이터만 보기 (141)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    ★ 이번 실습의 핵심 ★
    같은 memos 테이블을 여러 사람이 함께 써도,
    '로그인한 본인의 메모'만 화면에 나옵니다.
    그 비밀은 이 HTML이 아니라, 데이터베이스에 켜 둔 RLS 정책에 있습니다.
    (schema.sql 의 auth.uid() = user_id)

    여기 코드는 그냥 "내 메모 다 줘 / 한 줄 추가 / 한 줄 삭제"라고만 요청합니다.
    '내 것만' 걸러주는 일은 Supabase가 RLS로 알아서 해줍니다.
  -->

  <header id="appHeader">
    <span class="logo">🔒 비밀 메모장</span>
    <nav id="userArea" hidden>
      <span class="user" id="userEmail"></span>
      <button id="logoutBtn" class="logout-btn">로그아웃</button>
    </nav>
  </header>

  <main>

    <!-- (가) 로그인 전 화면 — 로그인/회원가입 -->
    <section id="loginView">
      <h1>로그인하고 내 메모 보기</h1>
      <p class="hint">
        메모장은 <strong>로그인한 본인만</strong> 쓸 수 있습니다.
        처음이라면 같은 폼에서 <strong>회원가입</strong>부터 하세요.
        (이메일 인증을 꺼두었다면 가입 즉시 로그인됩니다.)
      </p>

      <form id="authForm" class="login-form">
        <input id="email" type="email" placeholder="이메일" required />
        <input id="password" type="password" placeholder="비밀번호(6자 이상)" minlength="6" required />
        <button type="submit" id="loginSubmit">로그인</button>
        <button type="button" id="signupBtn" class="ghost-btn">회원가입</button>
      </form>
      <div id="authMsg"></div>
    </section>

    <!-- (나) 로그인 후 화면 — 메모장 (처음엔 숨김) -->
    <section id="memoView" hidden>
      <h1>나만 보이는 메모</h1>
      <p class="hint">
        아래 목록은 <strong>지금 로그인한 사람의 메모만</strong> 보여줍니다.
        다른 계정으로 로그인하면 완전히 다른 메모가 보입니다.
      </p>

      <form id="memoForm" class="memo-form">
        <textarea id="memoContent" rows="3" placeholder="비밀 메모를 적어보세요…" required></textarea>
        <button type="submit">메모 추가</button>
      </form>

      <div id="memoMsg"></div>
      <ul id="memoList" class="memo-list">불러오는 중…</ul>
    </section>

  </main>

  <!-- Supabase 자바스크립트 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 1) 공통 설정: 클라이언트(db)를 만들어 둠 -->
  <script src="supabase.js"></script>
  <!-- 2) 화면 로직 -->
  <script>
    // ---- 화면 요소 모으기 ----
    const loginView   = document.getElementById("loginView");
    const memoView    = document.getElementById("memoView");
    const userArea    = document.getElementById("userArea");
    const userEmailEl = document.getElementById("userEmail");

    const authForm  = document.getElementById("authForm");
    const emailEl   = document.getElementById("email");
    const passwordEl= document.getElementById("password");
    const signupBtn = document.getElementById("signupBtn");
    const authMsg   = document.getElementById("authMsg");

    const memoForm    = document.getElementById("memoForm");
    const memoContent = document.getElementById("memoContent");
    const memoMsg     = document.getElementById("memoMsg");
    const memoList    = document.getElementById("memoList");
    const logoutBtn   = document.getElementById("logoutBtn");

    // ============================================================
    // 로그인 상태에 따라 어떤 화면을 보일지 결정
    // ============================================================
    async function refreshView() {
      const { data } = await db.auth.getUser();
      const user = data.user;

      if (user) {
        // 로그인됨 → 메모장 보이기
        loginView.hidden = true;
        memoView.hidden  = false;
        userArea.hidden  = false;
        userEmailEl.textContent = user.email;
        loadMemos();
      } else {
        // 로그아웃 상태 → 로그인 화면 보이기
        loginView.hidden = false;
        memoView.hidden  = true;
        userArea.hidden  = true;
      }
    }

    // ============================================================
    // 회원가입 / 로그인
    // ============================================================
    authForm.addEventListener("submit", async (e) => {
      e.preventDefault();              // 폼 기본 제출(새로고침) 막기
      showAuthMsg("로그인 중…", "info");
      const { error } = await db.auth.signInWithPassword({
        email: emailEl.value.trim(),
        password: passwordEl.value,
      });
      if (error) { showAuthMsg("로그인 실패: " + error.message, "error"); return; }
      clearAuthMsg();
      refreshView();
    });

    signupBtn.addEventListener("click", async () => {
      if (!emailEl.value || passwordEl.value.length < 6) {
        showAuthMsg("이메일과 6자 이상 비밀번호를 입력하세요.", "error");
        return;
      }
      showAuthMsg("가입 중…", "info");
      const { data, error } = await db.auth.signUp({
        email: emailEl.value.trim(),
        password: passwordEl.value,
      });
      if (error) { showAuthMsg("가입 실패: " + error.message, "error"); return; }

      // 이메일 인증이 켜져 있으면 session이 아직 없습니다(메일 확인 필요).
      if (!data.session) {
        showAuthMsg("가입 완료! 메일함의 인증 링크를 누른 뒤 로그인하세요.", "info");
        return;
      }
      clearAuthMsg();
      refreshView();
    });

    logoutBtn.addEventListener("click", async () => {
      await db.auth.signOut();
      memoList.innerHTML = "";
      refreshView();
    });

    // ============================================================
    // 메모 불러오기 — "내 메모 다 줘"라고만 요청한다.
    //   where user_id = ... 같은 필터를 우리가 쓰지 않습니다.
    //   RLS가 '내 것만' 자동으로 걸러주기 때문입니다. (← 이번 실습의 핵심)
    // ============================================================
    async function loadMemos() {
      memoList.textContent = "불러오는 중…";
      const { data, error } = await db
        .from("memos")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) { memoList.textContent = "에러: " + error.message; return; }

      if (!data.length) {
        memoList.innerHTML = '<li class="empty">아직 메모가 없어요. 위에서 하나 추가해 보세요.</li>';
        return;
      }

      memoList.innerHTML = data.map((row) =>
        '<li class="memo-item" data-id="' + row.id + '">' +
          '<div class="memo-text">' + escapeHtml(row.content) + '</div>' +
          '<div class="memo-meta">' + new Date(row.created_at).toLocaleString("ko-KR") + '</div>' +
          '<button class="del-btn" data-id="' + row.id + '">삭제</button>' +
        '</li>'
      ).join("");
    }

    // ============================================================
    // 메모 추가 — user_id를 직접 안 넣습니다.
    //   테이블의 default auth.uid() 가 '지금 로그인한 사람'으로 자동 채웁니다.
    //   (남의 user_id를 억지로 넣어도 RLS의 with check 가 막아줍니다.)
    // ============================================================
    memoForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = memoContent.value.trim();
      if (!content) return;

      const { error } = await db.from("memos").insert({ content: content });
      if (error) { showMemoMsg("저장 실패: " + error.message, "error"); return; }

      memoContent.value = "";
      clearMemoMsg();
      loadMemos();
    });

    // ============================================================
    // 메모 삭제 — id로만 지웁니다.
    //   "남의 id"를 적어 지우려 해도 RLS가 막아서 0줄만 지워집니다.
    // ============================================================
    memoList.addEventListener("click", async (e) => {
      const btn = e.target.closest(".del-btn");
      if (!btn) return;
      const id = btn.dataset.id;
      const { error } = await db.from("memos").delete().eq("id", id);
      if (error) { showMemoMsg("삭제 실패: " + error.message, "error"); return; }
      loadMemos();
    });

    // ---- 작은 도우미들 ----
    function showAuthMsg(text, type) {
      authMsg.textContent = text;
      authMsg.className = "show " + (type || "info");
    }
    function clearAuthMsg() { authMsg.textContent = ""; authMsg.className = ""; }

    function showMemoMsg(text, type) {
      memoMsg.textContent = text;
      memoMsg.className = "show " + (type || "info");
    }
    function clearMemoMsg() { memoMsg.textContent = ""; memoMsg.className = ""; }

    // 사용자가 넣은 글에 태그가 끼어들지 않도록 최소한의 안전 처리
    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    // 페이지가 열리면 현재 로그인 상태부터 확인
    refreshView();
  </script>
</body>
</html>
