<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>탭 메뉴 위젯</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>이번 주 카페 소개</h1>
    <p class="desc">위 탭을 눌러 보고 싶은 정보를 골라 보세요.</p>

    <!--
      탭 메뉴는 '버튼 줄(탭)'과 '내용 칸(패널)'으로 나뉩니다.
      짝을 맞추는 비밀은 data-tab 과 data-panel 의 값입니다.
      예) data-tab="menu" 버튼을 누르면 data-panel="menu" 패널이 보입니다.
    -->

    <!-- 1) 탭 버튼 줄 -->
    <!-- role="tablist": 이 영역이 '탭 묶음'임을 보조기기에 알려줍니다. -->
    <div class="tabs" role="tablist">
      <!-- aria-selected: 지금 선택된 탭인지(true/false)를 표시합니다. -->
      <button class="tab is-active" data-tab="menu"  role="tab" aria-selected="true">메뉴</button>
      <button class="tab"           data-tab="hours" role="tab" aria-selected="false">영업시간</button>
      <button class="tab"           data-tab="map"   role="tab" aria-selected="false">오시는 길</button>
    </div>

    <!-- 2) 탭 내용(패널) — 버튼과 data 값이 짝을 이룹니다 -->
    <div class="panels">
      <!-- data-panel="menu" → "메뉴" 버튼과 짝 -->
      <section class="panel is-active" data-panel="menu" role="tabpanel">
        <h2>메뉴</h2>
        <ul>
          <li>아메리카노 — 4,000원</li>
          <li>카페라떼 — 4,500원</li>
          <li>오늘의 디저트 — 5,500원</li>
        </ul>
      </section>

      <!-- data-panel="hours" → "영업시간" 버튼과 짝 -->
      <section class="panel" data-panel="hours" role="tabpanel">
        <h2>영업시간</h2>
        <ul>
          <li>평일: 오전 8시 ~ 오후 10시</li>
          <li>주말: 오전 10시 ~ 오후 11시</li>
          <li>매월 첫째 주 월요일 휴무</li>
        </ul>
      </section>

      <!-- data-panel="map" → "오시는 길" 버튼과 짝 -->
      <section class="panel" data-panel="map" role="tabpanel">
        <h2>오시는 길</h2>
        <p>부산 해운대구 해변로 100, 1층</p>
        <p>지하철 2호선 해운대역 3번 출구에서 도보 5분</p>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
