<!DOCTYPE html>
<!--
  reference.html — "디자인 시안(참고 이미지)" 역할을 하는 파일입니다.
  ──────────────────────────────────────────────────────────────
  이 실습의 핵심은 "이 화면을 글로 설명하지 않고, 이미지(스크린샷)로 AI에게 보여주고
  똑같이 만들라고 시키는" 멀티모달 프롬프트 연습입니다.

  그래서 이 파일은 "정답 코드를 베끼라고 주는 게 아니라" 화면(시안)을 만들어 주는 용도입니다.
  → 이 파일을 브라우저로 열고, 가운데 카드 부분을 "스크린샷"으로 캡처하세요.
  → 그 스크린샷 한 장만 AI에게 첨부해서 "이거랑 똑같이 만들어줘"라고 시킵니다.
  → AI가 만든 결과물을 이 폴더의 index.html(정답 재현본)과 눈으로 비교합니다.

  (스크린샷 캡처법: Windows = Win+Shift+S, Mac = Cmd+Shift+4)
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>디자인 시안 — 프로필 카드 (이 화면을 스크린샷 하세요)</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #f1f5f9;
      font-family: "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .hint {
      max-width: 360px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
      line-height: 1.6;
    }
    .hint strong { color: #0f172a; }

    /* ↓↓↓ 여기 카드 부분을 스크린샷 하세요 ↓↓↓ */
    .card {
      width: 320px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
      overflow: hidden;
      text-align: center;
      padding-bottom: 24px;
    }

    .card__banner {
      height: 96px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
    }

    .card__avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #e2e8f0;
      border: 4px solid #ffffff;
      margin: -48px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .card__name {
      margin: 14px 0 2px;
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .card__role {
      margin: 0 0 16px;
      font-size: 14px;
      color: #64748b;
    }

    .card__stats {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 0 0 20px;
    }
    .card__stat-num {
      font-size: 18px;
      font-weight: 700;
      color: #0f172a;
    }
    .card__stat-label {
      font-size: 12px;
      color: #94a3b8;
    }

    .card__btn {
      display: inline-block;
      padding: 10px 28px;
      border: none;
      border-radius: 999px;
      background: #6366f1;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    /* ↑↑↑ 여기까지가 시안 카드입니다 ↑↑↑ */
  </style>
</head>
<body>
  <p class="hint">
    아래 <strong>카드 한 장</strong>을 스크린샷으로 캡처해서<br />
    AI에게 첨부하고 "이거랑 똑같이 만들어줘"라고 시키세요.<br />
    (코드는 보지 말고 <strong>이미지만</strong> 주는 게 핵심)
  </p>

  <div class="card">
    <div class="card__banner"></div>
    <div class="card__avatar">🦊</div>
    <h2 class="card__name">김여우</h2>
    <p class="card__role">프론트엔드 디자이너</p>
    <div class="card__stats">
      <div>
        <div class="card__stat-num">128</div>
        <div class="card__stat-label">게시물</div>
      </div>
      <div>
        <div class="card__stat-num">8.2k</div>
        <div class="card__stat-label">팔로워</div>
      </div>
      <div>
        <div class="card__stat-num">312</div>
        <div class="card__stat-label">팔로잉</div>
      </div>
    </div>
    <button class="card__btn">팔로우</button>
  </div>
</body>
</html>
