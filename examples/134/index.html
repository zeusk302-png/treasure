<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 유지 — 세션 읽기 실습</title>
  <style>
    body { font-family: system-ui, "Malgun Gothic", sans-serif; max-width: 440px; margin: 60px auto; padding: 0 16px; line-height: 1.6; }
    h1 { color: #7b5e3b; }
    input { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #7b5e3b; color: #fff; border: 0; border-radius: 999px; cursor: pointer; font-size: 1rem; }
    button:disabled { opacity: 0.6; cursor: default; }
    /* 두 영역 모두 처음엔 숨겨두고, 세션을 읽은 뒤 JS가 맞는 쪽을 켭니다 */
    #loggedOut, #loggedIn { display: none; }
    #loggedOut.show, #loggedIn.show { display: block; }
    .card { margin-top: 16px; padding: 16px; border-radius: 12px; background: #f6f1e9; }
    .email { font-weight: 700; color: #2e7d32; }
    #msg { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; background: #fdecea; color: #c62828; }
    #msg.show { display: block; }
    .hint { color: #777; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>로그인 유지 실습</h1>
  <p class="hint">로그인한 다음 이 페이지를 <strong>새로고침(F5)</strong> 해보세요. 로그인이 풀리지 않고 그대로 유지됩니다.</p>

  <!-- 로그인 전: 로그인 폼 -->
  <section id="loggedOut">
    <form id="loginForm">
      <input id="email" type="email" placeholder="이메일" required />
      <input id="password" type="password" placeholder="비밀번호" required />
      <button type="submit">로그인</button>
    </form>
    <div id="msg"></div>
  </section>

  <!-- 로그인 후: 환영 카드 + 로그아웃 -->
  <section id="loggedIn">
    <div class="card">
      <p><span class="email" id="userEmail"></span>님, 로그인 상태입니다.</p>
      <p class="hint">지금 새로고침해도 이 화면이 그대로 나옵니다.</p>
    </div>
    <button id="logoutBtn">로그아웃</button>
  </section>

  <!-- Supabase 자바스크립트 라이브러리 (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 아래 두 값을 내 Supabase 프로젝트 값으로 바꾸세요. (Settings → API)
    // anon(publishable) 키는 공개돼도 되는 '출입증'이라 브라우저에 둬도 됩니다.
    // service_role(secret) 키는 절대 여기에 넣지 마세요 — RLS를 통째로 우회합니다.
    const SUPABASE_URL = "https://여기에-내-프로젝트.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_여기에-내-anon-키";

    // createClient는 기본으로 persistSession: true 입니다.
    // = 로그인하면 토큰을 브라우저 localStorage에 저장 → 새로고침해도 세션이 남아 있음.
    // (아래는 기본값이라 사실 안 써도 되지만, '무엇이 켜져 있는지' 보이게 적어둡니다.)
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,    // 세션을 저장 → 새로고침/재방문해도 로그인 유지
        autoRefreshToken: true   // 만료 전 토큰을 자동으로 갱신
      }
    });

    const loggedOutEl = document.getElementById('loggedOut');
    const loggedInEl = document.getElementById('loggedIn');
    const userEmailEl = document.getElementById('userEmail');
    const msgEl = document.getElementById('msg');
    const loginBtn = document.querySelector('#loginForm button');

    // 세션 유무에 따라 어떤 화면을 보여줄지 정하는 함수
    function render(session) {
      if (session) {
        // 세션이 있다 = 로그인 상태 → 환영 카드를 보여준다
        userEmailEl.textContent = session.user.email;
        loggedInEl.classList.add('show');
        loggedOutEl.classList.remove('show');
      } else {
        // 세션이 없다 = 로그아웃 상태 → 로그인 폼을 보여준다
        loggedOutEl.classList.add('show');
        loggedInEl.classList.remove('show');
      }
    }

    // ★ 핵심: 페이지가 열리는 순간 getSession으로 '지금 로그인돼 있는지'를 읽습니다.
    //    새로고침해도 localStorage에 토큰이 남아 있으면 session이 들어옵니다.
    async function checkSession() {
      const { data, error } = await db.auth.getSession();
      if (error) {
        console.error(error);
        render(null);
        return;
      }
      render(data.session); // 로그인돼 있으면 session 객체, 아니면 null
    }
    checkSession();

    // 로그인 처리
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      loginBtn.disabled = true;
      msgEl.classList.remove('show');

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      loginBtn.disabled = false;

      if (error) {
        msgEl.textContent = '로그인 실패: ' + error.message;
        msgEl.classList.add('show');
        return;
      }
      // 로그인 성공 → 세션이 생겼으니 화면을 다시 그린다
      render(data.session);
    });

    // 로그아웃 처리 → 세션을 지우고 다시 로그인 폼으로
    document.getElementById('logoutBtn').addEventListener('click', async function () {
      await db.auth.signOut();
      render(null);
    });
  </script>
</body>
</html>
