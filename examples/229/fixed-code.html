<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 회원 정보 (보안 리뷰 반영 버전)</title>
</head>
<body>
  <!--
    이 파일은 보안 리뷰(SECURITY-REVIEW.md)의 ❌/⚠️ 를 고친 버전입니다.
    바뀐 점:
      1) 비밀키(service_role) → 공개키(anon / sb_publishable_) 로 교체.
      2) 회원 "전체" 조회 → 로그인한 "본인" 행만 조회 (RLS가 막아줌).
      3) 콘솔에 전체 데이터/에러 원문 그대로 뱉던 것 제거.
    URL/키는 자리표시자입니다. 본인 Supabase 값으로 바꿔 쓰세요.
  -->
  <h1>내 회원 정보</h1>
  <ul id="member-list"></ul>
  <p id="msg"></p>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ✅ 프론트에는 공개키(anon / sb_publishable_)만 둔다.
    //    이 값은 화면에 보여도 안전하다. RLS가 남의 데이터를 막아주기 때문.
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_YOUR_PUBLIC_KEY";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ✅ "*" 전체가 아니라 보여줄 컬럼만, 그리고 RLS 정책상 "본인 행"만 돌아온다.
    //    (fixed-policy.sql 의 "본인 회원정보만 읽기" 정책이 통째 조회를 막는다)
    const { data, error } = await supabase
      .from("members")
      .select("name, phone, email");

    const ul = document.getElementById("member-list");
    const msg = document.getElementById("msg");

    if (error) {
      // ✅ 에러 원문/내부 구조를 그대로 노출하지 않고, 사용자용 메시지만 보여준다.
      msg.textContent = "정보를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
    } else if (!data || data.length === 0) {
      msg.textContent = "표시할 내 정보가 없습니다. (로그인이 필요할 수 있어요)";
    } else {
      data.forEach((m) => {
        const li = document.createElement("li");
        li.textContent = `${m.name} / ${m.phone} / ${m.email}`;
        ul.appendChild(li);
      });
    }
  </script>
</body>
</html>
