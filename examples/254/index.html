<!DOCTYPE html>
<!--
  이 파일은? 예약 화면의 "뼈대(구조)"입니다.
  무엇: 날짜 입력칸, 시간 버튼이 들어갈 빈 자리, 선택 요약 박스, 예약하기 버튼을 배치합니다.
  왜 이렇게 나눴나: 보이는 모양(style.css)과 동작(script.js)을 별도 파일로 분리해서,
    이 HTML은 "무엇이 어디에 있는지"만 책임지게 했습니다. (역할이 섞이면 고치기 어려워집니다)
  주의: 시간 버튼은 여기에 직접 쓰지 않고 script.js가 자동으로 채웁니다.
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예약하기 - 날짜·시간 선택</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>예약하기</h1>
    <p class="subtitle">원하는 날짜와 시간을 골라 주세요.</p>

    <!-- 1단계: 날짜 선택 -->
    <section class="field">
      <label for="reserve-date">1. 날짜 선택</label>
      <input type="date" id="reserve-date" />
      <p class="hint">오늘 이전 날짜는 고를 수 없어요.</p>
    </section>

    <!-- 2단계: 시간 선택 -->
    <section class="field">
      <label>2. 시간 선택</label>
      <!-- 시간 버튼들이 JavaScript로 이 안에 채워집니다 -->
      <div id="time-slots" class="time-slots">
        <p class="placeholder">먼저 날짜를 선택하세요.</p>
      </div>
    </section>

    <!-- 선택 결과 요약 -->
    <!-- hidden 속성: 처음엔 숨겨 둡니다. 날짜·시간을 다 고르면 script.js가 hidden을 풀어 보여 줍니다.
         (아무것도 안 고른 상태에서 빈 요약을 보여 주면 어색하기 때문) -->
    <section class="summary" id="summary" hidden>
      <p>선택한 예약</p>
      <strong id="summary-text"></strong>
    </section>

    <!-- 예약하기 버튼: 날짜와 시간을 모두 골라야 눌립니다 -->
    <!-- disabled로 시작하는 이유: 덜 고른 상태에서 눌러 빈 예약이 만들어지는 실수를 막으려고
         처음부터 비활성(회색)으로 둡니다. 조건이 충족되면 script.js가 disabled를 풉니다.
         type="button"인 이유: <form>의 기본 제출(새로고침)을 막아 우리가 짠 동작만 실행되게 하려는 것 -->
    <button type="button" id="reserve-btn" disabled>예약하기</button>

    <!-- 예약 완료 메시지 -->
    <p class="done-message" id="done-message" hidden></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
