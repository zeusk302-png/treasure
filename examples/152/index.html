<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <!-- 휴대폰에서도 글자 크기가 정상으로 보이게 하는 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>실시간 도서 검색 — 검색어를 주소에 안전하게 끼우기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>🔎 실시간 도서 검색</h1>
    <p class="lead">
      입력창에 글자를 치면, 그 검색어를 <strong>주소(URL)</strong>에 끼워 넣어
      공개 도서 API에 요청을 보냅니다. 핵심은 <strong>"사용자가 친 글자를 주소에 안전하게 합치기"</strong>입니다.
    </p>

    <!-- 검색창. form으로 감싸면 Enter로도 즉시 검색할 수 있다. -->
    <form id="searchForm" class="searchBar">
      <input
        id="keyword"
        type="text"
        placeholder="예: 해리포터, 어린왕자, c++ 프로그래밍"
        value="해리포터"
        autocomplete="off"
      />
      <button type="submit">검색</button>
    </form>

    <!-- ★학습 포인트★ 우리가 실제로 만들어 보낸 '주소'를 눈으로 보여주는 칸.
         사용자가 친 글자가 어떻게 주소로 바뀌는지 직접 확인하는 것이 이번 실습의 핵심이다. -->
    <div class="urlBox">
      <span class="urlLabel">실제로 요청한 주소 ↓</span>
      <code id="urlView" class="urlView">(아직 검색 전)</code>
    </div>

    <!-- 받아오는 중/결과 없음/실패 안내가 들어갈 자리 -->
    <p id="status" class="status">검색어를 입력하면 자동으로 검색됩니다.</p>

    <!-- 책 카드들이 들어갈 목록(ul). 처음에는 비어 있다. -->
    <ul id="bookList" class="bookList"></ul>
  </main>

  <!-- 화면(HTML)을 다 그린 뒤에 동작(JS)을 불러온다 -->
  <script src="script.js"></script>
</body>
</html>
