# =============================================================================
# 이 파일은 무엇인가:
#   docker-compose.yml — "어떤 컨테이너들을, 어떻게, 어떻게 연결해서 띄울지"를
#   한 장에 적은 무대 큐시트입니다. 여기서는 두 서비스를 정의합니다.
#     - web : 우리가 만든 Node.js 웹앱 (브라우저로 보는 화면)
#     - db  : Postgres 데이터베이스 (방문 기록을 저장하는 곳)
# 왜 있는가:
#   "docker compose up" 한 줄로 앱과 DB를 동시에 띄우고 서로 연결하기 위해서입니다.
#   누가 이 폴더를 받아도 같은 명령 한 줄이면 똑같은 개발 환경이 재현됩니다.
#   (= 환경을 코드로 박제 → "내 컴퓨터에선 됐는데" 문제 제거)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # db : Postgres 데이터베이스 서비스
  # ---------------------------------------------------------------------------
  db:
    # 공식 postgres 이미지를 그대로 사용 — DB를 직접 설치할 필요가 없습니다.
    # 버전을 16으로 고정하는 이유: "latest"는 어느 날 갑자기 버전이 바뀌어
    # 동작이 달라질 수 있어, 재현성을 위해 숫자로 못 박습니다.
    image: postgres:16

    # 환경변수로 DB 초기 계정/이름을 설정합니다.
    # 값은 docker-compose.yml에 직접 박지 않고 .env에서 ${...}로 주입 —
    # 비밀번호 같은 값을 코드/깃에 노출하지 않으려는 습관입니다.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # 컨테이너 안의 DB 데이터를 named volume(db-data)에 저장합니다.
    # 왜 필요한가: 이게 없으면 컨테이너를 지우는 순간 데이터도 사라집니다.
    # volume에 두면 "down 후 다시 up" 해도 방문 기록이 그대로 보존됩니다.
    #
    # 또한 init.sql을 docker-entrypoint-initdb.d에 마운트합니다.
    # 왜: Postgres는 "처음 빈 DB로 뜰 때" 이 폴더의 .sql을 자동 실행합니다.
    # → 테이블 만드는 작업을 사람이 손으로 안 해도 됩니다.
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    # healthcheck: "DB가 진짜로 접속 가능해졌는지"를 주기적으로 점검합니다.
    # 왜 필요한가: 컨테이너가 '떴다'와 'DB가 접속을 받을 준비됐다'는 다릅니다.
    # 앱이 너무 빨리 접속을 시도하면 ECONNREFUSED로 죽는 흔한 문제를,
    # 아래 web의 depends_on(condition: service_healthy)과 짝지어 막습니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # web : 우리가 만든 Node.js 앱 서비스
  # ---------------------------------------------------------------------------
  web:
    # 미리 만들어진 이미지를 받는 게 아니라, 이 폴더의 Dockerfile로 직접 굽습니다.
    build: .

    # 컨테이너 안의 3000 포트를 내 PC의 3000 포트로 연결합니다.
    # 왼쪽(호스트):오른쪽(컨테이너). 이게 있어야 브라우저로 localhost:3000 접속 가능.
    ports:
      - "3000:3000"

    # 앱이 DB에 접속할 때 쓸 정보를 환경변수로 넘깁니다.
    # ★ 가장 중요한 한 줄: DB_HOST가 "localhost"가 아니라 "db" 입니다.
    #   왜? compose가 만든 같은 네트워크 안에서는 '서비스 이름'이 곧 '호스트 이름'이 됩니다.
    #   즉 web 컨테이너 입장에서 Postgres는 localhost가 아니라 "db"라는 이름의 옆집입니다.
    #   (localhost로 적으면 "내 컨테이너 안"을 가리켜 DB를 못 찾고 ENOTFOUND/ECONNREFUSED 발생)
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

    # depends_on + condition: web은 "db가 healthcheck를 통과한 뒤"에 시작합니다.
    # 왜: 앱이 DB보다 먼저 떠서 연결 실패로 죽는 사고를 방지합니다.
    depends_on:
      db:
        condition: service_healthy

    # bind mount: 내 PC의 소스 파일을 컨테이너 안 /app에 그대로 연결합니다.
    # 왜(개발 편의): 코드를 고치면 이미지를 다시 굽지 않아도 컨테이너에 즉시 반영됩니다.
    # (운영 배포에서는 보통 이 mount를 빼고 이미지 안 코드로 고정합니다 — 여기선 개발용)
    # node_modules는 컨테이너 안에서 설치한 것을 쓰도록 익명 volume으로 덮어씁니다.
    volumes:
      - ./:/app
      - /app/node_modules

# named volume 선언: 위 db 서비스가 참조하는 db-data 저장소를 만듭니다.
# 이 이름으로 데이터가 컨테이너와 분리되어 보존됩니다.
volumes:
  db-data:
