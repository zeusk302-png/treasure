<!doctype html>
<!--
  이 파일은 무엇? : 동네 빵집 소개 페이지(정답본)입니다.
  왜 있나?       : 이 실습의 핵심은 화면이 아니라 <head> 안의 Open Graph(OG) 메타태그입니다.
                   카톡·페북·슬랙에 링크를 붙였을 때 "제목+설명+큰 사진" 미리보기 카드가
                   뜨게 하려면 어떤 태그를 어떻게 적어야 하는지 그대로 보여주는 견본이라
                   여기에 둡니다. <body> 본문이 단순한 것은 의도된 것입니다.
-->
<html lang="ko">
  <head>
    <!-- ✅ 기본 메타 3종 (어느 페이지에나 필요) -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ 검색결과(구글)에 보이는 제목과 설명 -->
    <title>우리 빵집 - 갓 구운 빵을 매일 아침에</title>
    <meta
      name="description"
      content="매일 아침 직접 굽는 통밀 식빵과 버터 크루아상. 부산 동래구 작은 동네 빵집입니다."
    />

    <!-- ========================================================= -->
    <!-- ✅ Open Graph(OG) 태그: 카카오톡·페이스북·슬랙 등에 링크를   -->
    <!--    붙였을 때 뜨는 "미리보기 카드"를 만드는 태그들입니다.     -->
    <!--    공통 규칙: <meta property="og:..." content="..."> 형태   -->
    <!--    (name=이 아니라 property= 인 점에 주의!)                  -->
    <!-- ========================================================= -->

    <!-- og:title — 미리보기 카드의 굵은 제목 -->
    <meta property="og:title" content="우리 빵집 - 갓 구운 빵을 매일 아침에" />

    <!-- og:description — 제목 아래에 보이는 한두 줄 설명 -->
    <meta
      property="og:description"
      content="매일 아침 직접 굽는 통밀 식빵과 버터 크루아상. 부산 동래구 작은 동네 빵집입니다."
    />

    <!-- og:image — 카드에 크게 박히는 대표 이미지.                  -->
    <!--   ⚠️ 반드시 https:// 로 시작하는 "전체 주소(절대경로)"여야  -->
    <!--   카톡·페북 서버가 가져갈 수 있습니다. images/og.png 처럼   -->
    <!--   상대경로로 적으면 미리보기에 그림이 안 뜹니다.            -->
    <!--   아래 https://example.com 부분을 여러분의 실제 배포 주소로  -->
    <!--   (예: https://my-bakery.vercel.app) 바꿔 주세요.           -->
    <meta property="og:image" content="https://example.com/images/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="우리 빵집 대표 이미지 - 갓 구운 빵 사진" />

    <!-- og:url — 이 페이지의 대표 주소(공유했을 때 연결될 곳) -->
    <meta property="og:url" content="https://example.com/" />

    <!-- og:type — 페이지 종류. 일반 사이트는 website, 글이면 article -->
    <meta property="og:type" content="website" />

    <!-- og:site_name — 사이트(브랜드) 이름. 카드 위쪽에 작게 표시됨 -->
    <meta property="og:site_name" content="우리 빵집" />

    <!-- og:locale — 언어/지역. 한국어는 ko_KR -->
    <meta property="og:locale" content="ko_KR" />

    <!-- (선택) 트위터(X)는 OG를 거의 그대로 읽지만, 큰 사진 카드를 -->
    <!-- 확실히 띄우려면 아래 한 줄을 추가해 두면 좋습니다.        -->
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 0 auto;
        padding: 24px;
        line-height: 1.6;
        color: #222;
      }
      h1 {
        margin-bottom: 4px;
      }
      .lead {
        color: #666;
      }
      .note {
        margin-top: 28px;
        padding: 16px 20px;
        background: #fdf6ec;
        border: 1px solid #efd9b8;
        border-radius: 12px;
        font-size: 0.95rem;
      }
      code {
        background: #f3f3f3;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>우리 빵집</h1>
    <p class="lead">매일 아침 직접 굽는 통밀 식빵과 버터 크루아상.</p>

    <p>
      이 페이지의 진짜 실습은 <strong>화면</strong>이 아니라
      <strong>&lt;head&gt; 안의 OG 태그</strong>에 있습니다. 브라우저에서
      마우스 우클릭 → "페이지 소스 보기"로 위쪽 메타태그들을 확인해 보세요.
    </p>

    <div class="note">
      <strong>테스트하는 법</strong><br />
      이 사이트를 Vercel 등으로 배포한 뒤, 그 실제 주소를
      <code>https://developers.facebook.com/tools/debug/</code> 에 넣으면
      카드 미리보기를 직접 볼 수 있어요. (자세한 검증법은 README 참고)
    </div>
  </body>
</html>
