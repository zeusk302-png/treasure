<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>드래그앤드롭 파일 첨부</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>파일 첨부</h1>
    <p class="desc">
      아래 점선 영역에 파일을 끌어다 놓거나, 영역을 클릭해서 파일을 고르세요.
      이미지는 작은 미리보기로, 다른 파일은 파일명과 크기로 보여 줍니다.
    </p>

    <!--
      드롭 영역.
      - 클릭하면 숨겨둔 input[type=file] 을 대신 눌러 파일 선택창을 연다.
      - 키보드로도 쓸 수 있게 tabindex / role 을 달아 둔다.
    -->
    <div id="dropZone" class="dropzone" tabindex="0" role="button"
         aria-label="파일을 끌어다 놓거나 클릭해서 선택하세요">
      <p class="dz-icon">⬆</p>
      <p class="dz-text">여기로 파일을 끌어다 놓으세요</p>
      <p class="dz-sub">또는 클릭해서 파일 선택 (여러 개 가능)</p>
    </div>

    <!--
      실제 파일 입력칸. 화면에서는 숨기지만(input은 sr-only),
      기능은 그대로 살아 있어서 드롭존을 클릭하면 이 칸을 대신 눌러 준다.
      multiple = 여러 파일을 한 번에 고를 수 있음.
    -->
    <input type="file" id="fileInput" class="sr-only" multiple
           accept="image/*,.pdf,.txt,.zip" />

    <!-- 고른 파일들이 카드로 쌓이는 자리 -->
    <ul id="fileList" class="file-list" aria-live="polite"></ul>

    <!-- 첨부된 파일이 하나도 없을 때 보여줄 안내문 -->
    <p id="emptyMsg" class="empty">아직 첨부된 파일이 없습니다.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
