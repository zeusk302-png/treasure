<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>요청 한 번만 — (고친 정답 버전)</title>
  <!-- React를 따로 설치하지 않고 CDN으로 바로 불러옵니다(연습용). -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- 브라우저에서 JSX를 바로 해석하게 해주는 도구(연습용). 실전에선 빌드 단계에서 처리합니다. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #f1f7f2;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 16px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      width: 460px;
      max-width: 100%;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 { margin-top: 0; font-size: 18px; color: #256029; }
    .count {
      font-size: 40px;
      font-weight: bold;
      color: #256029;
      font-variant-numeric: tabular-nums;
    }
    .label { color: #777; font-size: 13px; }
    .status { margin-top: 8px; font-size: 14px; color: #444; }
    .note {
      margin-top: 16px;
      font-size: 13px;
      color: #256029;
      background: #e6f4ea;
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.6;
    }
    code { background: #e7efe9; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- type="text/babel" : 이 안의 JSX를 브라우저가 해석합니다(연습용) -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // =====================================================================
    // 고침 1) "처음 한 번만 fetch" — 빈 의존성 배열 [] + 정리(cleanup)
    // ---------------------------------------------------------------------
    // useEffect의 두 번째 인자에 빈 배열 [] 을 주면, 이 effect는 컴포넌트가
    // "처음 화면에 나타날 때 딱 한 번"만 실행됩니다. effect 안에서 setState를
    // 해도 다시 실행되지 않으므로 무한 고리가 생기지 않습니다.
    //
    // 추가로 "정리 함수(cleanup)"를 돌려줘서, 컴포넌트가 사라질 때 진행 중인
    // 요청 결과를 버리도록 가드를 넣었습니다(요청이 늦게 와도 안전).
    // =====================================================================
    function 한번만요청() {
      const [상태, set상태] = useState("불러오는 중...");

      // ✅ FIX: 빈 의존성 배열 [] → "처음 한 번만" 실행.
      useEffect(() => {
        let 살아있음 = true; // ✅ 가드: 컴포넌트가 사라지면 결과를 무시

        // 진짜 서버 대신 0.4초 뒤 응답이 오는 것을 흉내 냅니다(가짜 fetch).
        const 타이머 = setTimeout(() => {
          if (!살아있음) return;          // ✅ 이미 사라졌으면 setState 하지 않음
          set상태("완료! 요청은 단 1번만 나갔습니다.");
          console.log("fetch 완료 — 이 로그는 딱 한 번만 찍힙니다.");
        }, 400);

        // ✅ 정리 함수: 컴포넌트가 사라질 때 호출됨 → 타이머 취소 + 가드 끄기
        return () => {
          살아있음 = false;
          clearTimeout(타이머);
        };
      }, []); // ← 핵심: 빈 배열 [] (특정 값에 반응시키려면 [그값] 을 넣음)

      return (
        <div>
          <div className="label">초기 데이터 불러오기</div>
          <div className="status">{상태}</div>
        </div>
      );
    }

    // =====================================================================
    // 고침 2) "버튼 누를 때만 1씩" — 무한 effect 대신 사용자 이벤트로 증가
    // ---------------------------------------------------------------------
    // 숫자를 올리고 싶으면 effect로 돌리지 말고, "버튼 클릭" 같은 사용자
    // 이벤트가 일어날 때만 setState 하면 됩니다. 폭주가 원천 차단됩니다.
    // =====================================================================
    function 안전카운터() {
      const [count, setCount] = useState(0);
      return (
        <div style={{ marginTop: 18 }}>
          <div className="label">버튼을 누른 만큼만 올라갑니다</div>
          <div className="count">{count}</div>
          <button onClick={() => setCount(count + 1)}>+1</button>
        </div>
      );
    }

    // =====================================================================
    // 고침 3) "종료 조건이 있는 자기 호출" — 멈추는 지점을 명시
    // ---------------------------------------------------------------------
    // 자기 자신을 부르는 함수에는 반드시 "여기서 멈춘다"는 종료 조건을 둡니다.
    // n 이 0 이 되면 더 부르지 않고 끝납니다 → 무한 재귀가 아닙니다.
    // =====================================================================
    function 카운트다운(n) {
      if (n <= 0) {              // ✅ FIX: 종료 조건 — 0 이하면 멈춤
        console.log("발사!");
        return;
      }
      console.log(n);
      카운트다운(n - 1);          // 매번 n 이 1씩 작아져 결국 0에 도달 → 안전
    }
    카운트다운(3); // 콘솔에 3, 2, 1, 발사! 가 한 번씩 찍히고 멈춥니다

    function App() {
      return (
        <div className="card">
          <h1>요청 한 번만 (고친 정답 버전)</h1>
          <한번만요청 />
          <안전카운터 />
          <p className="note">
            <b>F12 → Network(네트워크)</b> 탭을 열고 새로고침해 보세요. 초기 요청은
            <b> 딱 1번</b>만 나가고 멈춥니다. <b>Console(콘솔)</b>에도
            <code>fetch 완료</code> 로그가 한 번, <code>카운트다운</code> 로그가
            <code>3 → 2 → 1 → 발사!</code> 로 한 번씩만 찍힙니다.<br />
            비결 세 가지: ① <code>useEffect</code>에 <b>빈 배열 []</b>(또는 필요한 값만 넣은 배열),
            ② 자기 호출엔 <b>종료 조건</b>, ③ 진행 중 요청엔 <b>정리(cleanup)/가드</b>.
          </p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
