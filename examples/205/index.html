<!--
  무엇: 방문자가 이름·이메일·문의 내용을 적어 보내는 '문의 폼' 페이지의 화면(구조)입니다.
  왜 있나: 이 폼이 자동화의 '시작 버튼' 역할을 합니다. 보내기를 누르면 style.css(모양)와
          script.js(동작)가 함께 작동해, 입력값을 n8n Webhook으로 보내고 슬랙 알림을 띄웁니다.
          즉 이 파일은 '뼈대(구조)', style.css는 '옷(모양)', script.js는 '행동(동작)' 담당입니다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문의하기 — 폼 제출 시 알림 받기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>문의하기</h1>
    <p class="lead">
      아래 폼을 작성해 보내면, 내용이 곧바로 슬랙(또는 메일)으로 알림이 갑니다.
    </p>

    <!-- 진짜 페이지 이동(새로고침)을 막기 위해 onsubmit에서 기본 동작을 멈추고
         JavaScript(fetch)로 직접 데이터를 보냅니다. -->
    <form id="contactForm" novalidate>
      <label for="name">이름</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="홍길동"
        required
        minlength="2"
      />

      <label for="email">이메일</label>
      <!-- type="email"로 두면 브라우저가 '@' 없는 값 등을 알아서 막아 줍니다.
           (서버에 닿기 전 1차 검증 — 잘못된 문의가 n8n까지 가지 않게 거르는 것) -->
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      />

      <label for="message">문의 내용</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        placeholder="궁금한 점이나 하고 싶은 말을 적어 주세요."
        required
        minlength="5"
      ></textarea>

      <button type="submit" id="submitBtn">보내기</button>

      <!-- 제출 결과(성공/실패)를 사용자에게 보여 주는 영역입니다. -->
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
