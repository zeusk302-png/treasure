<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>좋아요 버튼 — (고친 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #f4f1ea;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 40px 48px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 20px; color: #444; }
    .like-btn {
      font-size: 28px;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: #ffe3ea;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .like-btn:active { transform: scale(0.94); }
    .count {
      margin-top: 20px;
      font-size: 18px;
      color: #c2185b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>이 글이 마음에 드시나요?</h1>
    <button id="likeBtn" class="like-btn">🤍 좋아요</button>
    <p class="count">좋아요 <span id="likeCount">0</span>개</p>
  </div>

  <script>
    const btn = document.getElementById("likeBtn");
    const countEl = document.getElementById("likeCount");
    let count = 0;

    // 클릭하면 좋아요를 1 올리고 화면에 표시하는 함수
    function addLike() {
      count = count + 1;
      countEl.textContent = count;
      btn.textContent = "❤️ 좋아요";
    }

    // FIXED: 같은 버튼·같은 함수는 "딱 한 번만" 등록합니다.
    //        리스너가 하나뿐이니 클릭 한 번에 addLike() 도 한 번만 실행 → +1.
    btn.addEventListener("click", addLike);
  </script>
</body>
</html>
