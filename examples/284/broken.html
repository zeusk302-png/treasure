<!--
  이 파일은 무엇인가: "좋아요 버튼" 데모의 [일부러 고장 낸 버전]입니다.
  왜 있는가: 디버깅 챌린지 실습용 파일입니다. 클릭 한 번에 좋아요가 +2씩 오르는
            버그(이벤트 리스너 중복 등록)를 직접 눈으로 보고, 어디가 문제인지
            스스로 찾아보라고 일부러 망가뜨려 둔 것입니다.
            고친 정답은 같은 폴더의 index.html 에 있으니 비교해 보세요.
  찾을 곳: 맨 아래 <script> 안 "BUG:" 주석이 달린 부분.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>좋아요 버튼 — (고장난 버전)</title>
  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", sans-serif;
      background: #f4f1ea;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      padding: 40px 48px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin-top: 0; font-size: 20px; color: #444; }
    .like-btn {
      font-size: 28px;
      padding: 14px 28px;
      border: none;
      border-radius: 999px;
      background: #ffe3ea;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .like-btn:active { transform: scale(0.94); }
    .count {
      margin-top: 20px;
      font-size: 18px;
      color: #c2185b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>이 글이 마음에 드시나요?</h1>
    <button id="likeBtn" class="like-btn">🤍 좋아요</button>
    <p class="count">좋아요 <span id="likeCount">0</span>개</p>
  </div>

  <script>
    const btn = document.getElementById("likeBtn");
    const countEl = document.getElementById("likeCount");
    let count = 0;

    // 클릭하면 좋아요를 1 올리고 화면에 표시하는 함수
    function addLike() {
      count = count + 1;
      countEl.textContent = count;
      btn.textContent = "❤️ 좋아요";
    }

    // BUG: 똑같은 버튼에 같은 함수를 두 번 등록했습니다.
    //      그래서 클릭 한 번에 addLike() 가 "두 번" 실행되어 +2씩 오릅니다.
    btn.addEventListener("click", addLike);
    btn.addEventListener("click", addLike);
  </script>
</body>
</html>
