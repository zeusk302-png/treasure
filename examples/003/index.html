<!DOCTYPE html>
<!-- 이 문서가 HTML5 문서임을 브라우저에게 알려주는 선언입니다 -->
<html lang="ko">
  <head>
    <!-- 글자가 깨지지 않도록 문자 인코딩을 UTF-8로 지정합니다 -->
    <meta charset="UTF-8" />
    <!-- 모바일에서도 적절한 크기로 보이도록 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 브라우저 탭에 표시되는 제목입니다 -->
    <title>나의 웹개발 공부 목차</title>
  </head>
  <body>
    <!--
      제목 태그는 h1부터 h6까지 6단계가 있습니다.
      숫자가 작을수록 더 중요하고 글자도 더 큽니다.
      h1 = 가장 큰 대제목(책 제목), h6 = 가장 작은 소제목(맨 아래 세부 항목)
      이렇게 위계(중요도 순서)를 지키면 책의 목차처럼 한눈에 구조가 보입니다.
    -->

    <!-- h1: 책 제목에 해당하는 가장 큰 제목 (한 페이지에 보통 1개) -->
    <h1>여러분을 위한 웹개발 가이드</h1>

    <!-- h2: 큰 단원(챕터) 제목 -->
    <h2>1부. 웹의 뼈대 HTML</h2>

    <!-- h3: 단원 안의 절 제목 -->
    <h3>1장. HTML 문서의 구조</h3>

    <!-- h4: 절 안의 작은 항목 -->
    <h4>1-1. 문서의 골격 만들기</h4>

    <!-- h5: 더 작은 세부 항목 -->
    <h5>html, head, body 태그</h5>

    <!-- h6: 가장 작은 세부 항목 -->
    <h6>각 태그의 역할 알아보기</h6>

    <!-- 다시 h2로 돌아와 두 번째 큰 단원을 시작합니다 -->
    <h2>2부. 화면을 꾸미는 CSS</h2>

    <h3>1장. 색과 글꼴 바꾸기</h3>

    <h3>2장. 레이아웃 잡기</h3>

    <h4>2-1. 플렉스박스로 가로 정렬하기</h4>
  </body>
</html>
