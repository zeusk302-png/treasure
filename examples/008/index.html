<!DOCTYPE html>
<!--
  이 파일은 무엇? : "특별한 링크 두 가지"를 보여주는 실습용 HTML 한 장입니다.
  왜 있나? : 똑같은 <a> 태그라도 속성(target, href의 mailto:)만 바꾸면
             "새 탭에서 열기"와 "메일 쓰기 창 열기"가 된다는 것을 눈으로 확인하려고 만들었습니다.
  보는 법 : 이 파일을 더블클릭해 브라우저로 열면 됩니다(서버·설치 필요 없음, 순수 HTML).
-->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>새 탭 링크와 메일 보내기 링크</title>
</head>
<body>
  <h1>특별한 링크 두 가지</h1>
  <p>같은 &lt;a&gt; 태그라도, 속성을 조금 바꾸면 "새 탭에서 열기"나 "메일 쓰기 창 열기"가 됩니다.</p>

  <hr />

  <h2>1) 새 탭(새 창)에서 열리는 링크</h2>
  <!--
    핵심: target="_blank" 를 붙이면 링크가 "새 탭"에서 열립니다.
    이렇게 하면 지금 보고 있던 내 페이지가 사라지지 않고 그대로 남아 있어요.
    rel="noopener noreferrer" 는 새 탭 보안을 위한 안전장치입니다(거의 항상 같이 씁니다).
  -->
  <ul>
    <li>
      <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
        구글을 새 탭에서 열기
      </a>
    </li>
    <li>
      <!-- 비교용: target 이 없으면 "현재 탭"에서 열려서 내 페이지를 덮어씁니다. -->
      <a href="https://www.naver.com">
        네이버를 현재 탭에서 열기 (비교용)
      </a>
    </li>
  </ul>

  <hr />

  <h2>2) 누르면 메일 쓰기 창이 열리는 링크</h2>
  <!--
    핵심: href 를 "mailto:받는사람주소" 로 적으면, 누를 때 메일 작성 창이 열립니다.
    (휴대폰/PC에 메일 앱이 설정되어 있어야 창이 뜹니다.)
    ? 뒤에 subject(제목), body(내용)를 미리 채워줄 수도 있어요.
  -->
  <ul>
    <li>
      <a href="mailto:hello@example.com">
        hello@example.com 으로 메일 보내기
      </a>
    </li>
    <li>
      <a href="mailto:hello@example.com?subject=문의합니다&body=안녕하세요,%20궁금한%20점이%20있어요.">
        제목과 내용이 미리 채워진 메일 보내기
      </a>
    </li>
  </ul>

  <hr />

  <p>
    더 알아보기:
    <a href="https://developer.mozilla.org/ko/docs/Web/HTML/Element/a" target="_blank" rel="noopener noreferrer">
      a 태그 공식 설명서(MDN)
    </a>
  </p>
</body>
</html>
